      <div class="au-rail"><span class="au-dot ${x.k==='viewed'||x.k==='surfaced'?'grey':''}"></span>${i<a.audit.length-1?'<span class="au-line"></span>':''}</div>
      <div class="au-body"><div class="au-t">${esc(x.s)}</div><div class="au-s">${esc(x.d?x.d+' · ':'')}${esc(x.t?stamp(new Date(x.t)):'')}</div></div></div>`).join('')}</div>
    <div class="rowbtns" style="margin-top:10px"><button class="btn sm" onclick="openAttention('${a.id}')">${icon('users',12)}Ownership &amp; action</button></div>
  </div>`).join('')}</div>`+viewFoot();
};

/* ====================================================== TRENDS & ASSURANCE */
function trendsBody(embed){
  const byWeek=[0,1,2,3,4,5].map(w=>{
    const lo=w*168,hi=(w+1)*168;
    return{w:w,raised:EVENTS.filter(e=>e.raised>=lo&&e.raised<hi).length};
  }).reverse();
  const maxR=Math.max.apply(null,byWeek.map(b=>b.raised))||1;
  const bySece={};openEvents().forEach(e=>{bySece[e.sece]=(bySece[e.sece]||0)+1;});
  const maxS=Math.max.apply(null,Object.keys(bySece).map(k=>bySece[k]))||1;
  const head=embed?hSec('Leading trends','Arrivals by week and open records by SECE. Both are counts from the register, not projections.'):'';
  return head+`<div class="grid-2">
    <div class="panel"><div class="panel-head"><h3>Records raised, by week</h3><span class="panel-tag">last six weeks</span></div>
      ${byWeek.map((b,i)=>`<div class="bar-row"><span class="bar-label">${i===byWeek.length-1?'This week':(byWeek.length-1-i)+' week'+(byWeek.length-1-i===1?'':'s')+' ago'}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${Math.round(b.raised/maxR*100)}%;background:var(--accent)"></span></span>
        <span class="bar-val">${b.raised}</span></div>`).join('')}
      <div class="tiny" style="margin-top:10px">Arrivals only. Without a closure date on the source rows, an arrivals-against-closures
        trend cannot be drawn — it is the single highest-value field missing. ${provI('held')}</div></div>
    <div class="panel"><div class="panel-head"><h3>Open records by SECE</h3><span class="panel-tag">${openEvents().length} open</span></div>
      ${Object.keys(bySece).sort((a,b)=>bySece[b]-bySece[a]).map(k=>{
        const b=BARRIERS.find(x=>x.sece.indexOf(k)>-1),st=b?barrierState(b.id):null;
        return `<div class="bar-row"><span class="bar-label" style="width:200px;font-size:11.5px">${esc(k)}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${Math.round(bySece[k]/maxS*100)}%;background:${st?(st.key==='impaired'?'var(--red)':st.key==='degraded'?'var(--amber)':'var(--green)'):'var(--grey)'}"></span></span>
          <span class="bar-val">${bySece[k]}</span></div>`;}).join('')}</div>
  </div>`;
}
V.trends=function(){
  const t1=EVENTS.filter(e=>e.tier<=2).length;
  return secHead('Trends & assurance','What the register is telling you over time',
    'Everything here is counted from the same records. Where a trend cannot be drawn because a field is missing, it says so rather than drawing a line through the gap.')+
  trendsBody(false)+
  hSec('Assurance position')+
  `<div class="grid-3">
    <div class="kpi-card ${overdueEvents().length>3?'red':'amber'}"><div class="kpi-name">Records past planned finish</div>
      <div class="kpi-val">${overdueEvents().length}</div><div class="kpi-target">${overdueEvents().length?'worst '+Math.abs(Math.min.apply(null,overdueEvents().map(e=>horizon(e).d)))+' days':'nothing past planned finish'}</div></div>
    <div class="kpi-card amber"><div class="kpi-name">Temporary repairs in service</div>
      <div class="kpi-val">${openEvents().filter(e=>e.kind==='dlr').length}</div>
      <div class="kpi-target">${openEvents().filter(e=>e.kind==='dlr'&&!horizon(e)).length} with no defined life recorded</div></div>
    <div class="kpi-card ${t1/EVENTS.length>.5?'green':'amber'}"><div class="kpi-name">Placement confidence T1–T2</div>
      <div class="kpi-val">${Math.round(t1/EVENTS.length*100)}%</div><div class="kpi-target">${t1} of ${EVENTS.length} placed from a tag or area code</div></div>
  </div>`+
  `<div class="spacer"></div>
  <div class="gapnote"><div class="gh">${icon('alert',12)}What a longer history would add</div>
    The extract carries a raised date and nothing else. With a closure date, Clarity would show arrivals against closures, true backlog ageing and
    mean time to close per register. With an inspection history, it would tell a first finding from a recurring one. Both are asked for in the data map.</div>`+
  viewFoot();
};

/* ============================================================== ASK CLARITY */
function ask(q){
  STATE.thread.push({me:true,t:q});
  STATE.thread.push(answer(q));
  if(parseHash().view!=='ask')go('ask');else render();
  setTimeout(()=>{const el=$("#threadEnd");if(el)el.scrollIntoView({behavior:'smooth',block:'end'});},80);
}
function askAbout(id){const a=attnById(id);closeModal();ask('Who owns the response to the '+a.title.toLowerCase()+'?');}
function link(label,fn){return `<button class="ask-chip" onclick="${fn}">${esc(label)}</button>`;}
function answer(q){
  const s=q.toLowerCase(),w=STATE.prefs.window;
  const A={conc:'',body:'',refs:[],links:[],infer:''};
  const ranked=rankedAttention();

  if(/chang|new|last \d+|48|24|overnight|since/.test(s)){
    const ch=changed(w),raised=ch.filter(e=>e.closedAt==null),closed=ch.filter(e=>e.closedAt!=null);
    A.conc=cap(numw(raised.length))+' record'+(raised.length===1?'':'s')+' raised and '+numw(closed.length)+' closed on the asset in '+windowLabel(w).toLowerCase()+'.';
    A.body='<ul>'+ch.map(e=>'<li><span class="mono">'+esc(e.id)+'</span> — '+esc(e.title)+' · '+esc(SYSTEMS[e.system].n)+' · '+
      esc(e.zone?zoneName(e.zone):'no location on the row')+' · '+esc(ago(e.changedHrs))+(e.closedAt!=null?' · <span class="tone-green">closed</span>':'')+'</li>').join('')+'</ul>';
    const hs=hotspots(w);
    if(hs.length)A.body+='<p style="margin:10px 0 0">The relationship the source systems cannot see: <strong>'+numw(hs[0].events.length)+
      '</strong> of them land on <strong>'+esc(zoneName(hs[0].zone))+'</strong>, from '+numw(uniq(hs[0].events.map(e=>e.system)).length)+' different systems.</p>';
    A.links=[['Open what changed',"go('home')"],['Show on the asset',"handleLink('zone','"+(hs[0]?hs[0].zone:'main-e')+"')"]];
  }
  else if(/unassigned|no owner|without an owner/.test(s)){
    const un=ATTENTION.filter(a=>!a.owner&&!a.done);
    A.conc=un.length?cap(numw(un.length))+' attention item'+(un.length===1?' has':'s have')+' no owner.':'Every attention item has an owner.';
    A.body=un.length?'<ul>'+un.map(a=>'<li><strong>'+esc(a.title)+'</strong> — '+esc(a.area)+', '+numw(a.events.length)+
      ' records across '+numw(uniq(attnEvents(a).map(e=>e.system)).length)+' systems, due '+esc(a.due?dueLabel(a.due):'no date set')+'</li>').join('')+'</ul>'
      :'<p>All '+numw(ATTENTION.filter(a=>!a.done).length)+' open items are assigned.</p>';
    if(un.length)A.links=[['Assign a coordinator',"openAttention('"+un[0].id+"')"],['Filter the queue',"handleLink('ownfilter','unass')"]];
  }
  else if(/assigned.*unacknowledg|unacknowledg|awaiting/.test(s)){
    const aw=ATTENTION.filter(a=>a.owner&&a.owner!==ME&&a.assignedBy===ME&&!a.ack&&!a.done);
    A.conc=aw.length?cap(numw(aw.length))+' item'+(aw.length===1?'':'s')+' you assigned '+(aw.length===1?'has':'have')+' not been acknowledged.':'Everything you have assigned has been acknowledged.';
    A.body=aw.length?'<ul>'+aw.map(a=>'<li><strong>'+esc(a.title)+'</strong> — '+esc(person(a.owner).name)+', assigned '+
      esc(a.assignedAt?stamp(a.assignedAt):'—')+', due '+esc(a.due?dueLabel(a.due):'no date set')+'</li>').join('')+'</ul>':'';
    A.infer='Acknowledgement is a Clarity state. No source register carries one, so this cannot be checked against the systems of record.';
    if(aw.length)A.links=[['Open the item',"openAttention('"+aw[0].id+"')"],['Filter the queue',"handleLink('ownfilter','awaiting')"]];
  }
  else if(/who owns|owner of|responsib/.test(s)){
    let a=ATTENTION.find(x=>s.indexOf(x.title.toLowerCase().slice(0,12))>-1)||ranked[0];
    if(/support|process.deck|process deck/.test(s))a=attnById('A1');
    if(/power|generat/.test(s))a=attnById('A2');
    if(/firewater|pump/.test(s))a=attnById('A3');
    const src=uniq(attnEvents(a).map(e=>e.owner).filter(Boolean));
    A.conc=a.owner?person(a.owner).name+' is the attention owner for '+a.title.toLowerCase()+'.'
                  :'Nobody owns the response to '+a.title.toLowerCase()+'.';
    A.body='<ul><li><strong>Attention owner</strong> — '+(a.owner?esc(person(a.owner).name)+', '+esc(person(a.owner).role)+
      (a.ack?', acknowledged':', not yet acknowledged'):'unassigned')+'</li>'+
      '<li><strong>Source owners</strong> — '+src.map(o=>esc(person(o).name)+' ('+numw(attnEvents(a).filter(e=>e.owner===o).length)+' record'+(attnEvents(a).filter(e=>e.owner===o).length===1?'':'s')+')').join(', ')+'</li>'+
      '<li>Response required '+esc(a.due?dueLabel(a.due):'— no date set')+'</li></ul>';
    A.infer='No owner field was supplied with any of the three registers. Every name here is illustrative, and is shown to demonstrate the routing that field would unlock.';
    A.links=[['Take ownership',"takeOwnership('"+a.id+"')"],['Assign a colleague',"startAssign('"+a.id+"')"],['Show on the asset',"handleLink('zone','"+a.zone+"')"]];
  }
  else if(/containment|loss of containment|exposure|cumulative|increasing/.test(s)){
    const c=cumulative();
    const cb=barrierState('contain');
    A.conc='Three things are increasing loss-of-containment exposure on the asset: the process-area concentration, the temporary repairs carrying no expiry, and the essential-power dependency behind the compensating measures.';
    A.body='<ul>'+
      '<li><strong>Hydrocarbon containment</strong> is <strong>'+esc(cb.w)+'</strong> — '+cb.n+' open records, '+
        cb.events.filter(e=>e.kind==='dlr').length+' of them temporary repairs</li>'+
      '<li>'+numw(openEvents().filter(e=>e.kind==='dlr'&&!horizon(e)).length)+' temporary repair'+(openEvents().filter(e=>e.kind==='dlr'&&!horizon(e)).length===1?' has':'s have')+
        ' no defined life recorded anywhere</li>'+
      '<li>Combined exposure across the two coupled items reads <strong>'+c.comb+'</strong>, ×'+c.amp+' on their average of '+c.avg+'</li></ul>';
    A.infer='Exposure here is a severity comparison. No probability or PFD data exists in any register, so this must not be read as a risk calculation.';
    A.links=[['Open cumulative risk',"go('cumulative')"],['Open the containment barrier',"handleLink('barrier','contain')"]];
  }
  else if(/impaired.*recovery|no recovery date|impaired barrier/.test(s)){
    const imp=BARRIERS.filter(b=>barrierState(b.id).key==='impaired');
    const rows=imp.map(b=>({b:b,none:barrierState(b.id).events.filter(e=>!horizon(e))}));
    const bad=rows.filter(r=>r.none.length);
    A.conc=bad.length?cap(numw(bad.length))+' of the '+numw(imp.length)+' impaired barriers '+(bad.length===1?'has':'have')+' at least one record with no recovery date.'
                     :'Every record against an impaired barrier carries a recovery date.';
    A.body='<ul>'+rows.map(r=>'<li><strong>'+esc(r.b.name)+'</strong> — '+
      (r.none.length?numw(r.none.length)+' record'+(r.none.length===1?'':'s')+' with no end date: '+r.none.map(e=>'<span class="mono">'+esc(e.id)+'</span>').join(', ')
        :'all records carry an end date')+'</li>').join('')+'</ul>';
    A.infer='End dates are parsed out of the status free text. No structured expiry field exists, so a wording change at source would silently drop a record out of this answer.';
    A.links=[['Open barrier health',"go('barriers')"],['Open the expiry runway',"go('barriers')"]];
  }
  else if(/missing|data|gap|confiden|provenance|evidence/.test(s)){
    const noloc=EVENTS.filter(e=>!e.zone).length,nodate=noHorizonEvents().length;
    A.conc='Five fields are missing, and two of them change what this page can honestly claim.';
    A.body='<ul>'+NOT_HELD.slice(0,5).map(n=>'<li><strong>'+esc(n[0])+'</strong> — '+esc(n[1])+'</li>').join('')+'</ul>'+
      '<p style="margin:10px 0 0">In the register as supplied: '+numw(noloc)+' records have no location at all, '+numw(nodate)+
      ' have no end date anywhere, '+numw(EVENTS.filter(e=>e.held).length)+' of '+EVENTS.length+' are held for a current feed and the rest carry the shape of the data.</p>';
    A.infer='A confident wrong answer is worse than an honest data gap. Where a figure cannot be sourced this page shows it as unavailable rather than filling the space.';
    A.links=[['Open the data map',"go('datamap')"]];
  }
  else if(/attention|today|need|priorit/.test(s)){
    A.conc=cap(numw(ranked.length))+' item'+(ranked.length===1?'':'s')+' need'+(ranked.length===1?'s':'')+' attention on the asset today.';
    A.body='<ul>'+ranked.map(a=>'<li><strong>'+a._rank+' — '+esc(a.title)+'</strong> ('+esc(a.rag)+') · '+esc(a.area)+' · '+
      (a.owner?'owner '+esc(person(a.owner).name)+(a.ack?', acknowledged':', awaiting acknowledgement'):'<span class="tone-amber">unassigned</span>')+
      ' · due '+esc(a.due?dueLabel(a.due):'no date set')+'</li>').join('')+'</ul>'+
      '<p style="margin:10px 0 0">Ranked on exposure, barrier condition, interdependency, action urgency, potential escalation, recency and evidence confidence — not on due date.</p>';
    A.links=ranked.slice(0,2).map(a=>['Open '+a.title,"openAttention('"+a.id+"')"]);
  }
  else{
    A.conc='I can answer that from the register, but I need it narrowed down.';
    A.body='<p>Everything on this page comes from '+EVENTS.length+' records across '+uniq(EVENTS.map(e=>e.system)).length+
      ' registers, '+ZONES.length+' asset zones and '+BARRIERS.length+' barriers, inside '+esc(scopeLabel())+' and '+
      esc(windowLabel(STATE.prefs.window).toLowerCase())+'. Try one of these:</p>';
    A.links=ASK_SUGGEST.slice(0,4).map(q=>[q,'ask('+JSON.stringify(q).replace(/"/g,'&quot;')+')']);
  }
  return{me:false,a:A};
}
V.ask=function(){

      return `<div class="sysrow" style="cursor:default">
        <span class="ss-dot" style="width:9px;height:9px;border-radius:2px;background:${s.s==='feeding'?'var(--green)':s.s==='named'?'var(--amber)':'var(--ink-3)'}"></span>

  </div>
  <div class="tiny" style="margin-top:12px">Clarity integrates with systems not shown here. The three that feed this demonstration are the three
    the material supplied; the anomaly and temporary-repair register is real, but nothing in the material named the system behind it,

   <div class="pspi-g">${PSPI_CATEGORIES.map(c=>`
     <div class="pspi ${c.asset?'':'pspi-x'}">

function openProv(k){
  const d=PROV[k];if(!d)return;
  openModal(mhead(d.k,d.t)+
    msec('What this is',`<div class="mbody">${esc(d.what)}</div>`)+
    msec('How it is derived',`<div class="mbody">${d.rule}</div>`)+
    msec('Fields it depends on',`<div class="kv">${(d.f||[]).map(fid=>{const f=fieldById(fid);if(!f)return'';

   ${rel.length?msec('Related operational conditions — '+numw(rel.length)+' open against this barrier',
     `<div class="da-rel">${rel.map(e=>`

          <span class="sevdot sev-${e.sev}" title="${SEV_WORD[e.sev]}"></span>
        </button>`).join('')}</div>`):''}
   <div class="statuscap">${icon('info',11)} ${esc(STATUS_CAPTION)}</div>${stdFoot()}`;
};

function openDualWhy(id){
  const d=dualAssurance(id),b=d.bar,mahs=mahsForBarrier(id);
  const ev=d.t3.events;
  const steps=[];
  steps.push(esc(b.name)+' is a critical barrier for '+mahs.map(m=>esc(m.short)).join(' and ')+'.');
  steps.push('Tier 3 barrier performance is <strong>'+KEYW[d.t3.key].toLowerCase()+'</strong> — '+esc(d.t3.lines[0])+'.');
  steps.push('Tier 4 assurance performance is <strong>'+KEYW[d.t4.key].toLowerCase()+'</strong> — '+d.t4.plan+
             '% of planned activity complete against a '+d.t4.target+'% target.');
  if(d.t4.act)steps.push(d.t4.act+' assurance action'+(d.t4.act===1?'':'s')+' overdue.');
  if(d.t3.overdue)steps.push(d.t3.overdue+' record'+(d.t3.overdue===1?'':'s')+' past a planned finish date.');
  const zones=uniq(ev.map(e=>e.zone).filter(Boolean));
  if(zones.length===1)steps.push('All of it sits in one area — '+esc(zoneName(zones[0]))+'.');
  else if(zones.length>1)steps.push('Spread across '+numw(zones.length)+' areas of the asset.');
  const sys=uniq(ev.map(e=>e.system));
  openModal(mhead('Why Clarity highlighted this',b.name)+
    msec('What I noticed',`<ol class="whyol">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>`)+
    msec('Why it matters',`<div class="mbody">${esc(d.s)}</div>`)+
    msec('What evidence supports it',
      `<div class="mbody"><strong>${ev.length}</strong> evidence record${ev.length===1?'':'s'} across
        <strong>${sys.length}</strong> source system${sys.length===1?'':'s'}${sys.length?' — '+sys.map(s=>esc(SYSTEMS[s].n)).join(', '):''}.
        ${d.t4.held?'':'<br><br>The Tier 4 side carries no source record: no assurance-completion feed was supplied.'}</div>
       <div class="obtns" style="margin-top:10px">
         <button class="obtn cy" onclick="closeModal();go('dual','${id}')">${icon('eye',12)}<span>View source evidence</span></button>
       </div>`));
}
</script>
<script>
"use strict";
/* ============================================================================
   DEPENDENCY VIEWS  (§5–§8, §16)
   Not the spreadsheet on screen. The question is never "what does the matrix
   say" but "this has degraded — what else is now exposed, and is any of it
   already weak?"
   ========================================================================== */

const DEPC={T:'red',H:'red',M:'amber',L:'watch',N:'green'};

function depNote(){
  return `<div class="gapnote ok" style="margin:12px 0"><div class="gh">${icon('check',12)}These relationships are the operator's</div>
    Dependency values come from the operator's own <strong>SECE Dependency Matrix</strong> — ${SECE_DEP.length} Mittelplate
    SECEs and ${SECE_DEP.reduce((a,s)=>a+Object.keys(s.dep).length,0)} relationships, using the five-level scale and
    wording from that workbook. None of them is invented. The grouping of those SECEs into the hub's ten working
    barriers is Clarity's, and is marked wherever it is used. ${provI('dep')}</div>`;
}

/* ------------------------------------------------ DEPENDENCY IMPACT (a barrier) */
V.depend=function(arg){
  const id=arg||STATE.depBar||'power';
  STATE.depBar=id;
  const b=barrierById(id)||BARRIERS[0], own=seceOfBarrier(b.id);
  const imp=dependencyImpact(b.id), con=dependencyConcern(b.id), da=dualAssurance(b.id);
  const strong=imp.filter(x=>DEP_DEF[x.d].rank>=3).length;
  return secHead('Dependency impact',b.name,
    'If this degrades, what else is exposed — and is any of it already weak?'+provI('dep'))+
  `<div class="dp-head">
     <div class="dp-src">
       <div class="dp-l">Degraded SECE group</div>
       <div class="dp-n">${esc(b.name)}</div>
       <div class="dp-s">Tier 3 <b class="tone-${KEYC[da.t3.key]}">${KEYW[da.t3.key]}</b> ·
                          Tier 4 <b class="tone-${KEYC[da.t4.key]}">${KEYW[da.t4.key]}</b></div>
       <div class="dp-c">${own.map(s=>`<span class="dp-chip">${esc(s)} ${esc(seceName(s))}</span>`).join('')}</div>
     </div>
     <div class="dp-count">
       <div class="dp-cv">${imp.length}</div>
       <div class="dp-cl">dependent SECEs<br>potentially affected</div>
       ${strong?`<div class="dp-cs">${strong} total or high</div>`:''}
     </div>
     <div class="dp-pick">
       <label>Barrier</label>
       <select onchange="go('depend',this.value)">
         ${BARRIERS.map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${esc(x.name)}</option>`).join('')}
       </select>
     </div>
   </div>

   ${con?`<div class="dp-concern">
      <div class="dp-ct">${icon('alert',13)} Evidence convergence</div>
      <div class="dp-cb">${esc(con.text)}</div>
      <div class="cv-act">
        <button class="whybtn" onclick="openDepWhy('${b.id}')">${icon('info',12)} Why am I seeing this?</button>
        <button class="obtn cy" onclick="go('dual','${con.sece.bar}')">${icon('shield',12)}<span>Open ${esc(barrierById(con.sece.bar).short)}</span></button>
      </div></div>`:''}

   ${imp.length?`<div class="dp-list">${imp.map(x=>`
      <button class="dp-row ${x.alreadyWeak?'dp-weak':''}" ${x.bar?`onclick="go('dual','${x.bar}')"`:''}>
        <span class="dp-d dp-${DEPC[x.d]}">${esc(DEP_DEF[x.d].w.toUpperCase())}</span>
        <span class="dp-rn"><b>${esc(x.n)}</b><i>${esc(x.id)} · relies on ${esc(seceName(x.via))}</i></span>
        <span class="dp-rs">${x.da?`Tier 3 <b class="tone-${KEYC[x.da.t3.key]}">${KEYW[x.da.t3.key]}</b> ·
            Tier 4 <b class="tone-${KEYC[x.da.t4.key]}">${KEYW[x.da.t4.key]}</b>`:'<i>not mapped to a hub barrier</i>'}</span>
        ${x.alreadyWeak?`<span class="dp-flag">already weak</span>`:'<span></span>'}
      </button>`).join('')}</div>`
    :`<div class="spanel" style="cursor:default">Nothing in the supplied matrix records a dependency on this barrier's SECEs.</div>`}

   ${msec('What this barrier itself relies on',
     own.length?`<div class="dp-list">${uniq([].concat.apply([],own.map(s=>supportsOf(s).map(x=>x.id+'|'+x.d))))
       .map(k=>{const [sid,d]=k.split('|');const bar=barrierOfSece(sid);
       return `<button class="dp-row" ${bar?`onclick="go('depend','${bar}')"`:''}>
         <span class="dp-d dp-${DEPC[d]}">${esc(DEP_DEF[d].w.toUpperCase())}</span>
         <span class="dp-rn"><b>${esc(seceName(sid))}</b><i>${esc(sid)}</i></span>
         <span class="dp-rs tiny">${esc(DEP_DEF[d].s.split('—')[0])}</span><span></span>
       </button>`;}).join('')}</div>`:'<div class="tiny">No supporting dependencies recorded.</div>')}

   ${depNote()}<div class="statuscap">${icon('info',11)} ${esc(STATUS_CAPTION)}</div><div class="statuscap">${icon('info',11)} ${esc(STATUS_CAPTION)}</div>${stdFoot()}`;
};

function openDepWhy(barId){
  const b=barrierById(barId), da=dualAssurance(barId), con=dependencyConcern(barId);
  const imp=dependencyImpact(barId);
  const steps=[];
  steps.push('<strong>'+esc(b.name)+'</strong> is currently '+KEYW[da.t3.key].toLowerCase()+
             ' on Tier 3 barrier performance.');
  if(da.t4.key==='weakening')steps.push('Its Tier 4 assurance is behind plan — '+da.t4.plan+'% against '+da.t4.target+'%.');
  steps.push('the supplied SECE dependency matrix records <strong>'+imp.length+'</strong> other SECE'+
             (imp.length===1?'':'s')+' relying on it.');
  if(con){
    const t=con.sece;
    steps.push('<strong>'+esc(t.n)+'</strong> has a <strong>'+DEP_DEF[t.d].w.toLowerCase()+
               '</strong> dependency on it — '+esc(DEP_DEF[t.d].s));
    if(t.da&&t.da.t3.key==='weakening')steps.push(esc(t.n)+' already has an active impairment of its own.');
    if(t.da&&t.da.t4.key==='weakening')steps.push(t.da.t4.act+' of its own assurance activities are overdue.');
  }
  const g=convergence().find(x=>x.das.some(d=>d.bar.id===barId));
  if(g)steps.push('An active operational condition affects the same area — '+esc(g.name)+'.');
  openModal(mhead('Why Clarity highlighted this',b.name)+
    msec('What I noticed',`<ol class="whyol">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>`)+
    msec('Why it matters',`<div class="mbody">${con?esc(con.text):
      'This barrier supports others. A weakness here does not stay here.'}
      <br><br>This is a dependency relationship recorded by the operator, combined with the current condition of the
      dependent SECEs. Clarity is not asserting a quantified consequence — it is showing that two things which are
      managed separately are related.</div>`)+
    msec('What evidence supports it',
      `<div class="mbody">${da.t3.n} open record${da.t3.n===1?'':'s'} against this barrier ·
        ${imp.length} dependency relationship${imp.length===1?'':'s'} from the supplied matrix ·
        ${imp.filter(x=>x.alreadyWeak).length} dependent SECE${imp.filter(x=>x.alreadyWeak).length===1?'':'s'} already carrying a weakness.</div>
       <div class="obtns" style="margin-top:10px">
         <button class="obtn cy" onclick="closeModal();go('depend','${barId}')">${icon('layers',12)}<span>View dependencies</span></button>
         <button class="obtn" onclick="closeModal();go('dual','${barId}')">${icon('shield',12)}<span>View dual assurance</span></button>
       </div>`));
}

/* ------------------------------------------- BARRIER / SECE INTELLIGENCE (§16) */
V.sece=function(){
  const rows=BARRIERS.map(b=>{
    const da=dualAssurance(b.id), imp=dependencyImpact(b.id);
    return{b:b,da:da,imp:imp,weak:imp.filter(x=>x.alreadyWeak).length,
           strong:imp.filter(x=>DEP_DEF[x.d].rank>=3).length};
  }).sort((x,y)=>DA_ORDER[y.da.key]-DA_ORDER[x.da.key]||y.imp.length-x.imp.length);
  return secHead('Barrier / SECE assurance','Condition, assurance and dependency in one place',
    'For technical safety. Every row opens the complete evidence chain.'+provI('dep'))+
  `<div class="asr-wrap"><table class="asr"><thead><tr>
     <th>Barrier / SECE</th><th>Tier 3</th><th>Tier 4</th><th>Dependency</th><th>Trend</th><th>Attention</th>
   </tr></thead><tbody>
   ${rows.map(r=>`<tr onclick="go('dual','${r.b.id}')">
     <td class="asr-b"><b>${esc(r.b.name)}</b><i>${seceOfBarrier(r.b.id).map(esc).join(' · ')||'—'}</i></td>
     <td><span class="tone-${KEYC[r.da.t3.key]}">${KEYW[r.da.t3.key]}</span><i>${r.da.t3.n} open</i></td>
     <td><span class="tone-${KEYC[r.da.t4.key]}">${KEYW[r.da.t4.key]}</span><i>${r.da.t4.plan}% of plan</i></td>
     <td>${r.imp.length?`<button class="dp-mini" onclick="event.stopPropagation();go('depend','${r.b.id}')">
            ${r.imp.length} relationship${r.imp.length===1?'':'s'}${r.weak?` · <b class="tone-red">${r.weak} already weak</b>`:''}</button>`
          :'<i>none recorded</i>'}</td>
     <td class="asr-t tone-${TRC[r.da.t3.trend]}">${TR[r.da.t3.trend]}</td>
     <td><span class="asr-p asr-${r.da.c}">${esc(r.da.w)}</span></td>
   </tr>`).join('')}
   </tbody></table></div>${depNote()}<div class="statuscap">${icon('info',11)} ${esc(STATUS_CAPTION)}</div><div class="statuscap">${icon('info',11)} ${esc(STATUS_CAPTION)}</div>${stdFoot()}`;
};
</script>
<script>
"use strict";
/* ============================================================================
   CROSS-DOMAIN VIEWS
     V.operating  — one condition, its consequences in every domain (tram-lines)
     V.rules      — company rule / this asset / systemic weakness, kept apart
   ========================================================================== */

const ASC=s=>ATT_STATE[s].c;
const ASW=s=>ATT_STATE[s].w;

/* The line Mike wanted on every screen that uses colour. */
function notRiskNote(){
  return `<div class="notrisk">${icon('info',11)} ${esc(STATUS_CAPTION)}
    Colour here shows operational status only — no risk rating is assigned or implied.</div>`;
}

/* ------------------------------------------- THE CONNECTED OPERATING PICTURE */
V.operating=function(arg){
  const id=arg||STATE.condId||CONDITIONS[0].id;
  STATE.condId=id;
  const c=condById(id)||CONDITIONS[0];
  const reach=c.cons.filter(x=>x.s!=='ok');
  const ev=c.ev.map(eventById).filter(Boolean);
  return secHead('Connected operating picture',c.n,
    'One condition. What it means in each domain it reaches.'+provI('crossdomain'))+

  `<div class="xd-head">
     <div>
       <div class="xd-l">Underlying condition</div>
       <div class="xd-n">${esc(c.n)}</div>
       <div class="xd-r">${esc(c.root)}</div>
       <div class="xd-loc">${icon('pin',11)} ${esc(zoneName(c.zone))} ·
         reaches <b>${reach.length}</b> of ${DOMAINS.length} domains</div>
     </div>
     <div class="xd-pick">
       <label>Condition</label>
       <select onchange="go('operating',this.value)">
         ${CONDITIONS.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.n)}</option>`).join('')}
       </select>
     </div>
   </div>

   <div class="tram">
     <div class="tram-src"><span class="tram-dot"></span><span>${esc(c.n)}</span></div>
     <div class="tram-lines">
       ${c.cons.map(x=>{
         const d=domainById(x.d), on=x.s!=='ok';
         return `<div class="tram-row ${on?'on':'off'} t-${ASC(x.s)}">
           <svg class="tram-w" viewBox="0 0 60 44" preserveAspectRatio="none">
             <path d="M0 4 C30 4 30 40 60 40" fill="none"/></svg>
           <button class="tram-card" ${on?`onclick="openConsequence('${c.id}','${x.d}')"`:''}>
             <span class="tc-d">${icon(d.icon,13)} ${esc(d.n)}</span>
             <span class="tc-s tone-${ASC(x.s)}">${esc(ASW(x.s))}</span>
             <span class="tc-t">${esc(x.t)}</span>
             <span class="tc-b">${esc(x.s2)}</span>
             ${x.loss?`<span class="tc-x">${esc(x.loss)}</span>`:''}
           </button>
         </div>`;}).join('')}
     </div>
   </div>
   ${notRiskNote()}

   ${msec('The same evidence, read three ways',
     `<div class="mbody">These are not three issues. They are one condition — ${esc(c.n.toLowerCase())} —
       recorded once and carrying ${reach.length} consequence${reach.length===1?'':'s'}.
       A production engineer and a process safety engineer are looking at the same
       ${ev.length} source record${ev.length===1?'':'s'}, from different angles.</div>
      <div class="da-rel" style="margin-top:10px">${ev.map(e=>`
        <button class="da-row" onclick="openEventModal('${e.id}')">
          <span class="kb kb-${e.kind}">${KINDS[e.kind].label}</span>
          <span class="da-rt"><b>${esc(e.title)}</b><i>${esc(SYSTEMS[e.system].n)} · ${esc(e.status)}</i></span>
          <span class="sevdot sev-${e.sev}"></span>
        </button>`).join('')}</div>`)}

   <div class="obtns" style="margin-top:14px">
     <button class="obtn cy" onclick="openCondWhy('${c.id}')">${icon('info',12)}<span>Why am I seeing this?</span></button>
     <button class="obtn" onclick="handleLink('zone','${c.zone}')">${icon('pin',12)}<span>Show on asset</span></button>
   </div>${stdFoot()}`;
};

function openConsequence(cid,did){
  const c=condById(cid),x=consOf(c,did),d=domainById(did);
  openModal(mhead(d.n+' consequence',c.n)+
    msec('What this condition means here',
      `<div class="mbody"><strong class="tone-${ASC(x.s)}">${esc(ASW(x.s))}</strong> — ${esc(x.t)}
        <br><br>${esc(x.s2)}${x.loss?'<br><br><em>'+esc(x.loss)+'</em>':''}</div>`)+
    (x.bar?msec('Barrier carrying it',
      `<div class="mbody">${esc(barrierById(x.bar).name)} — Tier 3
        <strong class="tone-${KEYC[dualAssurance(x.bar).t3.key]}">${KEYW[dualAssurance(x.bar).t3.key]}</strong>.</div>
       <div class="obtns" style="margin-top:9px">
         <button class="obtn cy" onclick="closeModal();go('dual','${x.bar}')">${icon('shield',12)}<span>Open dual assurance</span></button>
       </div>`):'')+
    msec('The same condition elsewhere',
      `<div class="mbody">${c.cons.filter(y=>y.d!==did&&y.s!=='ok').map(y=>
        `<div style="margin-bottom:6px">${esc(domainById(y.d).n)} — <strong class="tone-${ASC(y.s)}">${esc(ASW(y.s))}</strong> · ${esc(y.t)}</div>`
        ).join('')||'No consequence recorded in the other domains.'}</div>`)+
    `<div class="notrisk" style="margin-top:12px">${icon('info',11)} Illustrative demonstration data. Colour shows attention, not a risk level.</div>`);
}

function openCondWhy(cid){
  const c=condById(cid),ev=c.ev.map(eventById).filter(Boolean);
  const reach=c.cons.filter(x=>x.s!=='ok');
  const steps=[
    'A single condition was identified in '+esc(zoneName(c.zone))+' — '+esc(c.n.toLowerCase())+'.',
    'It was built from <strong>'+ev.length+'</strong> source record'+(ev.length===1?'':'s')+
      ' across '+uniq(ev.map(e=>e.system)).length+' system'+(uniq(ev.map(e=>e.system)).length===1?'':'s')+'.'
  ];
  reach.forEach(x=>steps.push('In <strong>'+esc(domainById(x.d).n)+'</strong> it reads as '+
    esc(ASW(x.s).toLowerCase())+' — '+esc(x.t.toLowerCase())+'.'));
  if(reach.length>1)steps.push('Because the same condition reaches '+numw(reach.length)+
    ' domains, it would otherwise be managed as '+numw(reach.length)+' separate issues by '+
    numw(reach.length)+' different teams.');
  openModal(mhead('Why Clarity highlighted this',c.n)+
    msec('What I noticed',`<ol class="whyol">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>`)+
    msec('Why it matters',`<div class="mbody">${esc(c.root)}<br><br>Clarity is not judging how serious this is.
      It is showing that one condition has consequences in more than one place, and putting the evidence in front
      of the person who has to decide.</div>`)+
    msec('What evidence supports it',
      `<div class="da-rel">${ev.map(e=>`
        <button class="da-row" onclick="closeModal();openEventModal('${e.id}')">
          <span class="kb kb-${e.kind}">${KINDS[e.kind].label}</span>
          <span class="da-rt"><b>${esc(e.title)}</b><i>${esc(e.status)}</i></span>
        </button>`).join('')}</div>`));
}

/* --------------------------------------------- COMPANY RULES & ASSURANCE */
V.rules=function(){
  return secHead('Company rules & assurance','How this asset performs against common expectations',
    'The rule, this asset against it, and any weakness in the rule itself — kept separate.'+provI('rules'))+
  `<div class="gapnote" style="margin-bottom:14px"><div class="gh">${icon('info',12)}Three different questions</div>
     <strong>The rule</strong> is what the business expects of every asset.
     <strong>This asset</strong> is how ${esc(ASSET_NAME)} is performing against it.
     <strong>Business unit</strong> is whether the rule or the process behind it is itself weak — that is
     not this asset's failure and should not be read as one.</div>`+
  `<div class="rl-wrap">${COMPANY_RULES.map(r=>`
     <div class="rl">
       <div class="rl-h">
         <div class="rl-n">${esc(r.n)}</div>
         <div class="rl-r">${esc(r.rule)}</div>
       </div>
       <div class="rl-cols">
         <div class="rl-c rl-${ASC(r.asset.s)}">
           <div class="rl-cl">This asset</div>
           <div class="rl-cs tone-${ASC(r.asset.s)}">${esc(ASW(r.asset.s))}</div>
           <div class="rl-cv">${esc(r.asset.v)}</div>
           <div class="rl-cn">${esc(r.asset.note)}</div>
         </div>
         <div class="rl-c rl-${ASC(r.systemic.s)} rl-bu">
           <div class="rl-cl">Business unit ${r.systemic.n?`<span class="rl-scope">${esc(r.systemic.n)}</span>`:''}</div>
           <div class="rl-cs tone-${ASC(r.systemic.s)}">${esc(ASW(r.systemic.s))}</div>
           <div class="rl-cv">${esc(r.systemic.v)}</div>
           <div class="rl-cn">${esc(r.systemic.note)}</div>
         </div>
       </div>
     </div>`).join('')}</div>${notRiskNote()}${stdFoot()}`;
};

/* The quiet strip: weaknesses above this asset that it is nonetheless carrying. */
function buStrip(){
  if(!BU_TIER4.length)return '';
  return `<button class="bustrip" onclick="go('rules')" title="Business-unit weaknesses affecting this asset">
    ${icon('layers',12)}
    <span class="bs-l">Affecting this asset from above</span>
    ${BU_TIER4.map(b=>`<span class="bs-i bs-${ATT_STATE[b.s].c}">${esc(b.n)}<i>${esc(b.scope)}</i></span>`).join('')}
    ${icon('chevR',12)}</button>`;
}
</script>
<script>
"use strict";
/* ============================================================================
   MODALS — why, indicators, ranking, records, drill-through
   ========================================================================== */
function openWhy(){
  const w=STATE.prefs.window, ch=changed(w), raised=ch.filter(e=>e.closedAt==null);
  const hs=hotspots(w), sys=uniq(raised.map(e=>e.system));
  const already=raised.filter(e=>{const b=barrierFor(e);if(!b)return false;
    const k=barrierStateBefore(b.id,w).key;return k==='impaired'||k==='degraded';});
  openModal(mhead('Why am I seeing this?','The records, fields and rules behind the summary')+
    msec('The statement',`<div class="claritysum" style="margin:0"><p>${summarySentence()}</p></div>`)+
    msec('The rules that selected these records',`<div class="kv">
      <div class="kv-row"><span class="kv-k">Operational scope</span><span class="kv-v">${esc(scopeLabel())} — ${scopeZones().length} of ${ZONES.length} zones</span></div>
      <div class="kv-row"><span class="kv-k">Change window</span><span class="kv-v">${esc(windowLabel(w))} — <span class="mono">changedAt ≥ now − ${w} h</span></span></div>
      <div class="kv-row"><span class="kv-k">Source systems</span><span class="kv-v">${STATE.prefs.systems.filter(x=>SYSTEMS[x]).map(x=>esc(SYSTEMS[x].n)).join(', ')}</span></div>
      <div class="kv-row"><span class="kv-k">Attention rules active</span><span class="kv-v" style="max-width:260px">${STATE.prefs.rules.map(r=>esc((RULES.find(x=>x.id===r)||{n:r}).n)).join(' · ')}</span></div>
      <div class="kv-row"><span class="kv-k">Hotspot threshold</span><span class="kv-v">${STATE.prefs.thresholds.hotspot}+ records in one zone inside the window</span></div>
    </div>`)+
    msec('The arithmetic',`<div class="mathbox">
      records changed in window &nbsp;= <b>${ch.length}</b> &nbsp;(raised <b>${raised.length}</b>, closed <b>${ch.length-raised.length}</b>)<br>
      distinct source systems &nbsp;= <b>${sys.length}</b> &nbsp;(${sys.map(x=>esc(SYSTEMS[x].n)).join(', ')})<br>
      ${hs.length?'largest concentration &nbsp;= <b>'+hs[0].events.length+'</b> in '+esc(zoneName(hs[0].zone))+'<br>':''}
      acting on a barrier already degraded or impaired<br>
      &nbsp;&nbsp;before the window opened &nbsp;= <b>${already.length}</b>
    </div>`)+
    msec('The records',raised.map(e=>{const b=barrierFor(e);
      return `<div class="evrow" style="cursor:pointer" onclick="closeModal();openEventModal('${e.id}')">
        <span class="evrow-ref" style="color:${KINDS[e.kind].color}">${esc(e.id)}</span>
        <span class="evrow-main"><span class="evrow-title">${esc(e.title)}</span>
          <span class="evrow-meta">${esc(SYSTEMS[e.system].n)} · ${esc(e.zone?zoneName(e.zone):'no location')} ·
            ${b?esc(b.name)+' was <strong>'+esc(barrierStateBefore(b.id,w).w)+'</strong>':'no barrier join'} · ${esc(ago(e.changedHrs))}</span></span>
        <span class="evrow-tail"><span class="heldflag ${e.held?'held':'shape'}">${e.held?'held':'shape only'}</span></span></div>`;}).join(''))+
    msec('What the statement does not say',`<div class="gapnote">
      Severity is inferred from the status free text, not held as a field. “Already degraded or impaired” uses the Clarity barrier-condition
      rule, which leans on a compensating-measure phrase also parsed out of free text. Neither is a test against a performance standard,
      because no performance-standard register was supplied.</div>`)+
    `<div class="rowbtns"><button class="btn sm" onclick="closeModal();go('datamap')">${icon('db',12)}Data map</button>
      <button class="btn sm ghost" onclick="closeModal()">Close</button></div>`,'wide');
}

function openRankWhy(id){
  const a=attnById(id);if(!a)return;
  const f=a._f||rankFactors(a).f;
  const others=rankedAttention().filter(x=>x.id!==id);
  openModal(mhead('Ranking','Why “'+a.title+'” is ranked '+(ORD[a._rank]||a._rank))+
    msec('The seven factors',RANK_W.map(x=>`<div class="factor">
      <div class="fn">${esc(x.n)}<small>${esc(x.s)}</small></div>
      <div class="fbar"><i style="width:${Math.round(f[x.k])}%"></i></div>
      <div class="fv">${Math.round(f[x.k])} × ${x.w}%</div></div>`).join(''))+
    msec('The arithmetic',`<div class="mathbox">
      ${RANK_W.map(x=>pre(x.n.padEnd(24,' ')+String(Math.round(f[x.k])).padStart(3,' ')+' × '+String(x.w).padStart(2,' ')+'% = ')+`<b>${(f[x.k]*x.w/100).toFixed(1)}</b>`).join('<br>')}
      <br>${'─'.repeat(46)}<br>score = <b>${a._score.toFixed(1)}</b> &nbsp; → rank <b>${a._rank}</b> of ${rankedAttention().length}
      <br><br>${others.map(o=>pre(o.title.padEnd(38,' '))+'<b>'+o._score.toFixed(1)+'</b>').join('<br>')}</div>`)+
    msec('What is deliberately not in the ranking',`<div class="gapnote">
      Due date on its own. The most urgent thing is rarely the thing due soonest, and ranking by due date buries a new concentration behind a
      routine deferral. Due date enters only through action urgency, at 14%.
      ${STATE.role!=='ops'?'<br><br>The '+esc(ROLES[STATE.role].short)+' view re-sorts on '+(STATE.role==='safety'?'barrier condition':'ownership coverage')+' before score. The scores themselves do not change.':''}</div>`)+
    `<div class="rowbtns"><button class="btn sm" onclick="closeModal();openProv('ranking')">${icon('info',12)}Method</button>
      <button class="btn sm ghost" onclick="closeModal()">Close</button></div>`,'wide');
}

function openEventModal(id){
  const e=eventById(id);if(!e)return;
  STATE.seen[id]=true;persist();
  const b=barrierFor(e),st=b?barrierState(b.id):null,h=horizon(e),a=attnForEvent(id);
  const cum=STRANDS.filter(s=>s.ev.indexOf(id)>-1);
  openModal(mhead(KINDS[e.kind].long+' · '+SYSTEMS[e.system].n,e.title)+
    `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <span class="mono pill pill-grey">${esc(e.id)}</span>
      ${pill(SEV_WORD[e.sev]+' severity',e.sev==='high'?'red':e.sev==='med'?'amber':'green')}
      <span class="heldflag ${e.held?'held':'shape'}" style="align-self:center">${e.held?'record held for the operator':'shape only'}</span>
      ${e.closedAt!=null?pill('Closed','green'):pill('Open','accent')}</div>`+
    harbourPanel(e)+
    msec('The record as held',eventKV(e,b,st,h,a))+
    msec('Why it sits where it does',`<div class="mbody">${esc(e.note)}</div>`)+
    (cum.length?msec('Cumulative-risk relationship',cum.map(s=>`<div class="rel-item" onclick="closeModal();handleLink('strand','${s.id}')">
      <span class="rag rag-amber"></span><span class="rel-name">${esc(s.n)}</span><span class="rel-go">${icon('chevR',14)}</span></div>`).join('')):'')+
    `<div class="rowbtns" style="margin-top:14px">
      ${e.zone?`<button class="btn sm" onclick="closeModal();handleLink('zone','${e.zone}')">${icon('pin',12)}Show on asset</button>`:''}
      ${b?`<button class="btn sm" onclick="closeModal();handleLink('barrier','${b.id}')">${icon('shield',12)}Affected barrier</button>`:''}
      ${a?`<button class="btn sm" onclick="closeModal();openAttention('${a.id}')">${icon('users',12)}Ownership &amp; action</button>`:''}
      ${cum.length?`<button class="btn sm" onclick="closeModal();go('cumulative')">${icon('layers',12)}Cumulative exposure</button>`:''}
      <button class="btn sm ghost" onclick="closeModal();openProv('registers')">${icon('db',12)}Source record</button>
      <button class="btn sm ghost" onclick="closeModal()">Close</button></div>`,'wide');
}

/* the core drill-through — everything about one attention item in one place */
function openDrill(id){
  const a=attnById(id);if(!a)return;
  markViewed(a);
  const ev=attnEvents(a),sys=uniq(ev.map(e=>e.system)),src=uniq(ev.map(e=>e.owner).filter(Boolean));
  const bars=uniq(ev.map(e=>(barrierFor(e)||{}).id).filter(Boolean));
  const seces=uniq(ev.map(e=>e.sece));
  const c=cumulative(),inCum=CUM_PAIR.indexOf(id)>-1;
  openModal(mhead('Drill-through',a.title)+
    `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <span class="rag rag-${a.rag}" style="align-self:center"></span>
      <span class="pill pill-grey">${esc(a.area)}</span>
      <span class="pill pill-accent">${ev.length} records · ${sys.length} systems</span>
      ${a.owner?pill('Owner '+person(a.owner).name,a.ack?'green':'amber'):pill('Unassigned','red')}</div>`+
    msec('Why these records are grouped',`<div class="mbody">${esc(a.why)}</div>`)+
    msec('Contributing records',ev.map(e=>`<div class="evrow" style="cursor:pointer" onclick="closeModal();openEventModal('${e.id}')">
      <span class="evrow-ref" style="color:${KINDS[e.kind].color}">${esc(e.id)}</span>
      <span class="evrow-main"><span class="evrow-title">${esc(e.title)}</span>
        <span class="evrow-meta">${esc(SYSTEMS[e.system].n)} · source owner ${e.owner?esc(person(e.owner).name):'—'} · ${esc(e.status)} ·
          T${e.tier} ${esc(TIERS[e.tier].label)}</span></span>
      <span class="evrow-tail"><span class="heldflag ${e.held?'held':'shape'}">${e.held?'held':'shape only'}</span></span></div>`).join(''))+
    msec('Affected SECEs and barriers',`<div class="kv">
      ${seces.map(s=>{const b=BARRIERS.find(x=>x.sece.indexOf(s)>-1),st=b?barrierState(b.id):null;
        return `<div class="kv-row"><span class="kv-k">${esc(s)}</span>
          <span class="kv-v">${b?'<span class="tone-'+(st.c==='watch'?'green':st.c)+'">'+esc(st.w)+'</span> — '+esc(b.name):'no barrier join'}</span></div>`;}).join('')}
    </div>`)+
    (inCum?msec('Cumulative-risk relationship',`<div class="cum-combine" style="margin:0">
      Converges with <strong>${esc(attnById(CUM_PAIR[CUM_PAIR.indexOf(id)===0?1:0]).title)}</strong> through
      <strong>${numw(c.on.length)}</strong> named mechanism${c.on.length===1?'':'s'}. Combined exposure <strong>${c.comb}</strong>,
      ×${c.amp} on their average of ${c.avg}.</div>`):'')+
    msec('Ownership',`<div class="kv">
      <div class="kv-row"><span class="kv-k">Attention owner — accountable for the consolidated response</span>
        <span class="kv-v">${a.owner?avatar(a.owner,'sm')+' '+esc(person(a.owner).name):'<span class="tone-amber">Unassigned</span>'}</span></div>
      <div class="kv-row"><span class="kv-k">Source owners — accountable for their own records</span>
        <span class="kv-v">${src.map(o=>esc(person(o).name)).join('<br>')||'—'}<br><span class="tiny">field not held — illustrative</span></span></div>
      <div class="kv-row"><span class="kv-k">Response required</span><span class="kv-v">${esc(a.due?dueLabel(a.due):'No date set')}</span></div>
      <div class="kv-row"><span class="kv-k">Acknowledgement</span><span class="kv-v">${a.ack?'Acknowledged '+esc(a.ackAt?stamp(a.ackAt):''):a.owner?'Awaiting':'—'}</span></div>
    </div>`)+
    msec('Recommended next step',`<div class="mbody"><strong>${esc(a.next)}</strong></div>`)+
    `<div class="rowbtns" style="margin-top:14px">
      <button class="btn btn-primary sm" onclick="closeModal();takeOwnership('${a.id}')">${icon('user',12)}Take ownership</button>
      <button class="btn sm" onclick="closeModal();startAssign('${a.id}')">${icon('users',12)}Assign colleague</button>
      <button class="btn sm" onclick="closeModal();handleLink('zone','${a.zone}')">${icon('pin',12)}Show on asset</button>
      ${bars.length?`<button class="btn sm" onclick="closeModal();handleLink('barrier','${bars[0]}')">${icon('shield',12)}Affected barriers</button>`:''}
      ${inCum?`<button class="btn sm" onclick="closeModal();go('cumulative')">${icon('layers',12)}Cumulative exposure</button>`:''}
      <button class="btn sm ghost" onclick="closeModal();shareSummary('${a.id}')">${icon('share',12)}Share summary</button>
      <button class="btn sm ghost" onclick="askAbout('${a.id}')">${icon('message',12)}Ask Clarity</button>
      <button class="btn sm ghost" onclick="closeModal()">Close</button></div>`,'xwide');
}
</script>
<script>
"use strict";
/* ============================================================================
   THE EXISTING CLARITY MODULES
   The hub is a front door over these, not a replacement for them. They read the
   same central dataset, so nothing here can disagree with the hub.
   ========================================================================== */
const modNote=t=>`<div class="modnote">${icon('info',15)}<div>${t}</div></div>`;

V.ps=function(){
  /* §11 — the existing process-safety module, reorganised around the tiers.
     Lagging outcomes (Tier 1/2) sit in the hierarchy for completeness; the
     work happens in Tier 3 and Tier 4. */
  const bh=barrierHealth(), all=dualAll(), conv=convergence();
  const t3w=all.filter(d=>d.t3.key==='weakening').length;
  const t4w=all.filter(d=>d.t4.key==='weakening').length;
  const f=STATE.psFilter||{tier:'all',bar:'all'};
  const shown=all.filter(d=>f.bar==='all'||d.bar.id===f.bar);
  return secHead('Clarity module','Process Safety',
    'The PSM hierarchy, barriers and SECEs — organised as lagging outcomes, barrier performance and assurance performance.')+
  modNote('Everything here is computed from the same '+openEvents().length+' open records as the hub. Opening a barrier here opens the same barrier the hub opens.')+

  `<div class="ps-tiers">
     <div class="ps-tier ps-lag">
       <div class="ps-tl">Lagging outcomes</div>
       <div class="ps-tt">Tier 1 · Tier 2</div>
       <div class="ps-tv">0</div>
       <div class="ps-td">No Tier 1 or Tier 2 process safety event is recorded in this window.
         These sit in the hierarchy for completeness and are reported, not worked here.</div>
     </div>
     <div class="ps-tier ${t3w?'ps-bad':''}">
       <div class="ps-tl">Barrier performance</div>
       <div class="ps-tt">Tier 3</div>
       <div class="ps-tv">${t3w}</div>
       <div class="ps-td">${t3w?numw(t3w)+' critical barrier'+(t3w===1?'':'s')+' showing weakness against '+BARRIERS.length+' assessed.':'No barrier is currently weakening.'}</div>
     </div>
     <div class="ps-tier ${t4w?'ps-bad':''}">
       <div class="ps-tl">Assurance performance</div>
       <div class="ps-tt">Tier 4</div>
       <div class="ps-tv">${t4w}</div>
       <div class="ps-td">${t4w?numw(t4w)+' barrier'+(t4w===1?'':'s')+' where the assurance intended to maintain it is behind plan.':'Assurance activity is on plan across every barrier.'}</div>
     </div>
     <div class="ps-tier ${conv.length?'ps-bad':''}">
       <div class="ps-tl">Convergence</div>
       <div class="ps-tt">Clarity</div>
       <div class="ps-tv">${conv.length}</div>
       <div class="ps-td">${conv.length?numw(conv.length)+' area'+(conv.length===1?'':'s')+' where independently managed conditions are landing together.':'No area is currently converging.'}</div>
     </div>
   </div>

   <div class="ps-filter">
     <label>Barrier</label>
     <select onchange="STATE.psFilter={tier:'all',bar:this.value};render()">
       <option value="all">All critical barriers</option>
       ${BARRIERS.map(b=>`<option value="${b.id}" ${f.bar===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
     </select>
     <span class="tiny">Showing ${shown.length} of ${all.length} barriers · every row drills Indicator → Tier → Performance standard → Barrier → Major hazard → Source evidence</span>
   </div>

   <div class="asr-wrap">
     <table class="asr"><thead><tr>
       <th>Critical barrier</th><th>Major hazard</th>
       <th>Tier 3 <span>barrier performance</span></th>
       <th>Tier 4 <span>assurance performance</span></th>
       <th>Attention</th>
     </tr></thead><tbody>
     ${shown.map(d=>`<tr onclick="go('dual','${d.bar.id}')">
       <td class="asr-b"><b>${esc(d.bar.name)}</b><i>${esc(PERF_STD[d.bar.id])}</i></td>
       <td><i style="margin:0">${mahsForBarrier(d.bar.id).map(m=>esc(m.short)).join('<br>')||'—'}</i></td>
       <td><span class="tone-${KEYC[d.t3.key]}">${KEYW[d.t3.key]}</span><i>${d.t3.n} open record${d.t3.n===1?'':'s'}</i></td>
       <td><span class="tone-${KEYC[d.t4.key]}">${KEYW[d.t4.key]}</span><i>${d.t4.plan}% of plan</i></td>
       <td><span class="asr-p asr-${d.c}">${esc(d.w)}</span></td>
     </tr>`).join('')}
     </tbody></table>
   </div>`+

  hSec('Barrier position',bh.impaired+' impaired · '+bh.degraded+' degraded · '+bh.watch+' watch · '+bh.intact+' intact')+
  `<div class="grid-2">
    <div class="panel"><div class="panel-head"><h3>Prevention barriers</h3></div><div class="mini-list">
      ${BARRIERS.filter(b=>b.side==='prevent').map(b=>{const s=barrierState(b.id);
        return `<div class="mini-row" onclick="openBarrier('${b.id}')"><span class="rag rag-${s.c==='watch'?'green':s.c}"></span>
          <span class="mini-name">${esc(b.name)}</span><span class="mini-fill">${s.n} open</span>
          <span class="mini-tail tone-${s.c==='watch'?'green':s.c}">${esc(s.w)}</span>${icon('chevR',14,'mini-go')}</div>`;}).join('')}</div></div>
    <div class="panel"><div class="panel-head"><h3>Mitigation barriers</h3></div><div class="mini-list">
      ${BARRIERS.filter(b=>b.side==='mitigate').map(b=>{const s=barrierState(b.id);
        return `<div class="mini-row" onclick="openBarrier('${b.id}')"><span class="rag rag-${s.c==='watch'?'green':s.c}"></span>
          <span class="mini-name">${esc(b.name)}</span><span class="mini-fill">${s.n} open</span>
          <span class="mini-tail tone-${s.c==='watch'?'green':s.c}">${esc(s.w)}</span>${icon('chevR',14,'mini-go')}</div>`;}).join('')}</div></div>
  </div>`+stdFoot()+viewFoot();
};


V.tracker=function(){
  const rows=openEvents().slice().sort((a,b)=>{
    const ha=horizon(a),hb=horizon(b);
    if(!ha&&!hb)return 0;if(!ha)return 1;if(!hb)return -1;return ha.d-hb.d;});
  return secHead('Clarity module','Action Tracker',
    'The existing Clarity action register, across all three source registers. The hub adds the consolidated attention item above it — one owner coordinating a group of these.')+
  modNote('The hub’s <strong>attention owner</strong> is not the same person as the <strong>source owner</strong> shown here. One attention item can carry records belonging to several source owners.')+
  `<div class="aq-wrap"><table class="aq"><thead><tr>
    <th>Reference</th><th>Action</th><th>Register</th><th>Source system</th><th>Source owner</th><th>SECE</th><th>Location</th><th>Status</th><th>End date</th><th>Severity</th><th></th></tr></thead><tbody>
    ${rows.map(e=>{const h=horizon(e);
      return `<tr><td><span class="mono" style="color:${KINDS[e.kind].color};font-weight:700">${esc(e.id)}</span></td>
        <td><div class="t-main">${esc(e.title)}</div></td>
        <td class="t-sub">${esc(KINDS[e.kind].label)}</td>
        <td class="t-sub">${esc(SYSTEMS[e.system].n)}</td>
        <td class="t-sub">${e.owner?esc(person(e.owner).name):'—'}</td>
        <td class="t-sub">${esc(e.sece)}</td>
        <td class="t-sub">${esc(e.zone?zoneName(e.zone):'Unallocated')}</td>
        <td class="t-sub">${esc(e.status)}</td>
        <td class="num">${h?(h.d<0?'<span class="tone-red">'+Math.abs(h.d)+' d past</span>':h.d+' d'):'<span class="tone-amber">none</span>'}</td>
        <td>${pill(SEV_WORD[e.sev],e.sev==='high'?'red':e.sev==='med'?'amber':'green')}</td>
        <td><button class="btn sm ghost" onclick="openEventModal('${e.id}')">${icon('chevR',13)}</button></td></tr>`;}).join('')}
  </tbody></table></div>`+viewFoot();
};

V.meeting=function(){
  const ranked=rankedAttention(),c=cumulative(),bh=barrierHealth();
  return secHead('Clarity module','Meeting',
    'The existing Clarity meeting module — run the operational review live from the same records rather than from a separate pack.')+
  modNote('Nothing on this agenda is typed. Every line is generated from the register, so the pack cannot drift from the position.')+
  `<div class="exec-band">
    <div class="exec-orb"><div class="eo-ring">${bh.impaired}</div><div class="eo-lab">Impaired</div></div>
    <div class="exec-headline"><div class="eh-1">Operational review · ${esc(dayLabel(NOW))}</div>
      <div class="eh-2">${cap(numw(ranked.length))} item${ranked.length===1?'':'s'} for decision</div>
      <div class="eh-3">${summarySentence().replace(/<[^>]+>/g,'')}</div></div>
    <div class="exec-mini">
      <div class="em">${icon('shield',14)} ${bh.index}% barrier index</div>
      <div class="em">${icon('layers',14)} ${convergence().length} area${convergence().length===1?'':'s'} converging</div>
      <div class="em">${icon('users',14)} ${ATTENTION.filter(a=>!a.owner&&!a.done).length} unassigned</div></div>
  </div>`+
  hSec('Agenda','In ranked order. Each item carries its decision, its owner and its evidence.')+
  `<div class="dq-list">${ranked.map(a=>`<div class="dq-card" onclick="openDrill('${a.id}')">
    <div class="dq-flag ${a.rag==='red'?'high':a.rag==='amber'?'med':'info'}"></div>
    <div class="dq-body">
      <div class="dq-top"><span class="dq-pri ${a.rag==='red'?'high':a.rag==='amber'?'med':'info'}">Item ${a._rank}</span>
        <span class="dq-area">${esc(a.area)}</span>
        ${a.owner?pill(person(a.owner).name,a.ack?'green':'amber'):pill('No owner','red')}</div>
      <div class="dq-title">${esc(a.title)}</div>
      <div class="dq-decision"><strong>Decision:</strong> ${esc(a.next)}</div>
      <div class="dq-foot">
        <span class="dqf">${icon('db',12)}<strong>${attnEvents(a).length}</strong> records · ${uniq(attnEvents(a).map(e=>e.system)).length} systems</span>
        <span class="dqf">${icon('clock',12)}${esc(a.due?dueLabel(a.due):'no date set')}</span>
        <span class="dqf">${icon('shield',12)}${uniq(attnEvents(a).map(e=>(barrierFor(e)||{}).name).filter(Boolean)).join(', ')}</span></div>
    </div><div class="dq-go">${icon('chevR',18)}</div></div>`).join('')}</div>`+viewFoot();
};

V.dashboards=function(){
  const plats=[{id:'topsides',n:'Topsides'},{id:'support',n:'Process deck'},{id:'shared',n:'Bridge & jacket'}];
  const cnt=p=>openEvents().filter(e=>e.zone&&zoneById(e.zone)&&zoneById(e.zone).plat===p).length;
  const max=Math.max.apply(null,plats.map(p=>cnt(p.id)))||1;
  return secHead('Clarity module','Dashboards',
    'A standard Clarity dashboard — configurable widgets over the same indicators. The hub’s “Personalise My Daily View” is this configurability moved to the front door.')+
  modNote('Component choice, order and compact display are set in <strong>Personalise My Daily View</strong> on the operating picture, and apply to both.')+
  `<div class="grid-2">
    <div class="panel"><div class="panel-head"><h3>Open records by platform</h3></div>
      ${plats.map(p=>`<div class="bar-row"><span class="bar-label">${esc(p.n)}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${Math.round(cnt(p.id)/max*100)}%;background:var(--accent)"></span></span>
        <span class="bar-val">${cnt(p.id)}</span></div>`).join('')}
      <div class="bar-row"><span class="bar-label">Unallocated</span>
        <span class="bar-track"><span class="bar-fill" style="width:${Math.round(EVENTS.filter(e=>!e.zone).length/max*100)}%;background:var(--amber)"></span></span>
        <span class="bar-val">${EVENTS.filter(e=>!e.zone).length}</span></div></div>
    <div class="panel"><div class="panel-head"><h3>Open records by register</h3></div>
      ${Object.keys(KINDS).map(k=>{const n=openEvents().filter(e=>e.kind===k).length;
        return `<div class="bar-row"><span class="bar-label">${esc(KINDS[k].long)}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${Math.round(n/openEvents().length*100)}%;background:${KINDS[k].color}"></span></span>
          <span class="bar-val">${n}</span></div>`;}).join('')}</div>
  </div>`+
  `<div class="spacer"></div>`+trendsBody(false)+viewFoot();
};

V.pulse=function(){
  const plats=[{id:'topsides',n:'Topsides'},{id:'support',n:'Process Area'},{id:'shared',n:'Shared'},{id:null,n:'Unallocated'}];
  const inPlat=(e,p)=>p===null?!e.zone:(e.zone&&zoneById(e.zone)&&zoneById(e.zone).plat===p);
  const ind=(name,fn)=>{
    const tot=plats.reduce((s,p)=>s+fn(p.id),0);
    return `<div class="pulse-ind"><div class="ph">${esc(name)}<span class="tot">total ${tot}</span></div>
      <div class="pulse-tiles">${plats.map(p=>`<div class="pulse-tile"><div class="pv">${fn(p.id)}</div><div class="pn">${esc(p.n)}</div></div>`).join('')}</div></div>`;
  };
  return secHead('Clarity module','Pulse',
    'The existing Clarity Pulse — headline indicators totalled by area. Same records, same definitions as the hub.')+
  modNote('These are counts, not indices. Where the hub shows a weighted figure it says so and shows the arithmetic.')+
  ind('Open records',p=>openEvents().filter(e=>inPlat(e,p)).length)+
  ind('High severity (derived)',p=>openEvents().filter(e=>inPlat(e,p)&&e.sev==='high').length)+
  ind('Past planned finish',p=>overdueEvents().filter(e=>inPlat(e,p)).length)+
  ind('Temporary repairs in service',p=>openEvents().filter(e=>inPlat(e,p)&&e.kind==='dlr').length)+
  ind('No end date held anywhere',p=>noHorizonEvents().filter(e=>inPlat(e,p)).length)+
  ind('Changed in window',p=>changed().filter(e=>inPlat(e,p)).length)+
  viewFoot();
};

V.reports=function(){
  const bh=barrierHealth();
  const plats=[{id:'topsides',n:'Topsides'},{id:'support',n:'Process deck'},{id:'shared',n:'Bridge & jacket'}];
  const ev=p=>openEvents().filter(e=>e.zone&&zoneById(e.zone)&&zoneById(e.zone).plat===p);
  return secHead('Clarity module','Reports',
    'A standard Clarity report — operational risk summary by area. Every figure reconciles with the screens above because it is the same computation.')+
  `<div class="panel" style="overflow-x:auto"><div class="panel-head"><h3>Operational risk summary</h3>
    <span class="panel-tag">${esc(windowLabel(STATE.prefs.window))} · generated ${hhmm(NOW)}</span></div>
    <table class="aq"><thead><tr><th>Area</th><th class="num">Open records</th><th class="num">High</th><th class="num">Past planned finish</th>
      <th class="num">Temporary repairs</th><th class="num">No end date</th><th class="num">Changed in window</th><th>Worst barrier</th></tr></thead><tbody>
    ${plats.map(p=>{const l=ev(p.id);
      const bars=uniq(l.map(e=>(barrierFor(e)||{}).id).filter(Boolean)).map(id=>barrierState(id));
      const worst=bars.sort((a,b)=>b.rank-a.rank)[0];
      return `<tr><td class="t-main">${esc(p.n)}</td>
        <td class="num">${l.length}</td><td class="num">${l.filter(e=>e.sev==='high').length}</td>
        <td class="num">${l.filter(e=>{const h=horizon(e);return h&&h.d<0;}).length}</td>
        <td class="num">${l.filter(e=>e.kind==='dlr').length}</td>
        <td class="num">${l.filter(e=>!horizon(e)).length}</td>
        <td class="num">${changed().filter(e=>e.zone&&zoneById(e.zone).plat===p.id).length}</td>
        <td>${worst?'<span class="tone-'+(worst.c==='watch'?'green':worst.c)+'">'+esc(worst.w)+'</span>':'—'}</td></tr>`;}).join('')}
      <tr style="background:var(--card-2)"><td class="t-main">Unallocated</td>
        <td class="num">${EVENTS.filter(e=>!e.zone).length}</td>
        <td class="num">${EVENTS.filter(e=>!e.zone&&e.sev==='high').length}</td>
        <td class="num">${EVENTS.filter(e=>!e.zone&&(horizon(e)||{d:1}).d<0).length}</td>
        <td class="num">${EVENTS.filter(e=>!e.zone&&e.kind==='dlr').length}</td>
        <td class="num">${EVENTS.filter(e=>!e.zone&&!horizon(e)).length}</td>
        <td class="num">0</td><td class="tiny">no location on the row</td></tr>
      <tr style="font-weight:700"><td>Mittelplate — total</td>
        <td class="num">${openEvents().length}</td><td class="num">${openEvents().filter(e=>e.sev==='high').length}</td>
        <td class="num">${overdueEvents().length}</td><td class="num">${openEvents().filter(e=>e.kind==='dlr').length}</td>
        <td class="num">${noHorizonEvents().length}</td><td class="num">${changed().length}</td>
        <td>${bh.impaired} impaired · ${bh.degraded} degraded</td></tr>
    </tbody></table></div>`+
  hSec('Ownership position')+
  `<div class="aq-wrap"><table class="aq"><thead><tr><th>Attention item</th><th>Attention owner</th><th>Source owners</th>
    <th>Assigned</th><th>Acknowledged</th><th>Due</th><th class="num">Records</th></tr></thead><tbody>
    ${ATTENTION.map(a=>`<tr><td class="t-main">${esc(a.title)}</td>
      <td>${a.owner?esc(person(a.owner).name):'<span class="tone-amber">Unassigned</span>'}</td>
      <td class="t-sub">${uniq(attnEvents(a).map(e=>e.owner).filter(Boolean)).map(o=>esc(person(o).name)).join(', ')||'—'}</td>
      <td class="t-sub">${a.assignedAt?esc(stamp(a.assignedAt)):'—'}</td>
      <td class="t-sub">${a.ack?esc(a.ackAt?stamp(a.ackAt):'yes'):a.owner?'awaiting':'—'}</td>
      <td class="t-sub">${a.due?esc(dueLabel(a.due)):'—'}</td>
      <td class="num">${a.events.length}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="tiny" style="margin-top:10px">Ownership, assignment and acknowledgement are Clarity states. No source register supplied them.</div>`+
  viewFoot();
};

/* ============================================================================
   GUIDED WALKTHROUGH
   ========================================================================== */
const TOUR=[
 {sel:'#tour-greet',view:'home',t:'What needs attention today',
  d:'One screen answering three questions: what needs your attention, where it is on the asset, and what action is required.',
  act:()=>{STATE.openAttn='A1';}},
 {sel:'#tour-attention',view:'home',t:'Three priorities, ranked',
  d:'Ranked on exposure, barrier condition, interdependency, urgency, escalation, recency and evidence confidence — not on due date. “Why these three?” opens the records and the rules behind them.'},
 {sel:'.asset-stage',view:'home',t:'The same three, located on the asset',
  d:'The hotspot numbers and colours are the ranking, not a separate drawing. Select a card and the model moves to the affected area; select a hotspot and the card and the right-hand panel follow.'},
 {sel:'.asset-stage',view:'home',t:'Evidence convergence',
  d:'The arc between 1 and 2 is not a risk score. It marks where independently managed conditions are landing on the same area and the same critical barriers at the same time. Hotspot 3 stays separate; it is a recovery.'},
 {sel:'#tour-issue',view:'home',t:'Barriers, evidence and ownership',
  d:'The same issue from the barrier and evidence side, with ownership in the one place it lives. Take it, or assign a colleague with a due time and an instruction, without leaving the screen.'},
 {sel:'#tour-strip',view:'home',t:'Three supporting reads',
  d:'What materially changed, barrier health, and where conditions are converging. Each opens its full module rather than trying to reproduce it here.'},
 {sel:'#tour-pers',view:'home',t:'Personalising the daily view',
  d:'Scope, what to monitor, the attention rules, the time window, the sources and the saved views — below the command view, with a live preview that recounts before anything is applied.',
  act:()=>{STATE.prefOpen=true;}},
 {sel:'.panel',view:'datamap',t:'Traceable evidence',
  d:'Every figure opens the records behind it. What is held, what is derived, what is assumed and what we would ask the operator for — in the order that changes the most.'}
];
function startTour(){STATE.tour=0;tourGo(0);}
function tourEnd(){STATE.tour=-1;$("#tourwrap").classList.remove('on');}
function tourGo(i){
  if(i<0||i>=TOUR.length){tourEnd();return;}
  STATE.tour=i;
  const st=TOUR[i];
  if(st.act)st.act();
  if(parseHash().view!==st.view){go(st.view);setTimeout(()=>tourPlace(),260);}
  else{render();setTimeout(()=>tourPlace(),80);}
}
function tourPlace(){
  const st=TOUR[STATE.tour];if(!st)return;
  const wrap=$("#tourwrap"),spot=$("#tourSpot"),card=$("#tourCard");
  wrap.classList.add('on');
  card.innerHTML=`<div class="tc-step">Step ${STATE.tour+1} of ${TOUR.length}</div>
    <h4>${esc(st.t)}</h4><p>${esc(st.d)}</p>
    <div class="tc-acts"><span class="tc-dots">${TOUR.map((_,i)=>`<i class="${i<=STATE.tour?'on':''}"></i>`).join('')}</span>
      <button class="btn sm ghost" onclick="tourEnd()">Close</button>
      ${STATE.tour>0?`<button class="btn sm" onclick="tourGo(${STATE.tour-1})">Back</button>`:''}
      <button class="btn btn-primary sm" onclick="tourGo(${STATE.tour+1})">${STATE.tour===TOUR.length-1?'Finish':'Next'}</button></div>`;
  const el=document.querySelector(st.sel);
  if(!el){
    spot.style.display='none';
    card.style.left=Math.round(window.innerWidth/2-176)+'px';card.style.top='120px';
    return;
  }
  /* Centre the target in the scrolling outlet and place the card. Run it a few
     times: the panel above it can change height as a step opens something, and a
     single measurement then leaves the spotlight in the wrong place. */
  const out=$("#outlet");
  function place(){
    const oR=out.getBoundingClientRect(),r0=el.getBoundingClientRect();
    const want=out.scrollTop+(r0.top-oR.top)-Math.max(18,(oR.height-Math.min(r0.height,oR.height*0.8))/2);
    out.scrollTop=Math.max(0,want);
    const r=el.getBoundingClientRect(),pad=7;
    spot.style.display='block';
    spot.style.left=(r.left-pad)+'px';spot.style.top=(r.top-pad)+'px';
    spot.style.width=(r.width+pad*2)+'px';spot.style.height=(r.height+pad*2)+'px';
    const cw=352,ch=card.offsetHeight||220;
    let left=(r.right+20+cw<window.innerWidth)?r.right+20
            :(r.left-20-cw>8)?r.left-20-cw
            :Math.min(Math.max(16,r.left),window.innerWidth-cw-16);
    let top=(r.bottom+18+ch<window.innerHeight)?r.bottom+18
           :(r.top-18-ch>8)?r.top-18-ch
           :Math.max(16,Math.min(r.top,window.innerHeight-ch-16));
    card.style.left=Math.round(clamp(left,12,Math.max(12,window.innerWidth-cw-12)))+'px';
    card.style.top =Math.round(clamp(top ,12,Math.max(12,window.innerHeight-ch-12)))+'px';
  }
  place();
  requestAnimationFrame(place);
  setTimeout(place,90);
  setTimeout(place,260);
}
</script>
<script>
"use strict";
/* ============================================================================
   RENDER + BOOT
   ========================================================================== */
function render(){
  const H=parseHash();
  const view=V[H.view]?H.view:'home';
  /* the command view shows the asset; the asset view shows how it was cut */
  if(!STATE.zonesTouched){STATE.showZones=(view==='asset');STATE.showPins=(view==='asset');}
  renderRail(view);
  renderTopbar();
  const out=$("#outlet");
  out.innerHTML=view==='home'
    ? `<div class="wrap">${V.home()}</div>`
    : `<div class="wrap"><div class="modwrap view-enter">${V[view](H.id)}</div></div>`;
  out.scrollTop=0;
  /* the scene is built once and moved into whichever container asks for it */
  const slot=document.getElementById('assetStage')||document.getElementById('stageSlot');
  if(slot)STAGE.mount('#'+slot.id);else STAGE.unmount();
  if(STATE.tour>-1)setTimeout(tourPlace,120);
}
$("#modalBack").addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($("#modalBack").classList.contains('show'))closeModal();
    else if(STATE.tour>-1)tourEnd();
    else if(STATE.ownMode){cancelAssign();}
  }
  if(STATE.tour>-1){
    if(e.key==='ArrowRight')tourGo(STATE.tour+1);
    if(e.key==='ArrowLeft')tourGo(STATE.tour-1);
  }
});

restore();
bootState();
if(STAGE.ok)STAGE.paint();
if(!location.hash)location.hash='#/home';
render();
</script>
