.acards::-webkit-scrollbar{width:5px;}
.acards::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.acard{display:flex;align-items:stretch;padding:0;text-align:left;cursor:pointer;overflow:hidden;flex:none;
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  transition:border-color .15s,background .15s,transform .12s;}
.acard:hover{transform:translateX(2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
.acard .edge{width:4px;flex:none;}
.acard.red .edge{background:var(--red);}.acard.amber .edge{background:var(--amber);}.acard.green .edge{background:var(--green);}
.acard .body{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:11px 10px 11px 12px;}
.acard .dot{width:13px;height:13px;border-radius:50%;flex:none;}
.acard.red .dot{background:var(--red);box-shadow:0 0 0 4px rgba(255,91,87,.15);}
.acard.amber .dot{background:var(--amber);box-shadow:0 0 0 4px rgba(255,189,69,.15);}
.acard.green .dot{background:var(--green);box-shadow:0 0 0 4px rgba(121,220,107,.15);}
.acard .num{font-size:26px;font-weight:700;line-height:1;width:17px;text-align:center;flex:none;color:var(--ink-3);}
.acard.sel .num{color:var(--ink);}
.acard .txt{flex:1;min-width:0;}
.acard .t{font-size:12.5px;font-weight:780;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acard .d{font-size:11.5px;color:var(--ink-2);line-height:1.35;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.acard .o{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--ink-3);}
.acard .o.un{color:var(--amber);}
.acard .chev{color:var(--ink-3);flex:none;align-self:center;padding-right:9px;}
.acard:hover .chev{color:var(--accent);}
.acard.sel{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));}
.acard.sel.red{background:linear-gradient(90deg,rgba(255,91,87,.14),var(--card) 58%);border-color:rgba(255,91,87,.5);}
.acard.sel.amber{background:linear-gradient(90deg,rgba(255,189,69,.13),var(--card) 58%);border-color:rgba(255,189,69,.5);}
.acard.sel.green{background:linear-gradient(90deg,rgba(121,220,107,.13),var(--card) 58%);border-color:rgba(121,220,107,.5);}

/* ---- three status tiles ---- */
.kpi{display:block;text-align:left;min-width:0;padding:10px 13px;border-radius:9px;
  background:var(--card);border:1px solid var(--line);transition:border-color .14s,transform .12s;}
.kpi:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));transform:translateY(-1px);}
.kpi .kl{display:block;font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .kr{display:flex;align-items:center;gap:10px;margin-top:6px;}
.kpi .ki{flex:none;display:grid;place-items:center;width:28px;height:28px;}
.kpi .kval{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1;white-space:nowrap;
  /* .kpi is a <button>, which does not inherit colour — without this the value
     fell back to the browser's default button text (black) and rendered at
     1.22:1 on the card. The <small>%</small> inherits from here. */
  color:#fff;}
.kpi .kval small{font-size:16px;font-weight:700;}
.kpi.green .ki{color:var(--green);}.kpi.amber .ki{color:var(--amber);}.kpi.red .ki{color:var(--red);}

/* ---- the asset stage ---- */
.asset-stage #stagehost{position:absolute;inset:0;}
.stage-cap{position:absolute;left:12px;bottom:10px;z-index:6;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);pointer-events:none;}

/* ---- supporting strip ---- */
.spanel{display:flex;flex-direction:column;min-width:0;overflow:hidden;padding:11px 13px 10px;
  background:var(--card);border:1px solid var(--line);border-radius:9px;cursor:pointer;transition:border-color .14s;}
.spanel:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
.spanel .sh{display:flex;align-items:center;gap:9px;font-size:10px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink);margin-bottom:8px;flex:none;}
.spanel .sh .t{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:none;color:var(--ink-3);}
.wc{display:flex;align-items:center;gap:9px;padding:5.5px 0;border-top:1px solid var(--line-2);font-size:11.8px;}
.wc:first-of-type{border-top:none;}
.wc .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
.wc .s{font-size:11px;color:var(--ink-3);flex:none;}
.wc .c{color:var(--ink-3);flex:none;}
.wc:hover .n{color:var(--accent);}
.bh-bar{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--track);margin-bottom:7px;flex:none;}
.bh-bar i{display:block;height:100%;}
.bh-row{display:flex;align-items:center;gap:8px;padding:0;font-size:11.5px;line-height:1.55;color:var(--ink-2);}
.bh-row .v{margin-left:auto;font-weight:760;color:var(--ink);font-variant-numeric:tabular-nums;}
.cr-wrap{position:relative;flex:1;min-height:0;}
.cr-wrap svg{width:100%;height:100%;display:block;}
.cr-now{position:absolute;right:2px;top:-1px;font-size:12.5px;font-weight:800;color:var(--amber);}
.cr-ax{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-3);margin-top:2px;flex:none;}

/* ================================================== SELECTED ISSUE PANEL */
.sip-head{flex:none;display:flex;align-items:flex-start;gap:8px;padding:11px 12px 10px;border-bottom:1px solid var(--line-2);}
.sip-head .t{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
  overflow-wrap:anywhere;}
.sip-head .s{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.35;}
.sip-head .x{margin-left:auto;background:none;border:none;color:var(--ink-3);padding:0;flex:none;cursor:pointer;}
.sip-head .x:hover{color:var(--ink);}
.sip-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px 6px;}
.sip-body::-webkit-scrollbar{width:5px;}
.sip-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.sip-foot{flex:none;padding:9px 12px 11px;border-top:1px solid var(--line-2);background:rgba(4,16,27,.5);}
:root[data-theme="light"] .sip-foot{background:var(--card-2);}
:root[data-theme="light"] .kpi .kval{color:var(--ink);}
.sip-sec{display:flex;align-items:center;gap:8px;font-size:9.5px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);margin:12px 0 6px;}
.sip-sec:first-child{margin-top:0;}
.sip-sec::after{content:"";flex:1;height:1px;background:var(--line-2);}
.locator{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#061624;}
.locator svg{display:block;width:100%;background:linear-gradient(180deg,#0a2136,#061624);}
.locator .cap{font-size:9.5px;color:var(--ink-3);padding:4px 8px 5px;border-top:1px solid var(--line-2);
  background:var(--card-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brow{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11.3px;border-top:1px solid var(--line-2);cursor:pointer;}
.brow:first-of-type{border-top:none;}
.brow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);}
.brow:hover .n{color:var(--accent);}
.brow .s{font-size:10.5px;font-weight:760;flex:none;}
.srow{display:flex;align-items:center;gap:8px;padding:3px 0;min-width:0;}
.srow .c{width:30px;height:22px;flex:none;border-radius:6px;border:1px solid var(--line);background:var(--card-2);
  display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--ink-2);}
.srow .n{font-size:11px;font-weight:660;color:var(--ink);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.srow .s{display:block;font-size:9.5px;color:var(--ink-3);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.srow.off{opacity:.45;}
.orow{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-width:0;}
.orow .l{font-size:11px;color:var(--ink-2);width:40px;flex:none;}
.ofield{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;
  background:var(--card-2);padding:5px 8px;}
.ofield .ic{color:var(--ink-3);flex:none;}
.ofield select,.ofield input{flex:1;min-width:0;width:100%;background:transparent;border:none;color:var(--ink);
  font-family:var(--sans);font-size:11.5px;outline:none;padding:0;}
.ofield select option{background:var(--card);}
.ofield:focus-within{border-color:var(--accent);}
.obtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
.obtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:0;
  font-size:10.8px;font-weight:700;border-radius:7px;padding:7px 4px;
  border:1px solid var(--line);background:var(--card-2);color:var(--ink-2);cursor:pointer;
  transition:border-color .13s,color .13s;}
.obtn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--ink);}
.obtn.cy{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent);}
.obtn.cy:hover{background:color-mix(in srgb,var(--accent) 12%,transparent);}
.obtn[disabled]{opacity:.42;cursor:default;}
.obtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.oinput{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:7px;background:var(--card-2);
  color:var(--ink);font-family:var(--sans);font-size:11.5px;padding:6px 9px;outline:none;}
.oinput:focus{border-color:var(--accent);}
.ostat{display:flex;align-items:flex-start;gap:6px;font-size:10.5px;color:var(--ink-3);margin-top:8px;line-height:1.4;}
.ostat .ic{flex:none;margin-top:1px;}
.askbtn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  background:var(--accent);color:var(--on-accent);border:none;border-radius:8px;padding:10px;
  font-size:12.5px;font-weight:800;box-shadow:0 3px 14px rgba(53,200,243,.2);}
.askbtn:hover{background:var(--accent-soft);}
.sip-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  padding:26px 18px;text-align:center;color:var(--ink-3);font-size:12px;line-height:1.5;}
/* inline colleague picker — never a modal, never over the model */
.picker{margin-top:8px;border:1px solid color-mix(in srgb,var(--accent) 34%,var(--line));border-radius:8px;
  background:color-mix(in srgb,var(--accent) 6%,var(--card-2));padding:9px;}
.picker .pl{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.picker .list{max-height:132px;overflow-y:auto;margin-top:6px;border:1px solid var(--line);border-radius:7px;background:var(--card);}
.picker .list::-webkit-scrollbar{width:5px;}
.picker .list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.prow{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:11.5px;cursor:pointer;min-width:0;}
.prow:hover{background:var(--card-2);}
.prow.on{background:color-mix(in srgb,var(--accent) 16%,transparent);}
.prow .n{font-weight:660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prow .r{margin-left:auto;font-size:9.5px;color:var(--ink-3);white-space:nowrap;flex:none;}
.picker .confirm{margin-top:8px;font-size:10.5px;color:var(--ink-2);line-height:1.45;}

/* ================================================== PERSONALISATION */
.pers{background:linear-gradient(180deg,#071726,var(--canvas));border-top:1px solid var(--line);padding:20px 26px 26px;}
:root[data-theme="light"] .pers{background:var(--canvas);}
.pers-head{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:15px;}
.pers-head h2{font-size:21px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;}
.pers-head p{margin:5px 0 0;font-size:12.5px;color:var(--ink-2);}
.pers-chips{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:64%;}
.pers-chips .fi{color:var(--ink-3);}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:660;color:var(--ink-2);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 11px;}
.chip b{color:var(--accent-2);font-weight:760;}
.chip.locked{padding-right:11px;}
.chip .x{width:15px;height:15px;border-radius:50%;border:none;background:var(--track);color:var(--ink-3);
  display:grid;place-items:center;font-size:10px;line-height:1;padding:0;cursor:pointer;}
.chip .x:hover{background:var(--red);color:#fff;}
.pers-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start;}
.pcol{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;min-width:0;}
.pcol h4{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink);}
.pcol .sub{font-size:10.5px;color:var(--ink-3);margin:4px 0 11px;line-height:1.4;}
.selrow{display:flex;align-items:center;gap:9px;margin-bottom:8px;min-width:0;}
.selrow .i{width:22px;flex:none;color:var(--ink-3);display:grid;place-items:center;}
.selrow .l{font-size:11.5px;color:var(--ink-2);width:58px;flex:none;}
.selbox{flex:1;min-width:0;position:relative;display:flex;align-items:center;
  border:1px solid var(--line);border-radius:7px;background:var(--card-2);padding:6px 9px;}
.selbox select{flex:1;min-width:0;background:transparent;border:none;color:var(--ink);font-family:var(--sans);
  font-size:11.8px;outline:none;-webkit-appearance:none;appearance:none;padding-right:14px;cursor:pointer;}
.selbox select option{background:var(--card);}
.selbox .cv{position:absolute;right:8px;color:var(--ink-3);pointer-events:none;}
.selbox:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
.ckgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;}
.ck{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11.5px;color:var(--ink-2);cursor:pointer;min-width:0;}
.ck:hover{color:var(--ink);}
.ck .bx{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);background:var(--card-2);flex:none;
  display:grid;place-items:center;color:transparent;}
.ck.on .bx{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.ck .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ck.dim{opacity:.45;}
.ck .dots{display:inline-flex;gap:2px;flex:none;}
.ck .dots i{width:6px;height:6px;border-radius:50%;}
.more-link{font-size:11px;font-weight:700;color:var(--accent);background:none;border:none;padding:4px 0;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;}
.more-link:hover{text-decoration:underline;}
.prev{display:flex;flex-direction:column;gap:1px;}
.prev .r{display:flex;align-items:center;gap:11px;padding:6px 0;}
.prev .i{width:28px;height:28px;flex:none;border-radius:7px;border:1px solid var(--line);background:var(--card-2);
  display:grid;place-items:center;color:var(--accent);}
.prev .n{font-size:20px;font-weight:800;min-width:30px;font-variant-numeric:tabular-nums;}
.prev .l{font-size:11.5px;color:var(--ink-2);}
.pers-more{margin-top:11px;}
.pers-more-b{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:9px;}
.pers-more.open .pers-more-b{display:grid;}
.pers-more.open .more-link .ic{transform:rotate(90deg);}
.pers-bar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:12px;padding:11px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;}
.pers-bar .bl{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-3);}
.pers-bar .grow{flex:1;}
.pers-bar .selbox{min-width:160px;flex:none;}
.thr{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:11.5px;color:var(--ink-2);}
.thr input[type=range]{flex:1;min-width:0;accent-color:var(--accent);}
.thr .tv{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent-2);min-width:40px;text-align:right;}
.pcol .sysrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
  background:var(--card-2);font-size:11.5px;cursor:pointer;min-width:0;}
.pcol .sysrow .n{font-weight:660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcol .sysrow .s{display:block;font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcol .sysrow .tail{margin-left:auto;flex:none;}
.pcol .sysrow.off{opacity:.5;}

/* ================================================== HOTSPOTS */
.hot .hb{width:36px;height:36px;border-radius:50%;border:3px solid;background:rgba(6,18,30,.72);
  backdrop-filter:blur(3px);font-size:15px;font-weight:840;box-shadow:none;transition:transform .18s;}
.hot.red .hb{border-color:var(--red);color:#fff;background:rgba(60,10,12,.66);
  box-shadow:0 0 16px rgba(255,91,87,.5),inset 0 0 10px rgba(255,91,87,.28);}
.hot.amber .hb{border-color:var(--amber);color:#fff;background:rgba(62,40,4,.66);
  box-shadow:0 0 16px rgba(255,189,69,.45),inset 0 0 10px rgba(255,189,69,.26);}
.hot.green .hb{border-color:var(--green);color:#fff;background:rgba(12,50,14,.66);
  box-shadow:0 0 16px rgba(121,220,107,.45),inset 0 0 10px rgba(121,220,107,.26);}
.hot .halo{inset:-8px;border-width:2px;}
.hot .hlab{opacity:0;transition:opacity .14s;font-size:10px;}
.hot:hover .hlab,.hot.open .hlab{opacity:1;}
.hot.open .hb{transform:scale(1.1);}
.hotsvg .hl{stroke-width:2.2;stroke-dasharray:7 5;opacity:1;filter:drop-shadow(0 0 6px rgba(255,189,69,.5));}
.hotsvg .hlt{font-size:9px;letter-spacing:.11em;}
.stageload{background:radial-gradient(ellipse at 50% 45%,#0c2a42 0%,#04101b 72%);}
.command-view .stagehint{display:none;}

/* ================================================== RESPONSIVE */
@media(max-width:1480px){
  .command-layout{grid-template-columns:330px minmax(520px,1fr) 282px;}
  .cl-greet h1{font-size:25px;}
}
@media(max-width:1320px){
  .command-layout{grid-template-columns:300px minmax(420px,1fr) 274px;gap:9px;}
  .kpi{padding:9px 10px;}
  .kpi .kl{font-size:8.5px;letter-spacing:.08em;}
  .kpi .kval{font-size:23px;}
  .acard .num{font-size:23px;width:15px;}
}
@media(max-height:820px){
  .command-layout{grid-template-rows:66px minmax(250px,1fr) 136px;}
  .cl-greet{height:66px;}
  .cl-greet h1{font-size:24px;}
  .acard .body{padding:9px 10px 9px 11px;}
  .locator{display:none;}
  .spanel{padding:9px 11px 8px;}
  .spanel .sh{margin-bottom:6px;}
  .bh-bar{height:10px;margin-bottom:6px;}
  .bh-row{padding:0;font-size:11.2px;}
  .wc{padding:4.5px 0;font-size:11.4px;}
  .cr-ax{font-size:9px;}
  .obtns{margin-top:6px;}
  .obtn{padding:6px 4px;}
  .sip-sec{margin:9px 0 5px;}
}
@media(max-width:1080px){
  .command-view{padding:10px;}
  .command-layout{display:flex;flex-direction:column;height:auto;gap:10px;}
  .cl-left{order:1;}
  .cl-kpis{order:2;grid-template-columns:repeat(3,1fr);}
  .asset-stage{order:3;height:min(58vh,440px);}
  .selected-issue-panel{order:4;max-height:none;border-left:1px solid var(--line);}
  .sip-body{overflow:visible;max-height:none;}
  .cl-strip{order:5;grid-template-columns:1fr!important;}
  .cl-attn{min-height:0;}
  .acards{overflow:visible;}
  .pers-cols{grid-template-columns:repeat(2,minmax(0,1fr));}
  .pers-more-b{grid-template-columns:1fr;}
  .pers-chips{max-width:100%;margin-left:0;justify-content:flex-start;}
}
@media(max-width:700px){
  .pers-cols{grid-template-columns:1fr;}
  .cl-kpis{grid-template-columns:1fr;}
  .pers{padding:16px 14px 20px;}
}

/* ================================================ BARRIER / DUAL ASSURANCE */
.stdnote{display:inline-flex;align-items:center;gap:6px;margin-top:18px;background:none;
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;
  font-size:11px;color:var(--ink-3);letter-spacing:.01em;}
.stdnote:hover{border-color:var(--accent);color:var(--accent);}
.asr-wrap{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card);}
table.asr{width:100%;border-collapse:collapse;font-size:12.5px;}
table.asr th{text-align:left;padding:10px 14px;background:var(--card-2);border-bottom:1px solid var(--line);
  font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;}
table.asr th span{display:block;font-weight:500;letter-spacing:.02em;text-transform:none;font-size:10px;color:var(--ink-3);opacity:.75;}
table.asr td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.asr tbody tr{cursor:pointer;transition:background .13s;}
table.asr tbody tr:hover{background:rgba(53,200,243,.07);}
table.asr tbody tr:last-child td{border-bottom:0;}
.asr-b b{display:block;font-weight:650;color:var(--ink);font-size:13px;}
.asr-b i,table.asr td i{display:block;font-style:normal;font-size:11px;color:var(--ink-3);margin-top:2px;}
.asr-t{font-size:17px;text-align:center;width:54px;}
.asr-p{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;}
.asr-red{background:rgba(255,91,87,.16);color:#ff8f8b;border:1px solid rgba(255,91,87,.4);}
.asr-amber{background:rgba(255,189,69,.15);color:#ffcf74;border:1px solid rgba(255,189,69,.4);}
.asr-watch{background:rgba(143,212,255,.13);color:#8fd4ff;border:1px solid rgba(143,212,255,.35);}
.asr-green{background:rgba(121,220,107,.13);color:#93e585;border:1px solid rgba(121,220,107,.35);}
.asr-foot{padding:9px 14px;color:var(--ink-3);border-top:1px solid var(--line);background:var(--card-2);}
.asr-conv{display:flex;align-items:center;gap:9px;margin-top:12px;padding:11px 14px;
  border:1px solid rgba(255,189,69,.32);background:rgba(255,189,69,.07);border-radius:10px;font-size:12.5px;color:var(--ink-2);}

.da-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:11px;padding:14px 16px;background:var(--card);margin-bottom:12px;}
.da-chain{display:flex;gap:26px;flex-wrap:wrap;min-width:0;}
.da-chain div{min-width:0;}
.da-chain span{display:block;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px;}
.da-chain b{font-size:13px;font-weight:620;color:var(--ink);}
.da-pick label{display:block;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;}
.da-pick select{background:var(--card-2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 9px;font-size:12px;}
.da-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.da-col{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:15px 16px;border-top-width:3px;}
.da-red{border-top-color:var(--red);} .da-amber{border-top-color:var(--amber);} .da-green{border-top-color:var(--green);}
.da-t{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.da-q{font-size:12px;color:var(--ink-2);margin:5px 0 11px;font-style:italic;}
.da-state{font-size:19px;font-weight:720;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.da-tr{font-size:11.5px;font-weight:500;}
.da-l{list-style:none;margin:11px 0 0;padding:0;}
.da-l li{position:relative;padding:5px 0 5px 15px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);}
.da-l li:first-child{border-top:0;}
.da-l li:before{content:'';position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--ink-3);}
.da-src{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-3);
  display:flex;align-items:center;gap:6px;}
.da-read{margin-top:12px;border:1px solid var(--line);border-left-width:3px;border-radius:11px;padding:15px 17px;background:var(--card);}
.da-read-red{border-left-color:var(--red);} .da-read-amber{border-left-color:var(--amber);}
.da-read-watch{border-left-color:#8fd4ff;} .da-read-green{border-left-color:var(--green);}
.da-rl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.da-rw{font-size:17px;font-weight:750;letter-spacing:.01em;margin:5px 0 7px;}
.da-rs{font-size:13.5px;line-height:1.55;color:var(--ink-2);max-width:82ch;}
.whybtn{margin-top:11px;display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);
  color:var(--accent);border-radius:999px;padding:5px 12px;font-size:11.5px;cursor:pointer;}
.whybtn:hover{background:rgba(53,200,243,.1);border-color:var(--accent);}
.da-rel{display:flex;flex-direction:column;gap:6px;}
.da-row{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;width:100%;text-align:left;
  background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;color:inherit;}
.da-row:hover{border-color:var(--accent);}
.da-rt b{display:block;font-size:12.5px;font-weight:620;color:var(--ink);}
.da-rt i{display:block;font-style:normal;font-size:11px;color:var(--ink-3);margin-top:2px;}
.whyol{margin:0;padding-left:20px;line-height:1.7;font-size:13px;color:var(--ink-2);}
.whyol li{margin-bottom:4px;}
@media (max-width:900px){.da-cols{grid-template-columns:1fr;}}

/* ------------------------------------------- cumulative risk AWARENESS
   No gauge, no score. Counts and the area they land on. */
.cra{display:flex;flex-direction:column;min-height:0;}
.cra-n{font-size:20px;font-weight:740;color:var(--ink);line-height:1.1;margin-top:2px;}
.cra-n b{color:var(--amber);font-weight:820;}
.cra-z{font-size:11.5px;color:var(--ink-3);margin:2px 0 8px;}
.cra-l{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden;}
.cra-i{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2);line-height:1.35;}
.cra-tag{flex:0 0 auto;font-size:8.5px;font-weight:800;letter-spacing:.06em;padding:1.5px 5px;border-radius:3px;}
.cra-red{background:rgba(255,91,87,.18);color:#ff8f8b;}
.cra-amber{background:rgba(255,189,69,.16);color:#ffcf74;}
.cra-go{margin-top:auto;padding-top:7px;font-size:10.5px;color:var(--accent);display:flex;align-items:center;gap:4px;}
.cra-none{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.45;}

/* ------------------------------------- cumulative risk awareness (full view) */
.cv-g{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:14px;overflow:hidden;}
.cv-h{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card-2);}
.cv-zn{font-size:13px;font-weight:780;letter-spacing:.06em;color:var(--ink);}
.cv-zs{font-size:11.5px;color:var(--ink-3);margin-top:3px;}
.cv-zs b{color:var(--amber);font-weight:750;}
.cv-lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px;padding:13px 16px;}
.cv-l{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);}
.cv-read{margin:0 16px 14px;padding:13px 15px;border:1px solid rgba(255,189,69,.3);
  background:rgba(255,189,69,.06);border-radius:10px;}
.cv-rl{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;}
.cv-rs{font-size:13px;line-height:1.56;color:var(--ink-2);max-width:88ch;}
.cv-act{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:11px;}
.cv-rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--ink);}
.cv-bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;padding:0 16px 15px;}
.cv-b{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;cursor:pointer;
  background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:inherit;}
.cv-b:hover{border-color:var(--accent);}
.cv-bn{font-size:12.5px;font-weight:650;color:var(--ink);}
.cv-bt{font-size:11px;color:var(--ink-3);}

.whybtn-full{width:100%;justify-content:center;margin:9px 0 2px;}
.wc-2 .n{display:flex;flex-direction:column;gap:1px;min-width:0;}
.wc-2 .n b{font-size:12px;font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wc-2 .n i{font-style:normal;font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* §2 — the standards line. Understated, on the foot of the command view,
   clickable but never in the way. */
.cmd-foot{display:flex;justify-content:flex-end;padding:8px 2px 0;}
.stdline{display:inline-flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;
  font-size:10.5px;color:var(--ink-3);letter-spacing:.012em;padding:2px 0;opacity:.82;transition:color .15s,opacity .15s;}
.stdline:hover{color:var(--accent);opacity:1;}

/* ---------------------------------------------- process safety by tier (§11) */
.ps-tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;margin-bottom:14px;}
.ps-tier{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 15px;}
.ps-tier.ps-bad{border-color:rgba(255,189,69,.4);}
.ps-lag{opacity:.72;}
.ps-tl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.ps-tt{font-size:11px;color:var(--accent);margin-top:3px;font-weight:650;}
.ps-tv{font-size:30px;font-weight:760;color:var(--ink);line-height:1.05;margin:6px 0 5px;font-variant-numeric:tabular-nums;}
.ps-td{font-size:11.5px;line-height:1.45;color:var(--ink-3);}
.ps-filter{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:11px;}
.ps-filter label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.ps-filter select{background:var(--card-2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 9px;font-size:12px;}

/* ------------------------------------------------- SECE dependency (§5–§8,§16) */
.dp-head{display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:center;
  border:1px solid var(--line);border-radius:12px;padding:15px 17px;background:var(--card);margin-bottom:12px;}
.dp-l{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.dp-n{font-size:19px;font-weight:740;color:var(--ink);margin:3px 0 4px;}
.dp-s{font-size:11.5px;color:var(--ink-3);}
.dp-c{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
.dp-chip{font-size:10px;background:var(--card-2);border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--ink-3);}
.dp-count{text-align:center;padding:0 16px;border-left:1px solid var(--line);border-right:1px solid var(--line);}
.dp-cv{font-size:34px;font-weight:780;color:var(--amber);line-height:1;}
.dp-cl{font-size:10.5px;color:var(--ink-3);margin-top:4px;line-height:1.35;}
.dp-cs{font-size:10.5px;color:var(--red);margin-top:5px;font-weight:650;}
.dp-pick label{display:block;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;}
.dp-pick select{background:var(--card-2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 9px;font-size:12px;}
.dp-concern{border:1px solid rgba(255,189,69,.36);background:rgba(255,189,69,.07);border-radius:11px;padding:14px 16px;margin-bottom:12px;}
.dp-ct{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--amber);margin-bottom:7px;}
.dp-cb{font-size:13.5px;line-height:1.55;color:var(--ink);max-width:88ch;}
.dp-list{display:flex;flex-direction:column;gap:6px;}
.dp-row{display:grid;grid-template-columns:78px 1fr auto auto;gap:13px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 13px;cursor:pointer;color:inherit;}
.dp-row:hover{border-color:var(--accent);}
.dp-row.dp-weak{border-color:rgba(255,91,87,.42);background:rgba(255,91,87,.05);}
.dp-d{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-align:center;padding:3px 0;border-radius:4px;}
.dp-red{background:rgba(255,91,87,.18);color:#ff8f8b;}
.dp-amber{background:rgba(255,189,69,.16);color:#ffcf74;}
.dp-watch{background:rgba(143,212,255,.14);color:#8fd4ff;}
.dp-green{background:rgba(121,220,107,.14);color:#93e585;}
.dp-rn b{display:block;font-size:12.5px;font-weight:640;color:var(--ink);}
.dp-rn i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:2px;}
.dp-rs{font-size:11px;color:var(--ink-3);white-space:nowrap;}
.dp-flag{font-size:9.5px;font-weight:800;letter-spacing:.05em;color:#ff8f8b;
  background:rgba(255,91,87,.16);border-radius:999px;padding:3px 9px;white-space:nowrap;}
.dp-mini{background:var(--card-2);border:1px solid var(--line);border-radius:7px;padding:4px 9px;
  font-size:11px;color:var(--ink-2);cursor:pointer;}
.dp-mini:hover{border-color:var(--accent);color:var(--accent);}
@media (max-width:900px){.dp-head{grid-template-columns:1fr;}.dp-count{border:0;padding:0;text-align:left;}
  .dp-row{grid-template-columns:70px 1fr;}.dp-rs,.dp-flag{grid-column:1 / -1;}}

/* §20 — each attention card carries the one thing to do next. */
.acta{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:10.5px;font-weight:650;
  color:var(--accent);cursor:pointer;letter-spacing:.012em;}
.acta:hover{text-decoration:underline;}

/* §7 — the dependency toggle. One control, bottom-right of the stage, off by
   default, and it never sits over the asset's silhouette. */
.dep-toggle{position:absolute;right:10px;bottom:10px;z-index:4;display:inline-flex;align-items:center;gap:6px;
  background:rgba(7,20,32,.9);border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  font-size:10.5px;color:var(--ink-2);cursor:pointer;backdrop-filter:blur(4px);}
.dep-toggle:hover{border-color:var(--accent);color:var(--accent);}
.dep-toggle.on{border-color:var(--amber);color:var(--amber);background:rgba(45,32,10,.9);}
.dep-toggle em{font-style:normal;font-weight:800;font-size:9.5px;background:rgba(255,255,255,.1);
  border-radius:999px;padding:1px 6px;}

.hotsvg .dlt{font-size:8.5px;font-weight:800;letter-spacing:.07em;
  paint-order:stroke;stroke:rgba(4,12,20,.85);stroke-width:2.5px;}

.astage-svg .hl{stroke:var(--amber);stroke-width:2.2;stroke-dasharray:7 5;fill:none;opacity:1;
  filter:drop-shadow(0 0 6px rgba(255,189,69,.5));}
.astage-svg .hlt{font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;fill:var(--amber);}
.astage-svg .dlt{font-size:8.5px;font-weight:800;letter-spacing:.07em;
  paint-order:stroke;stroke:rgba(4,12,20,.85);stroke-width:2.5px;}
.astage-svg path{fill:none;}

/* ================================================== THE ASSET STAGE
   The picture is the hero. No card, no border, no frame — the feathered
   image sits directly on the canvas and the hotspots live over it. */
.astage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden;}
.astage-wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.astage-img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;
  object-fit:contain;user-select:none;-webkit-user-drag:none;}
.astage-hots{position:absolute;inset:0;pointer-events:none;}
.astage-svg{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;}

.ahot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  background:none;border:0;padding:0;width:0;height:0;}
.ah-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:11px;height:11px;border-radius:50%;background:var(--hc,#79dc6b);
  box-shadow:0 0 0 2.5px rgba(4,12,20,.72),0 0 12px 2px var(--hg,rgba(121,220,107,.55));}
.ah-ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:11px;height:11px;border-radius:50%;border:2px solid var(--hc,#79dc6b);opacity:0;}
.ahot.live .ah-ring{animation:ahpulse 2.6s cubic-bezier(.2,.6,.3,1) infinite;}
@keyframes ahpulse{0%{width:11px;height:11px;opacity:.85;}100%{width:64px;height:64px;opacity:0;}}
.ahot.red   {--hc:#ff5b57;--hg:rgba(255,91,87,.6);}
.ahot.amber {--hc:#ffbd45;--hg:rgba(255,189,69,.6);}
.ahot.green {--hc:#79dc6b;--hg:rgba(121,220,107,.5);}
.ah-lab{position:absolute;left:50%;top:15px;z-index:2;transform:translateX(-50%);
  white-space:nowrap;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-2);background:rgba(5,15,25,.74);border:1px solid rgba(120,160,190,.22);
  border-radius:999px;padding:2.5px 8px;opacity:0;transition:opacity .18s;backdrop-filter:blur(3px);}
.ah-lab b{margin-left:5px;color:var(--hc,#79dc6b);font-weight:800;}
.ahot:hover .ah-lab,.ahot.sel .ah-lab,.ahot.live .ah-lab{opacity:1;}
.ahot.sel .ah-core{width:15px;height:15px;box-shadow:0 0 0 3px rgba(4,12,20,.8),0 0 0 5px var(--hc),0 0 18px 4px var(--hg);}
.ahot:hover .ah-core{transform:translate(-50%,-50%) scale(1.18);}
.ahot.flash .ah-ring{animation:ahpulse .7s ease-out 2;}

.astage-foot{position:absolute;left:12px;bottom:8px;z-index:9;pointer-events:auto;}
.astage-tag{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);background:rgba(5,15,25,.7);
  border:1px solid rgba(120,160,190,.2);border-radius:999px;padding:4px 10px;backdrop-filter:blur(3px);}
.astage-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:0 0 auto;}
.astage-i{width:15px;height:15px;border-radius:50%;border:1px solid var(--ink-3);background:none;
  color:var(--ink-3);font-size:9px;font-weight:700;line-height:1;cursor:pointer;font-style:italic;}
.astage-i:hover{border-color:var(--accent);color:var(--accent);}

/* the area thumbnail in the issue panel */
.loc-img{position:relative;border-radius:8px;overflow:hidden;line-height:0;border:1px solid var(--line);}
.loc-img img{width:100%;display:block;}
.loc-pin{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--pc);
  transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(4,12,20,.75),0 0 10px 2px var(--pc);}
.locator-none{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);
  border:1px dashed var(--line);border-radius:8px;padding:10px 12px;}
/* the stage owns its own ground now — no card behind it */
.asset-stage{background:transparent!important;border-color:transparent!important;}

/* -------------------------------------------------- header: Clarity for <customer>
   The Clarity mark leads. The customer mark, when supplied, sits after a quiet
   "for" so the hierarchy reads as a Clarity product tailored for them. */
.tb-left{display:flex;align-items:center;gap:12px;min-width:0;}
.tb-mark{display:inline-flex;align-items:center;line-height:0;text-decoration:none;
  background:#fff;border-radius:6px;padding:5px 9px;
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 2px 8px rgba(0,0,0,.34);}
.tb-mark img{height:22px;width:auto;display:block;}
.tb-mark-cust img{height:20px;}
.tb-for{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
.tb-asset{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.tb-asset b{font-size:14px;font-weight:750;letter-spacing:.055em;color:var(--ink);text-transform:uppercase;}
.tb-asset i{font-style:normal;font-size:10.5px;color:var(--ink-3);white-space:nowrap;}
.tb-ctx{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:none;
  color:var(--ink-3);cursor:pointer;display:grid;place-items:center;flex:0 0 auto;}
.tb-ctx:hover{border-color:var(--accent);color:var(--accent);}
.tb-demo{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  border:1px solid rgba(255,189,69,.3);background:rgba(255,189,69,.07);
  border-radius:999px;padding:3px 9px;white-space:nowrap;}
@media (max-width:1240px){.tb-demo{display:none;} .tb-asset i{display:none;}}

/* ================================================ CROSS-DOMAIN (v9)
   Attention states, not risk ratings — the wording on screen says so. */
.kpi .kstate{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  margin-left:auto;white-space:nowrap;}
.kcross{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:9.5px;color:var(--accent);}


.notrisk{display:flex;align-items:center;gap:6px;margin:12px 0 20px;font-size:10.5px;color:var(--ink-3);
  border-top:1px solid var(--line);padding-top:9px;}

.xd-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:14px;}
.xd-l{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.xd-n{font-size:19px;font-weight:740;color:var(--ink);margin:4px 0 6px;}
.xd-r{font-size:13px;line-height:1.55;color:var(--ink-2);max-width:78ch;}
.xd-loc{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px;color:var(--ink-3);}
.xd-loc b{color:var(--accent);}
.xd-pick label{display:block;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;}
.xd-pick select{background:var(--card-2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 9px;font-size:12px;max-width:260px;}

/* the tram-lines: one source, three tracks */
.tram{display:grid;grid-template-columns:200px 1fr;gap:0;align-items:center;}
.tram-src{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:650;color:var(--ink);
  background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:12px 13px;}
.tram-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:0 0 auto;
  box-shadow:0 0 0 4px rgba(53,200,243,.16);}
.tram-lines{display:flex;flex-direction:column;gap:9px;}
.tram-row{display:grid;grid-template-columns:60px 1fr;align-items:center;}
.tram-w{width:60px;height:44px;}
.tram-w path{stroke:var(--line);stroke-width:2;}
.tram-row.on.t-red   .tram-w path{stroke:var(--red);}
.tram-row.on.t-amber .tram-w path{stroke:var(--amber);}
.tram-row.on.t-green .tram-w path{stroke:var(--green);}
.tram-row.off{opacity:.45;}
.tram-row.off .tram-w path{stroke-dasharray:3 4;}
.tram-card{display:grid;gap:3px;text-align:left;width:100%;color:inherit;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;}
.tram-row.off .tram-card{cursor:default;}
.tram-row.on .tram-card:hover{border-color:var(--accent);}
.tc-d{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);}
.tc-s{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;}
.tc-t{font-size:13.5px;font-weight:650;color:var(--ink);}
.tc-b{font-size:12px;line-height:1.5;color:var(--ink-2);max-width:82ch;}
.tc-x{font-size:11px;color:var(--ink-3);font-style:italic;}

/* company rules: asset performance and systemic weakness side by side */
.rl-wrap{display:flex;flex-direction:column;gap:11px;}
.rl{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.rl-h{padding:13px 15px;border-bottom:1px solid var(--line);background:var(--card-2);}
.rl-n{font-size:13.5px;font-weight:700;color:var(--ink);}
.rl-r{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.5;max-width:92ch;}
.rl-cols{display:grid;grid-template-columns:1fr 1fr;}
.rl-c{padding:12px 15px;border-left:3px solid transparent;}
.rl-c+.rl-c{border-left:1px solid var(--line);}
.rl-bu{background:rgba(255,255,255,.015);}
.rl-red{border-left-color:var(--red);} .rl-amber{border-left-color:var(--amber);} .rl-green{border-left-color:var(--green);}
.rl-cl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.rl-scope{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:none;
  background:rgba(53,200,243,.12);color:var(--accent);border-radius:999px;padding:1.5px 7px;}
.rl-cs{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:6px 0 3px;}
.rl-cv{font-size:14px;font-weight:650;color:var(--ink);}
.rl-cn{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.45;}

/* the quiet strip: what this asset carries from above */
.bustrip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-top:9px;color:inherit;}
.bustrip:hover{border-color:var(--accent);}
.bs-l{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;}
.bs-i{display:flex;flex-direction:column;font-size:11px;color:var(--ink-2);min-width:0;}
.bs-i i{font-style:normal;font-size:9.5px;color:var(--ink-3);}
.bs-i.bs-red{color:#ff8f8b;} .bs-i.bs-amber{color:#ffcf74;}
@media (max-width:1000px){.tram{grid-template-columns:1fr;} .rl-cols{grid-template-columns:1fr;}
  .rl-c+.rl-c{border-left:0;border-top:1px solid var(--line);} .bustrip{flex-wrap:wrap;}}

/* Tier 4 broadened — competence, MOC, audits, resourcing, not just completion */
.t4dim{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);}
.t4dim-h{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;}
.t4d{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 0 4px 9px;
  border-left:2px solid var(--line);font-size:11.5px;}
.t4d+.t4d{margin-top:2px;}
.t4-red{border-left-color:var(--red);} .t4-amber{border-left-color:var(--amber);} .t4-green{border-left-color:var(--green);}
.t4d-n{color:var(--ink-2);}
.t4d-v{color:var(--ink);font-weight:650;white-space:nowrap;}
.t4d-v i{font-style:normal;color:var(--ink-3);font-weight:500;}
.t4dim-f{margin-top:9px;font-size:10.5px;line-height:1.45;color:var(--ink-3);}

/* ============================= OPERATIONAL STATUS SCALE (v10)
   Not risk colours. Blues and neutrals, one restrained amber at the top.
   No red on any operational-intelligence screen — inside Harbour a formal
   RED carries governance consequences and must not be borrowed to mean
   "needs a look". */
:root{
  --st-act:#e0a33c; --st-assur:#a58ce0; --st-att:#35c8f3; --st-watch:#6f9fc9; --st-norm:#7d94a8;
  --st-act-bg:rgba(224,163,60,.11);   --st-assur-bg:rgba(165,140,224,.11);
  --st-att-bg:rgba(53,200,243,.10);   --st-watch-bg:rgba(111,159,201,.10);
  --st-norm-bg:rgba(125,148,168,.09);
}
.tone-act{color:var(--st-act);} .tone-assur{color:var(--st-assur);}
.tone-att{color:var(--st-att);} .tone-watch{color:var(--st-watch);} .tone-norm{color:var(--st-norm);}

/* domain tiles: a status bar, not a coloured block. No filled circles. */
.kpi.dom-act .ki{color:var(--st-act);}   .kpi.dom-assur .ki{color:var(--st-assur);}
.kpi.dom-att .ki{color:var(--st-att);}   .kpi.dom-watch .ki{color:var(--st-watch);}
.kpi.dom-norm .ki{color:var(--st-norm);}
.kpi[class*="dom-"]{position:relative;overflow:hidden;}
.kpi[class*="dom-"]:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st-norm);}
.kpi.dom-act:before{background:var(--st-act);}     .kpi.dom-assur:before{background:var(--st-assur);}
.kpi.dom-att:before{background:var(--st-att);}     .kpi.dom-watch:before{background:var(--st-watch);}
.kstate{padding:2px 7px;border-radius:999px;background:var(--st-norm-bg);}
.tone-act.kstate{background:var(--st-act-bg);}   .tone-assur.kstate{background:var(--st-assur-bg);}
.tone-att.kstate{background:var(--st-att-bg);}   .tone-watch.kstate{background:var(--st-watch-bg);}

/* tram tracks follow the same scale */
.tram-row.on.t-act   .tram-w path{stroke:var(--st-act);}
.tram-row.on.t-assur .tram-w path{stroke:var(--st-assur);}
.tram-row.on.t-att   .tram-w path{stroke:var(--st-att);}
.tram-row.on.t-watch .tram-w path{stroke:var(--st-watch);}
.tram-row.on.t-norm  .tram-w path{stroke:var(--st-norm);}
.tram-src .tram-dot{background:var(--st-att);box-shadow:0 0 0 4px var(--st-att-bg);}

/* rules layer */
.rl-act{border-left-color:var(--st-act);}   .rl-assur{border-left-color:var(--st-assur);}
.rl-att{border-left-color:var(--st-att);}   .rl-watch{border-left-color:var(--st-watch);}
.rl-norm{border-left-color:var(--st-norm);}
.bs-i.bs-act{color:var(--st-act);}  .bs-i.bs-assur{color:var(--st-assur);}
.bs-i.bs-att{color:var(--st-att);}  .bs-i.bs-watch{color:var(--st-watch);}

/* the caption that must sit wherever colour is used */
.statuscap{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--ink-3);
  border-top:1px solid var(--line);margin-top:10px;padding-top:8px;}

/* -------------------- front page: no red (v10, Mike's governance point)
   The attention cards and the asset hotspots sit on the operating picture,
   so they follow the operational status scale rather than RAG. Green is
   kept for recoveries — a recovery reads as good news and carries no risk-
   governance meaning. Red is removed entirely from this screen. */
.acard.red .edge{background:var(--st-act);}
.acard.red .dot{background:var(--st-act);box-shadow:0 0 0 4px var(--st-act-bg);}
.acard.amber .edge{background:var(--st-att);}
.acard.amber .dot{background:var(--st-att);box-shadow:0 0 0 4px var(--st-att-bg);}
.ahot.red{--hc:#e0a33c;--hg:rgba(224,163,60,.55);}
.ahot.amber{--hc:#35c8f3;--hg:rgba(53,200,243,.5);}
.cra-tag.cra-red{background:var(--st-act-bg);color:var(--st-act);}
.cra-tag.cra-amber{background:var(--st-att-bg);color:var(--st-att);}
.cra-n b{color:var(--st-act);}

/* strip panels sit on the operating picture, so they follow the status scale */
.cl-strip .rag-red{background:var(--st-act)!important;}
.cl-strip .rag-amber{background:var(--st-att)!important;}
.cl-strip .sevdot.sev-high{background:var(--st-act);}
.cl-strip .sevdot.sev-med{background:var(--st-att);}

/* ---------------------------------------- Harbour classification panel (v11)
   Drill-down only. Never on the main screen. */
.hbp{border:1px solid var(--line);border-radius:10px;background:var(--card-2);
  padding:12px 14px;margin-bottom:14px;}
.hbp-h{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--st-att);margin-bottom:10px;}
.hbp-g{display:flex;flex-direction:column;gap:7px;}
.hbp-r{display:grid;grid-template-columns:148px 1fr;gap:12px;align-items:baseline;}
.hbp-k{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}
.hbp-v{font-size:12.5px;color:var(--ink-2);line-height:1.45;}
.hbp-v b{color:var(--ink);font-weight:700;}
.hbp-d{font-size:11px;color:var(--ink-3);line-height:1.5;}
.hbp-none{font-style:italic;color:var(--ink-3);}
.hbp-sup{font-size:10.5px;color:var(--ink-3);margin-left:6px;}
.hbp-go{background:none;border:0;color:var(--st-att);font-size:11px;cursor:pointer;
  text-decoration:underline;padding:0 0 0 7px;}
.hbp-f{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  font-size:10px;line-height:1.45;color:var(--ink-3);}
@media (max-width:640px){.hbp-r{grid-template-columns:1fr;gap:2px;}}

/* Harbour PSPI feeds — shown in the data map as sources, never as a report */
.pspi-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:7px;}
.pspi{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);
  border-left:2px solid var(--st-watch);border-radius:8px;padding:9px 11px;position:relative;}
.pspi-x{border-left-color:var(--st-assur);}
.pspi-n{font-size:12px;font-weight:620;color:var(--ink);}
.pspi-s{font-size:10.5px;color:var(--ink-3);}
.pspi-b{position:absolute;right:9px;top:8px;font-size:8.5px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--st-assur);background:var(--st-assur-bg);border-radius:999px;padding:1.5px 7px;}
</style>
</head>
<body>
<div id="app">
  <nav class="iconrail" id="iconrail"></nav>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="outlet" id="outlet"></div>
  </div>
</div>

<!-- The asset stage is created once and moved into whichever view mounts it,
     so the WebGL context and the loaded geometry survive navigation. -->
<div id="stagehost">
  <canvas id="c"></canvas>
  <svg class="hotsvg" id="hotsvg"></svg>
  <div id="overlay"></div>
  <div class="stagehint" id="stagehint"></div>
  <div class="stageload" id="stageload"><div><span class="sl-spin"></span><span id="stageloadTxt">Unpacking Mittelplate…</span></div></div>
</div>

<div class="powered-by">Powered by <strong>Clarity Energy</strong></div>
<div class="toast" id="toast"></div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="notifpop" id="notifPop"></div>

/* ---------------------------------------------------------------- clock */
const NOW=new Date();
function minus(h){return new Date(NOW.getTime()-h*3600000);}
function atToday(h,m){const d=new Date(NOW);d.setHours(h,m||0,0,0);return d;}
const LAST_IMPORT=atToday(5,0);
const LAST_LOGIN=new Date(atToday(17,30).getTime()-86400000);   /* yesterday 17:30 */
const HOURS_SINCE_LOGIN=Math.max(1,Math.round((NOW-LAST_LOGIN)/3600000));
function hhmm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function dayLabel(d){
  const a=new Date(NOW);a.setHours(0,0,0,0);
  const b=new Date(d); b.setHours(0,0,0,0);
  const diff=Math.round((a-b)/86400000);
  if(diff===0)return'Today';if(diff===1)return'Yesterday';if(diff<7)return diff+' days ago';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function stamp(d){return dayLabel(d)+' · '+hhmm(d);}
function ago(h){
  if(h<1)return'under an hour ago';
  if(h<48)return Math.round(h)+' hours ago';
  return Math.round(h/24)+' days ago';
}
function dueLabel(d){
  if(!d)return'No response date set';
  const diff=(d-NOW)/3600000;
  if(diff<0){const h=Math.abs(diff);return h>=24?'Overdue by '+Math.round(h/24)+' days':'Overdue by '+Math.round(h)+' hours';}
  return dayLabel(d)+' at '+hhmm(d);
}

/* days-to-expiry parsed out of the status text — no structured field exists */
function horizon(e){
  let m;
  if((m=/(\d+)\s*days?\s*past planned finish/i.exec(e.status)))return{d:-(+m[1]),src:'past planned finish'};
  if((m=/due in\s*(\d+)\s*days?/i.exec(e.status)))return{d:+m[1],src:'planned finish'};
  if((m=/deferred\s*(\d+)\s*days?/i.exec(e.status)))return{d:+m[1],src:'deferral expiry'};
  if((m=/defined life\s*(\d+)\s*days?/i.exec(e.status)))return{d:+m[1]-Math.round(e.raised/24),src:'defined life'};
  if((m=/review due in\s*(\d+)\s*days?/i.exec(e.status)))return{d:+m[1],src:'review date'};
  if(/expired/i.test(e.status))return{d:-1,src:'expiry'};
  return null;
}

/* Every event that acts against a barrier. Scope is optional so the same
   function serves the whole asset, one preference scope, or a point in time. */
function barrierEvents(id,scope){
  const b=barrierById(id); if(!b)return[];
  return (scope||openEvents()).filter(e=>e.open&&b.sece.indexOf(e.sece)>-1);
}
/* Condition rule, stated on screen wherever it is read:
   Impaired — an open high-severity event with no compensating measure recorded
   Degraded — an open high-severity event with one, or any open medium event
   Watch    — only low-severity open events
   Intact   — nothing open  */
const COND={impaired:{w:'Impaired',c:'red', score:20,rank:4},
            degraded:{w:'Degraded',c:'amber',score:60,rank:3},
            watch:   {w:'Watch',   c:'watch',score:85,rank:2},
            intact:  {w:'Intact',  c:'green',score:100,rank:1}};
function barrierState(id,scope){
  const list=barrierEvents(id,scope);
  let k='intact';
  if(list.some(e=>e.sev==='high'&&!e.compensated))k='impaired';
  else if(list.some(e=>e.sev==='high')||list.some(e=>e.sev==='med'))k='degraded';
  else if(list.length)k='watch';
  return Object.assign({key:k,n:list.length,events:list},COND[k]);
}
function barrierHealth(scope){
  const s=BARRIERS.map(b=>barrierState(b.id,scope));
  const sum=s.reduce((a,x)=>a+x.score,0);
  return{index:Math.round(sum/BARRIERS.length),sum:sum,n:BARRIERS.length,states:s,
    impaired:s.filter(x=>x.key==='impaired').length,
    degraded:s.filter(x=>x.key==='degraded').length,
    watch:s.filter(x=>x.key==='watch').length,
    intact:s.filter(x=>x.key==='intact').length};
}

  rule:'Tier 3 is computed from the open records against each SECE. Tier 4 is planned-activity completion against target. Weakening on both reads ATTENTION REQUIRED; weakening on Tier 3 alone reads REVIEW EFFECTIVENESS; weakening on Tier 4 alone reads ASSURANCE ATTENTION',
  f:['sece','sev','compens'],
  caveat:'Clarity is not certified, approved or formally compliant with IOGP 456 or API RP 754. The standards provide the architecture; no part of them is reproduced here.'};
PROV.tier4={k:'Not held',t:'Tier 4 assurance figures',
  what:'Whether the activities intended to keep a barrier healthy are actually being completed — planned testing, inspections, assurance actions, competency.',
  rule:'Planned-activity completion against a 95% conformance target, with overdue inspections and overdue assurance actions counted separately',
  f:['owner','closed'],
  caveat:'NO ASSURANCE-COMPLETION FEED WAS SUPPLIED with the material supplied. Every Tier 4 figure on these screens is illustrative and shows the shape of what Maximo, SAP and a competency system would supply. The Tier 3 side is computed from registers that were supplied.'};
PROV.convergence={k:'Method',t:'Evidence convergence',
  what:'Where independently managed conditions are landing on the same area, the same barrier or the same hazard at the same time.',
  rule:'An area is reported as converging where three or more open records, from two or more different registers, act against two or more critical barriers. Counts only — no score is computed',
  f:['zone','sece','kind'],
  caveat:'Clarity does not calculate cumulative risk and does not claim to have performed a risk assessment. It reports the evidence and leaves the judgement to the reader.'};

PROV.dep={k:'Record',t:'SECE dependency',
  what:'How far one SECE relies on another to do its job. the operator supplied this as a matrix: 29 Mittelplate SECEs and 199 recorded relationships.',
  rule:'Taken from the supplied SECE dependency matrix, sheet “TA Roles and Responsibilities”. Row is the primary (dependent) SECE, column is the supporting SECE, and the value is the operator’s five-level scale — Total, High, Medium, Low, None. Values are carried unaltered',
  f:['sece'],
  caveat:'The relationships are the operator’s. The mapping of those SECEs onto the hub’s ten working barriers is Clarity’s and is marked wherever it is used. The separate “degree of importance to the hazard” scale in the same workbook is marked there as not currently used, and is not used here either.'};

PROV.crossdomain={k:'Method',t:'Connected consequences',
  what:'How one operational condition is shown across safety, production and environment without becoming three separate issues.',
  rule:'A condition is recorded once, with the source records it was built from. Each domain carries a consequence describing what that same condition means there. Nothing is authored per-domain',
  f:['sece','zone'],
  caveat:'Attention states are not risk ratings. Clarity does not assign a risk level in any domain — it shows what needs looking at and leaves the judgement to the competent person.'};
PROV.rules={k:'Method',t:'Company rules and assurance',
  what:'How this asset performs against common business expectations, and whether the expectation itself is sound.',
  rule:'Three separate readings per rule: the rule, this asset against it, and any business-unit weakness in the rule or the process behind it. A systemic weakness is never counted as the asset’s failure',
  f:['owner','closed'],
  caveat:'Illustrative demonstration content. The rules, the asset performance and the business-unit findings are all fictional.'};

/* ================================================== ROLES + PREFERENCES */
const ROLES={
  ops  :{short:'Operational',       label:'Operational — Operations Manager',
         line:'Ordered by what has to be decided on shift. Location and compensating measures first.'},
  safety:{short:'Safety & Technical',label:'Safety & Technical — process safety and integrity',
         line:'Ordered by barrier condition and evidence. Barriers, SECEs and data confidence first.'},
  exec :{short:'Executive',          label:'Executive — asset leadership',
         line:'Ordered by exposure and accountability. Position, ownership coverage and trend first.'}
};
const COMPONENTS=[
 {id:'exec',    n:'Executive position'},
 {id:'attention',n:'Requires your attention',lock:true},
 {id:'asset',   n:'3D asset view'},
 {id:'changed', n:'What changed'},
 {id:'barrier', n:'Barrier health'},
 {id:'cum',     n:'Cumulative risk'},
 {id:'queue',   n:'Action queue'},
 {id:'trends',  n:'Leading trends'},

 {id:'ask',     n:'Ask Clarity'}
];
const MONITOR=[
 {id:'mah',   n:'Major accident hazards',s:'MAHs'},
 {id:'bar',   n:'Barrier condition',s:'Barrier condition'},
 {id:'sece',  n:'SECE condition'},
 {id:'ps',    n:'Performance-standard exceptions',s:'Perf. standards',gap:'No performance-standard register was supplied'},
 {id:'ora',   n:'Operational Risk Assessments',s:'ORAs'},
 {id:'defer', n:'Maintenance deferrals',s:'Deferrals'},
 {id:'dlr',   n:'Defined-life repairs',s:'Defined-life repairs'},
 {id:'integ', n:'Integrity anomalies',s:'Integrity anomalies'},
 {id:'scwo',  n:'Safety-critical work orders',s:'SC work orders'},
 {id:'act',   n:'Actions',s:'Actions'},
 {id:'pi',    n:'Live PI / process conditions',s:'PI conditions',gap:'No AVEVA PI connection supplied'},
 {id:'hot',   n:'Emerging hotspots',s:'Hotspots'},
 {id:'cum',   n:'Cumulative-risk relationships',s:'Cumulative links'},

const RULES=[
 {id:'new',     n:'New since last login',s:'New since login'},
 {id:'redonly', n:'Red only',s:'Red only'},
 {id:'redamber',n:'Red and amber',s:'Red + Amber'},
 {id:'imp',     n:'Impaired barriers',s:'Impaired barriers'},
 {id:'deg',     n:'Degraded barriers',s:'Degraded barriers'},
 {id:'overdue', n:'Overdue items',s:'Overdue items'},
 {id:'expiring',n:'Items approaching expiry',s:'Approaching expiry'},
