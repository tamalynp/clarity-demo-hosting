 {id:'repeat',  n:'Repeated events against the same SECE',s:'Repeated SECE'},
 {id:'multi',   n:'Multiple events in the same zone',s:'Same-zone cluster'},
 {id:'common',  n:'Events affecting a common barrier',s:'Common barrier'},
 {id:'cumcon',  n:'Events contributing to cumulative exposure',s:'Cumulative link'},
 {id:'noowner', n:'Items without an attention owner',s:'No attention owner'},
 {id:'awaiting',n:'Assignments awaiting acknowledgement',s:'Awaiting ack'},
 {id:'nodate',  n:'Items without a recovery or completion date',s:'No recovery date'}
];
const OWNER_FILTERS=[
 {id:'all',     n:'Everything'},
 {id:'mine',    n:'Assigned to me'},
 {id:'byme',    n:'Assigned by me'},
 {id:'unass',   n:'Unassigned'},
 {id:'team',    n:'My team'},
 {id:'odassign',n:'Overdue assignments'},
 {id:'today',   n:'Due today'},
 {id:'ackd',    n:'Acknowledged'},
 {id:'awaiting',n:'Awaiting acknowledgement'},
 {id:'done',    n:'Completed'}
];
const DEFAULT_PREFS={
  scope:['topsides','support'],
  monitor:['mah','bar','sece','ora','defer','dlr','integ','scwo','act','hot','cum','dq','unass','ackst'],
  rules:['redamber','imp','deg','overdue','multi','common','cumcon','noowner'],
  systems:['maximo','synergi','anomaly','sap'],
  components:['exec','attention','asset','changed','barrier','cum','ask'],
  thresholds:{overdue:1,expiry:14,minSev:'med',hotspot:3,cumMin:55,confidence:25},
  window:48,
  compact:false
};
const SAVED_VIEW_SEEDS=[
 {id:'morning',n:'My Morning Review',def:true,p:{}},
 {id:'daily',  n:'Mittelplate Daily Operations',p:{window:24,rules:['redamber','overdue','multi','noowner']}},
 {id:'psr',    n:'Process Safety Review',p:{role:'safety',window:168,monitor:['mah','bar','sece','ora','dlr','integ','cum','dq'],rules:['imp','deg','common','repeat','cumcon'],components:['exec','attention','barrier','cum','changed','confid','ask']}},
 {id:'weekly', n:'Weekly Leadership Meeting',p:{role:'exec',window:168,components:['exec','attention','cum','queue','trends','barrier'],rules:['redonly','imp','noowner','awaiting']}},
 {id:'shut',   n:'Shutdown Focus',p:{window:168,rules:['overdue','expiring','nodate'],monitor:['defer','dlr','scwo','integ','act']}},
 {id:'integ',  n:'Integrity and Deferrals',p:{window:168,monitor:['dlr','integ','defer','scwo','dq'],rules:['overdue','expiring','nodate','repeat']}},
 {id:'alloc',  n:'My Allocated Actions',p:{ownerFilter:'mine',components:['attention','queue','changed']}}
];
</script>
<script>
"use strict";
/* ============================================================================
   STATE, PERSISTENCE AND THE DERIVATION ENGINE
   Preferences, ownership, acknowledgement and audit history all live here and
   are written to local storage. Every screen recomputes from this on render,
   so a change made anywhere shows up everywhere.
   ========================================================================== */
const LS_KEY='clarity.oih.demoasset.v1';

const STATE={
  role:'ops',
  depShow:null,
  prefs:JSON.parse(JSON.stringify(DEFAULT_PREFS)),
  ownerFilter:'all',
  savedViews:JSON.parse(JSON.stringify(SAVED_VIEW_SEEDS)),
  activeView:'morning',
  defaultView:'morning',
  prefOpen:false,
  prefDraft:null,
  openAttn:null,
  ownMode:null,            /* null | 'assign' */
  ownPick:null,
  ownQuery:'',
  selEvent:null,
  selZone:null,
  strandsOff:[],
  kindFilter:{ora:true,deferral:true,dlr:true},
  showZones:true, showPins:true, riskColour:true,
  seen:{},                 /* event id -> true, drives the NEW flag */
  thread:[],
  roleFlash:'',
  tour:-1,
  notifOpen:false
};

/* ------------------------------------------------------------ persistence */
function persist(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify({
      prefs:STATE.prefs,role:STATE.role,activeView:STATE.activeView,defaultView:STATE.defaultView,
      savedViews:STATE.savedViews.map(v=>({id:v.id,n:v.n,p:v.p,def:v.def,custom:v.custom})),
      seen:STATE.seen,ownerFilter:STATE.ownerFilter,
      attn:ATTENTION.map(a=>({id:a.id,owner:a.owner,due:a.due?a.due.toISOString():null,ack:a.ack,
        ackAt:a.ackAt?a.ackAt.toISOString():null,instruction:a.instruction,done:!!a.done,
        assignedAt:a.assignedAt?a.assignedAt.toISOString():null,assignedBy:a.assignedBy||null,
        notified:a.notified||null,
        audit:a.audit.map(x=>({t:x.t?new Date(x.t).toISOString():null,k:x.k,s:x.s,d:x.d}))}))
    }));
  }catch(e){/* private browsing — the demonstration still works, it just forgets */}
}
function restore(){
  let raw;try{raw=localStorage.getItem(LS_KEY);}catch(e){return;}
  if(!raw)return;
  let d;try{d=JSON.parse(raw);}catch(e){return;}
  if(d.prefs)STATE.prefs=Object.assign(JSON.parse(JSON.stringify(DEFAULT_PREFS)),d.prefs);
  if(d.role)STATE.role=d.role;
  if(d.activeView)STATE.activeView=d.activeView;
  if(d.defaultView)STATE.defaultView=d.defaultView;
  if(d.ownerFilter)STATE.ownerFilter=d.ownerFilter;
  if(d.seen)STATE.seen=d.seen;
  if(Array.isArray(d.savedViews)&&d.savedViews.length)STATE.savedViews=d.savedViews;
  (d.attn||[]).forEach(s=>{
    const a=attnById(s.id);if(!a)return;
    a.owner=s.owner;a.ack=!!s.ack;a.instruction=s.instruction||'';a.done=!!s.done;
    a.due=s.due?new Date(s.due):null;
    a.ackAt=s.ackAt?new Date(s.ackAt):null;
    a.assignedAt=s.assignedAt?new Date(s.assignedAt):null;
    a.assignedBy=s.assignedBy||null;a.notified=s.notified||null;
    if(Array.isArray(s.audit)&&s.audit.length)a.audit=s.audit.map(x=>({t:x.t?new Date(x.t):null,k:x.k,s:x.s,d:x.d}));
  });
}
function resetDemo(){
  try{localStorage.removeItem(LS_KEY);}catch(e){}
  location.reload();
}
function audit(a,k,s,d){
  a.audit.push({t:new Date(),k:k,s:s,d:d||''});
  persist();
}

/* ------------------------------------------------------- preference scope */
function scopeZones(prefs){
  const p=prefs||STATE.prefs, out=[];
  HIERARCHY.kids[0].kids.forEach(pl=>{ if(p.scope.indexOf(pl.id)>-1) out.push.apply(out,pl.zones); });
  p.scope.forEach(s=>{ if(ZONES.some(z=>z.id===s)) out.push(s); });
  return uniq(out);
}
function scopeLabel(prefs){
  const p=prefs||STATE.prefs;
  const pl=HIERARCHY.kids[0].kids.filter(x=>p.scope.indexOf(x.id)>-1).map(x=>x.n.replace('Mittelplate ',''));
  const zn=p.scope.filter(s=>ZONES.some(z=>z.id===s)).map(s=>ZONES.find(z=>z.id===s).name);
  const all=pl.concat(zn);
  if(!all.length)return'No scope selected';
  if(all.length===3&&!zn.length)return'Mittelplate — all areas';
  return all.join(' and ');
}
const windowLabel=w=>w===HOURS_SINCE_LOGIN?'Since last login':w===24?'Last 24 hours':w===48?'Last 48 hours':w===168?'Last seven days':'Last '+w+' hours';

/* Which events a preference set would put in front of the user. Every rule is
   a real filter over the register — nothing here is decorative. */
function matching(prefs){
  const p=prefs||STATE.prefs;
  const zs=scopeZones(p), R=p.rules, minSev=SEV_RANK[p.thresholds.minSev]||1;
  const zoneCount={}; EVENTS.forEach(e=>{if(e.zone&&e.changedHrs<=p.window)zoneCount[e.zone]=(zoneCount[e.zone]||0)+1;});
  const seceCount={}; openEvents().forEach(e=>{seceCount[e.sece]=(seceCount[e.sece]||0)+1;});
  const cumIds=uniq(STRANDS.filter(s=>STATE.strandsOff.indexOf(s.id)<0).reduce((a,s)=>a.concat(s.ev),[]));
  const kindRule={ora:'ora',deferral:'defer',dlr:'dlr'};
  return EVENTS.filter(e=>{
    if(e.zone&&zs.indexOf(e.zone)<0)return false;                       /* operational scope */
    if(!e.zone&&p.monitor.indexOf('dq')<0)return false;                 /* unallocated are a data-quality item */
    if(p.systems.indexOf(e.system)<0)return false;                      /* source-system selection */
    if(p.monitor.indexOf(kindRule[e.kind])<0)return false;              /* what to monitor */
    if(SEV_RANK[e.sev]<minSev && !(R.indexOf('overdue')>-1&&(horizon(e)||{}).d<0))return false;
    /* attention rules — any selected rule that the event satisfies keeps it */
    const hits=[];
    if(R.indexOf('new')>-1     && e.changedHrs<=HOURS_SINCE_LOGIN)hits.push('new');
    if(R.indexOf('redonly')>-1 && e.sev==='high')hits.push('redonly');
    if(R.indexOf('redamber')>-1&& (e.sev==='high'||e.sev==='med'))hits.push('redamber');
    if(R.indexOf('imp')>-1     && barrierFor(e)&&barrierState(barrierFor(e).id).key==='impaired')hits.push('imp');
    if(R.indexOf('deg')>-1     && barrierFor(e)&&barrierState(barrierFor(e).id).key==='degraded')hits.push('deg');
    if(R.indexOf('overdue')>-1 && (horizon(e)||{d:99}).d<=-p.thresholds.overdue)hits.push('overdue');
    if(R.indexOf('expiring')>-1&& horizon(e)&&horizon(e).d>=0&&horizon(e).d<=p.thresholds.expiry)hits.push('expiring');
    if(R.indexOf('unack')>-1   && e.changedHrs<=p.window&&!STATE.seen[e.id])hits.push('unack');
    if(R.indexOf('repeat')>-1  && seceCount[e.sece]>1)hits.push('repeat');
    if(R.indexOf('multi')>-1   && e.zone&&zoneCount[e.zone]>=p.thresholds.hotspot)hits.push('multi');
    if(R.indexOf('common')>-1  && barrierFor(e)&&barrierEvents(barrierFor(e).id).length>1)hits.push('common');
    if(R.indexOf('cumcon')>-1  && cumIds.indexOf(e.id)>-1)hits.push('cumcon');
    if(R.indexOf('noowner')>-1 && attnForEvent(e.id)&&!attnForEvent(e.id).owner)hits.push('noowner');
    if(R.indexOf('awaiting')>-1&& attnForEvent(e.id)&&attnForEvent(e.id).owner&&!attnForEvent(e.id).ack)hits.push('awaiting');
    if(R.indexOf('nodate')>-1  && !horizon(e))hits.push('nodate');
    if(!R.length)return true;
    e._hits=hits;
    return hits.length>0;
  });
}
function barrierFor(e){return BARRIERS.find(b=>b.sece.indexOf(e.sece)>-1)||null;}
function attnForEvent(id){return ATTENTION.find(a=>a.events.indexOf(id)>-1)||null;}

/* ----------------------------------------------------- attention ranking */
/* Seven factors, weighted, recomputed on every render. Due date on its own is
   deliberately not one of them. */
const RANK_W=[
 {k:'exposure',n:'Combined exposure',w:22,s:'Severity of the contributing records, combined rather than added'},
 {k:'barrier', n:'Barrier condition', w:20,s:'Worst condition of the barriers these records act against'},
 {k:'interdep',n:'Interdependency',   w:16,s:'Whether this item converges with another through a named mechanism'},
 {k:'urgency', n:'Action urgency',    w:14,s:'Days past planned finish, or days to expiry'},
 {k:'escalate',n:'Potential escalation',w:12,s:'Whether an impaired mitigation barrier sits on its escalation path'},
 {k:'recency', n:'Recency',           w:10,s:'How recently the contributing records moved'},
 {k:'confid',  n:'Evidence confidence',w:6,s:'Placement tier and whether a matching record is held'}
];
/* A 0-100 exposure scale, deliberately leaving headroom above the worst single
   item so that coupling can be seen to move the combined figure. The numbers are
   a Clarity scale, printed wherever they are used so they can be argued with. */
const SEV_EXPO={high:76,med:44,low:18};
function rankFactors(a){
  const ev=attnEvents(a), open=ev.filter(e=>e.open);
  /* exposure: quadratic mean so two mediums do not read as one high */
  const ex=open.map(e=>SEV_EXPO[e.sev]);
  const rms=ex.length?Math.sqrt(ex.reduce((s,v)=>s+v*v,0)/ex.length):0;
  const exposure=ex.length?clamp(rms*(1+Math.min(0.35,(ex.length-1)*0.09)),0,100):0;
  /* barrier condition */
  const conds=uniq(ev.map(e=>(barrierFor(e)||{}).id).filter(Boolean)).map(id=>barrierState(id));
  const worst=conds.reduce((m,c)=>Math.max(m,c.rank),0);
  const barrier=[0,0,30,65,100][worst]||0;
  /* interdependency */
  const inCum=CUM_PAIR.indexOf(a.id)>-1;
  const strandHits=STRANDS.filter(s=>STATE.strandsOff.indexOf(s.id)<0&&s.ev.some(id=>a.events.indexOf(id)>-1));
  const interdep=inCum?clamp(35+strandHits.length*16,0,100):0;
  /* urgency */
  const hs=open.map(horizon).filter(Boolean);
  const worstD=hs.length?Math.min.apply(null,hs.map(h=>h.d)):null;
  const urgency=worstD==null?20:worstD<0?clamp(70+Math.abs(worstD)*1.2,0,100):clamp(100-worstD*4,0,100);
  /* escalation */
  const mitIds=BARRIERS.filter(b=>b.side==='mitigate').map(b=>b.id);
  const touchMit=uniq(ev.map(e=>(barrierFor(e)||{}).id)).filter(id=>mitIds.indexOf(id)>-1);
  const escalate=touchMit.length?clamp(40+touchMit.filter(id=>barrierState(id).key==='impaired').length*30+touchMit.length*10,0,100):15;
  /* recency */
  const minH=open.length?Math.min.apply(null,open.map(e=>e.changedHrs)):168;
  const recency=clamp(100-(minH/168)*100,0,100);
  /* evidence confidence */
  const confid=ev.length?Math.round(ev.reduce((s,e)=>s+(TIERS[e.tier].conf*0.7+(e.held?0.3:0.05)),0)/ev.length*100):0;
  const f={exposure,barrier,interdep,urgency,escalate,recency,confid};
  const score=RANK_W.reduce((s,x)=>s+f[x.k]*x.w,0)/100;
  return{f:f,score:score};
}
function rankedAttention(){
  const list=ATTENTION.filter(a=>!a.done).map(a=>{const r=rankFactors(a);a._f=r.f;a._score=r.score;return a;});
  /* §15 — role changes the question being asked, never the facts. Each role
     sorts on the thing that role has to decide, then falls back to the same
     attention score. The records and their scores are identical in every role. */
  const barsOf=a=>uniq(attnEvents(a).map(e=>(barrierFor(e)||{}).id).filter(Boolean));
  const worstDA=a=>{const b=barsOf(a);return b.length?Math.max.apply(null,b.map(id=>DA_ORDER[dualAssurance(id).key])):0;};
  const convHit=a=>{const g=convergence();return g.some(x=>x.zone===a.zone)?1:0;};
  const overdue=a=>attnEvents(a).filter(e=>{const h=horizon(e);return h&&h.d<0;}).length;
  list.sort((x,y)=>{
    if(STATE.role==='ops'){          /* what has to be decided on shift */
      const ox=overdue(x),oy=overdue(y);
      if(oy!==ox)return oy-ox;
    }
    if(STATE.role==='safety'){       /* dual assurance, then barrier condition */
      const dx=worstDA(x),dy=worstDA(y);
      if(dy!==dx)return dy-dx;
      const bx=Math.max.apply(null,[0].concat(attnEvents(x).map(e=>(barrierFor(e)?barrierState(barrierFor(e).id).rank:0))));
      const by=Math.max.apply(null,[0].concat(attnEvents(y).map(e=>(barrierFor(e)?barrierState(barrierFor(e).id).rank:0))));
      if(by!==bx)return by-bx;
    }
    if(STATE.role==='exec'){         /* convergence, then accountability */
      const cx=convHit(x),cy=convHit(y);
      if(cy!==cx)return cy-cx;
      const ox=(x.owner?0:1)+(x.owner&&!x.ack?0.5:0), oy=(y.owner?0:1)+(y.owner&&!y.ack?0.5:0);
      if(oy!==ox)return oy-ox;
    }
    return y._score-x._score;
  });
  list.forEach((a,i)=>{a._rank=i+1;});
  return list;
}
function attnScopeOk(a){
  return attnEvents(a).some(e=>!e.zone||scopeZones().indexOf(e.zone)>-1);
}

/* ------------------------------------------------------- change feed */
function changed(win){
  const w=win||STATE.prefs.window, zs=scopeZones();
  return EVENTS.filter(e=>e.changedHrs<=w&&(!e.zone||zs.indexOf(e.zone)>-1))
               .sort((a,b)=>a.changedHrs-b.changedHrs);
}
function raisedIn(win){return changed(win).filter(e=>e.closedAt==null);}
function hotspots(win){
  const w=win||STATE.prefs.window, by={};
  changed(w).forEach(e=>{if(e.zone)(by[e.zone]=by[e.zone]||[]).push(e);});
  return Object.keys(by).map(z=>({zone:z,events:by[z]}))
    .filter(h=>h.events.length>=STATE.prefs.thresholds.hotspot)
    .sort((a,b)=>b.events.length-a.events.length);
}
/* barrier condition as it stood before the current window opened */
function barrierStateBefore(id,win){
  const w=win||STATE.prefs.window;
  return barrierState(id,EVENTS.filter(e=>e.open&&e.raised>w));
}
function overdueEvents(){
  return openEvents().filter(e=>{const h=horizon(e);return h&&h.d<=-STATE.prefs.thresholds.overdue;});
}
function expiringEvents(){
  return openEvents().filter(e=>{const h=horizon(e);return h&&h.d>=0&&h.d<=STATE.prefs.thresholds.expiry;});
}
function noHorizonEvents(){return openEvents().filter(e=>!horizon(e));}

/* the Clarity-generated opening summary — generated, so it always reconciles */
function summarySentence(){
  const w=STATE.prefs.window;
  const ch=changed(w), raised=ch.filter(e=>e.closedAt==null), closed=ch.filter(e=>e.closedAt!=null);
  const sys=uniq(raised.map(e=>e.system)).length;
  const hs=hotspots(w);
  const top=hs[0];
  const already=raised.filter(e=>{
    const b=barrierFor(e); if(!b)return false;
    const k=barrierStateBefore(b.id,w).key;
    return k==='impaired'||k==='degraded';
  });
  if(!raised.length&&!closed.length)
    return 'Nothing has changed on the asset inside <strong>'+esc(windowLabel(w).toLowerCase())+'</strong> within your current scope.';
  let s='<strong>'+cap(numw(raised.length))+'</strong> event'+(raised.length===1?' has':'s have')+
        ' been raised across <strong>'+numw(sys)+'</strong> source system'+(sys===1?'':'s')+
        ' in '+esc(windowLabel(w).toLowerCase().replace('last ','the last ').replace('since last login','the '+HOURS_SINCE_LOGIN+' hours since you last signed in'))+
        (closed.length?', and '+numw(closed.length)+' record'+(closed.length===1?' has':'s have')+' closed':'')+'. ';
  s+='Individually none is assessed as critical, but ';
  if(top)s+='<strong>'+numw(top.events.length)+'</strong> of them land on '+esc(zoneName(top.zone))+', and ';
  s+='<strong>'+numw(already.length)+'</strong> act against barriers that were already degraded or impaired before this window opened.';
  return s;
}
/* zoneById is defined with the areas in the data layer. */
const zoneName=id=>{const z=zoneById(id);return z?z.name:'an unallocated location';};
const zonePlatform=id=>{const z=zoneById(id);if(!z)return'';return z.plat==='topsides'?'Topsides':z.plat==='support'?'Process deck':'Mittelplate';};

/* ------------------------------------------------------- cumulative risk */
function cumulative(){
  const items=CUM_PAIR.map(attnById);
  const ind=items.map(a=>{
    const ex=attnEvents(a).filter(e=>e.open).map(e=>SEV_EXPO[e.sev]);
    const rms=ex.length?Math.sqrt(ex.reduce((s,v)=>s+v*v,0)/ex.length):0;
    return{a:a,v:Math.round(clamp(rms*(1+Math.min(0.35,(ex.length-1)*0.09)),0,100))};
  });
  const on=STRANDS.filter(s=>STATE.strandsOff.indexOf(s.id)<0);
  const wsum=on.reduce((s,x)=>s+x.w,0);
  const base=Math.sqrt(ind.reduce((s,x)=>s+x.v*x.v,0)/ind.length);
  const uplift=1+(wsum/100)*0.32;                     /* full coupling adds 32% */
  const comb=Math.round(clamp(base*uplift,0,100));
  const avg=Math.round(ind.reduce((s,x)=>s+x.v,0)/ind.length);
  return{ind:ind,on:on,wsum:wsum,base:Math.round(base),uplift:uplift,comb:comb,avg:avg,
         amp:avg?+(comb/avg).toFixed(2):1,
         ownerGap:items.some(a=>!a.owner),owners:uniq(items.map(a=>a.owner).filter(Boolean))};
}

/* --------------------------------------------------- ownership operations */
function takeOwnership(id){
  const a=attnById(id);if(!a)return;
  const was=a.owner;
  a.owner=ME;a.ack=true;a.ackAt=new Date();a.assignedAt=new Date();a.assignedBy=ME;a.notified=null;
  audit(a,'owner','Owner assigned — '+PEOPLE[ME].name,was?'Reassigned from '+person(was).name+' · taken by '+PEOPLE[ME].name:'Taken by '+PEOPLE[ME].name);
  audit(a,'ack','Assignment acknowledged','Acknowledged on assignment, because '+PEOPLE[ME].name+' took it directly');
  STATE.ownMode=null;
  render();
  toast('You are now responsible for this item.'+(a.due?' Response required '+dueLabel(a.due).toLowerCase()+'.':''));
}
function assignColleague(id,who,instruction,dueISO){
  const a=attnById(id),p=person(who);if(!a||!p)return;
  const was=a.owner;
  a.owner=who;a.ack=false;a.ackAt=null;a.assignedAt=new Date();a.assignedBy=ME;
  a.instruction=instruction||a.instruction;
  if(dueISO)a.due=new Date(dueISO);
  a.notified='prepared';
  audit(a,'owner',(was?'Owner reassigned — ':'Owner assigned — ')+p.name,
    (was?'From '+person(was).name+'. ':'')+'Assigned by '+PEOPLE[ME].name+(a.due?' · due '+dueLabel(a.due).toLowerCase():''));
  if(a.instruction)audit(a,'instr','Instruction added',a.instruction);
  audit(a,'notif','Notification prepared','Demonstration only — no message is sent from this page');
  STATE.ownMode=null;STATE.ownPick=null;
  render();
  toast('Assigned to '+p.name+(a.due?' · due '+dueLabel(a.due).toLowerCase():''));
}
function removeOwner(id){
  const a=attnById(id);if(!a||!a.owner)return;
  const was=person(a.owner).name;
  a.owner=null;a.ack=false;a.ackAt=null;a.assignedAt=null;a.notified=null;
  audit(a,'owner','Owner removed','Previously '+was+'. The item is unassigned and will surface under “Items without an attention owner”.');
  render();toast('Owner removed — this item is now unassigned');
}
function markAck(id){
  const a=attnById(id);if(!a||!a.owner)return;
  a.ack=true;a.ackAt=new Date();
  audit(a,'ack','Assignment acknowledged',person(a.owner).name+' acknowledged the assignment');
  render();toast('Acknowledged by '+person(a.owner).name);
}
function setDue(id,val){
  const a=attnById(id);if(!a)return;
  const was=a.due;
  a.due=val?new Date(val):null;
  audit(a,'due','Due date changed',(was?'From '+stamp(was)+' ':'')+'to '+(a.due?stamp(a.due):'no date set'));
  render();toast('Response date updated');
}
function addInstruction(id,txt){
  const a=attnById(id);if(!a||!txt)return;
  a.instruction=txt;
  audit(a,'instr','Instruction added',txt);
  render();toast('Instruction added for '+(a.owner?person(a.owner).name:'the owner'));
}
function completeItem(id){
  const a=attnById(id);if(!a)return;
  a.done=true;
  audit(a,'done','Item completed and closed','Closed by '+PEOPLE[ME].name);
  render();toast('Item closed — it stays in the queue under “Completed”');
}
function reopenItem(id){
  const a=attnById(id);if(!a)return;
  a.done=false;audit(a,'open','Item reopened','Reopened by '+PEOPLE[ME].name);render();toast('Item reopened');
}
function markViewed(a){
  if(a.audit.some(x=>x.k==='viewed'))return;
  a.audit.push({t:new Date(),k:'viewed',s:'Item viewed',d:'Opened by '+PEOPLE[ME].name});persist();
}

/* ownership filters */
function ownerFilterPass(a,f){
  f=f||STATE.ownerFilter;
  switch(f){
    case'mine':    return a.owner===ME&&!a.done;
    case'byme':    return a.assignedBy===ME&&a.owner&&a.owner!==ME&&!a.done;
    case'unass':   return !a.owner&&!a.done;
    case'team':    return !!a.owner&&!a.done;
    case'odassign':return !!a.owner&&a.due&&a.due<NOW&&!a.done;
    case'today':   return a.due&&dayLabel(a.due)==='Today'&&!a.done;
    case'ackd':    return a.ack&&!a.done;
    case'awaiting':return !!a.owner&&!a.ack&&!a.done;
    case'done':    return !!a.done;
    default:       return true;
  }
}
function ownerFilterCount(f){return ATTENTION.filter(a=>ownerFilterPass(a,f)).length;}

/* --------------------------------------------------------------- toast/modal */
function toast(msg){const t=$("#toast");t.innerHTML=icon('check',16)+esc(msg);t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3200);}
function openModal(html,cls){const m=$("#modal");m.className='modal'+(cls?' '+cls:'');m.innerHTML=html;
  $("#modalBack").classList.add('show');m.scrollTop=0;}
function closeModal(){$("#modalBack").classList.remove('show');}
function mhead(kick,title){return `<div class="modal-head"><div><div style="font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-2);font-weight:800;margin-bottom:6px">${esc(kick)}</div><h3>${esc(title)}</h3></div><button class="modal-close" onclick="closeModal()" aria-label="Close">${icon('x',15)}</button></div>`;}
const msec=(h,b)=>`<div class="msec"><div class="mh">${esc(h)}</div>${b}</div>`;
</script>
<script>
"use strict";
/* ============================================================================
   THE EVIDENCE MODEL — structured around the principles of IOGP 456 and
   API RP 754.

   Clarity is not certified, approved or formally compliant with either
   standard, and says so wherever the framework is named. What the standards
   provide here is the ARCHITECTURE:

     Major Accident Hazard
       -> Critical Barrier
         -> Performance Standard
           -> Tier 3  barrier performance   (is the barrier weakening?)
           -> Tier 4  assurance performance (are we doing what keeps it healthy?)
             -> Dual Assurance              (read together, what does that mean?)
               -> Related operational conditions
                 -> Evidence convergence
                   -> Management attention

   Tier 1 and Tier 2 exist in the hierarchy so the chain is complete, but this
   is an operational view: they are reported, not worked here.
   ========================================================================== */

const STANDARDS_NOTE='Process safety assurance structured around IOGP 456 / API RP 754 principles';

/* ---------------------------------------------------- major accident hazards */
const MAHS=[
 {id:'loc',   n:'Loss of containment — hydrocarbon release',short:'Hydrocarbon release',
  bars:['relief','vessels','contain','instr','detect','ignite','eer','power']},
 {id:'fire',  n:'Fire and explosion',short:'Fire & explosion',
  bars:['detect','ignite','eer','power','contain']},
 {id:'struct',n:'Structural failure or dropped object',short:'Structural / dropped object',
  bars:['struct','lifting','contain']},
 {id:'eer',   n:'Impaired escape, evacuation and rescue',short:'Escape & evacuation',
  bars:['eer','power','detect']}
];
const mahById=id=>MAHS.find(m=>m.id===id)||null;
const mahsForBarrier=b=>MAHS.filter(m=>m.bars.indexOf(b)>-1);

/* ------------------------------------------------- performance standards */
/* One named performance standard per critical barrier. the operator's own
   performance-standard register was not supplied, so these are Clarity
   working titles and are labelled as such on the Dual Assurance page. */
const PERF_STD={
 relief :'Relief and overpressure protection available on demand',
 vessels:'Pressure systems fit for continued service',
 contain:'Primary containment integrity maintained',
 struct :'Structural and lifting integrity maintained',
 lifting:'Lifting operations controlled and equipment certified',
 instr  :'Process instrumentation accurate and in service',
 detect :'Detection and alarm availability',
 ignite :'Ignition sources controlled in hazardous areas',
 eer    :'Protection, escape and evacuation available on demand',
 power  :'Essential and emergency power available on demand'
};

/* =================================================== TIER 3 — BARRIER PERFORMANCE
   Derived from the register. Tier 3 asks: is the barrier showing weakness?
   Counts are computed from the open records, so this cannot drift from data. */
function tier3(barId,scope){
  const ev=barrierEvents(barId,scope);
  const impaired = ev.filter(e=>e.sev==='high'&&!e.compensated).length;
  const degraded = ev.filter(e=>e.sev==='high'&&e.compensated||e.sev==='med').length;
  const watch    = ev.filter(e=>e.sev==='low').length;
  const overdue  = ev.filter(e=>{const h=horizon(e);return h&&h.d<0;}).length;
  const noEnd    = ev.filter(e=>!horizon(e)).length;
  /* A genuine challenge to a protective system — a shutdown, relief or
     detection function called on in anger — is Tier 3 evidence in its own
     right, separately from a deteriorating condition. */
  const challenge= ev.filter(e=>/activat|demand|relief|trip|shutdown|called on|excursion|bypass/i
                    .test(e.title+' '+e.status)).length;
  /* prior state = the same computation with records raised inside the window
     removed, so "deteriorating" means something changed, not that it is bad */
  const w=STATE&&STATE.prefs?STATE.prefs.window:48;
  const before=ev.filter(e=>e.raised>w);
  const scoreOf=l=>l.filter(e=>e.sev==='high'&&!e.compensated).length*3
                  +l.filter(e=>(e.sev==='high'&&e.compensated)||e.sev==='med').length*2
                  +l.filter(e=>e.sev==='low').length;
  const now=scoreOf(ev), was=scoreOf(before);
  const key = impaired? 'weakening' : degraded? (now>was?'weakening':'stable') : ev.length? 'stable':'healthy';
  const trend = now>was?'down' : now<was?'up' : 'flat';
  const lines=[];
  if(impaired)lines.push(impaired+' impaired — no compensating measure recorded');
  if(degraded)lines.push(degraded+' degraded or under a compensating measure');
  if(watch)   lines.push(watch+' low-severity record'+(watch===1?'':'s')+' open');
  if(overdue) lines.push(overdue+' past its planned finish');
  if(noEnd)   lines.push(noEnd+' with no end date held anywhere');
  if(challenge)lines.push(challenge+' genuine challenge'+(challenge===1?'':'s')+
                          ' to a protective system recorded');
  if(!lines.length)lines.push('Nothing open against this barrier');
  return{tier:3,key:key,trend:trend,n:ev.length,events:ev,lines:lines,challenge:challenge,
         now:now,was:was,impaired:impaired,degraded:degraded,overdue:overdue,
         q:'Is the barrier failing, or moving towards failing, its performance standard?',
         src:'ORA, deferral and anomaly registers'};
}

/* =================================================== TIER 4 — ASSURANCE PERFORMANCE
   Tier 4 asks: are we completing the activities intended to keep the barrier
   healthy? NO ASSURANCE-COMPLETION FEED WAS SUPPLIED WITH THE
   MATERIAL. These figures are illustrative and are marked as a gap wherever
   they are read — see PROV.tier4. The structure is the point; the numbers
   are what Maximo, SAP and a competency system would supply. */
const TIER4=[
 {bar:'relief', plan:92,insp:1,act:0,comp:98,trend:'flat'},
 {bar:'vessels',plan:88,insp:2,act:1,comp:97,trend:'down'},
 {bar:'contain',plan:94,insp:0,act:1,comp:99,trend:'up'},
 {bar:'struct', plan:96,insp:0,act:0,comp:98,trend:'flat'},
 {bar:'lifting',plan:91,insp:1,act:1,comp:95,trend:'flat'},
 {bar:'instr',  plan:86,insp:3,act:2,comp:94,trend:'down'},
 {bar:'detect', plan:89,insp:3,act:2,comp:96,trend:'down'},
 {bar:'ignite', plan:95,insp:0,act:0,comp:97,trend:'flat'},
 {bar:'eer',    plan:90,insp:2,act:1,comp:96,trend:'down'},
 {bar:'power',  plan:93,insp:1,act:1,comp:98,trend:'flat'}
];
const TIER4_TARGET=95;   /* IOGP 456 puts Tier 4 targets at conformance, not a curve */
function tier4(barId){
  const t=TIER4.find(x=>x.bar===barId)||{plan:0,insp:0,act:0,comp:0,trend:'flat'};
  const gap=TIER4_TARGET-t.plan;
  const key = (t.plan<TIER4_TARGET-4||t.act>1) ? 'weakening'
            : (t.plan<TIER4_TARGET||t.insp>0)  ? 'stable' : 'healthy';
  const lines=[
    t.plan+'% planned functional testing complete'+(gap>0?' — target '+TIER4_TARGET+'%':''),
    t.insp+' inspection'+(t.insp===1?'':'s')+' overdue',
    t.act+' assurance action'+(t.act===1?'':'s')+' overdue',
    t.comp+'% competency assurance complete'
  ];
  return{tier:4,key:key,trend:t.trend,plan:t.plan,insp:t.insp,act:t.act,comp:t.comp,
         target:TIER4_TARGET,gap:gap,lines:lines,
         q:'Are we completing the activities intended to keep the barrier healthy?',
         src:'Maximo · SAP · competency system',
         held:false};
}

/* ======================================================= DUAL ASSURANCE
   The pairing IOGP 456 Part G calls dual assurance: one leading measure and
   one lagging measure per barrier, read together. Clarity does NOT compute a
   risk number here — it states what the two readings mean together. */
const DA_STATES={
 attention :{w:'ATTENTION REQUIRED',c:'red',
   s:'Barrier weakness is increasing while the assurance activity intended to maintain the barrier is also falling behind plan.'},
 effective :{w:'REVIEW EFFECTIVENESS',c:'amber',
   s:'Assurance activity remains within target, however barrier performance continues to deteriorate. Review whether the current assurance regime is sufficiently effective.'},
 assurance :{w:'ASSURANCE ATTENTION',c:'amber',
   s:'Barrier performance is holding, but the assurance activity intended to maintain it is falling behind plan. The barrier is being sustained on margin rather than on process.'},
 monitor   :{w:'MONITOR',c:'watch',
   s:'Both readings are within tolerance. Nothing here requires action beyond the existing routine.'},
 normal    :{w:'NORMAL',c:'green',
   s:'No barrier weakness recorded and assurance activity is on plan.'}
};
function dualAssurance(barId,scope){
  const t3=tier3(barId,scope), t4=tier4(barId);
  const w3=t3.key==='weakening', w4=t4.key==='weakening';
  let k;
  if(w3&&w4)                                   k='attention';
  else if(w3&&!w4)                             k='effective';
  else if(!w3&&w4)                             k='assurance';
  else if(t3.key==='healthy'&&t4.key==='healthy') k='normal';
  else                                         k='monitor';
  return Object.assign({key:k,t3:t3,t4:t4,bar:barrierById(barId)},DA_STATES[k]);
}
const DA_ORDER={attention:4,effective:3,assurance:2,monitor:1,normal:0};
function dualAll(scope){
  return BARRIERS.map(b=>dualAssurance(b.id,scope))
                 .sort((x,y)=>DA_ORDER[y.key]-DA_ORDER[x.key]);
}

/* ============================================= EVIDENCE CONVERGENCE
   This replaces the cumulative-risk score. Clarity does not calculate
   cumulative risk. It reports where independently managed conditions are
   landing on the same place, the same barrier or the same hazard at the
   same time — and leaves the judgement to the person reading it. */
function convergence(scope){
  const ev=(scope||openEvents()).filter(e=>e.open&&e.zone);
  const byZone={};
  ev.forEach(e=>{(byZone[e.zone]=byZone[e.zone]||[]).push(e);});
  const groups=Object.keys(byZone).map(z=>{
    const list=byZone[z];
    const bars=uniq(list.map(e=>{const b=barrierFor(e);return b?b.id:null;}).filter(Boolean));
    const mahs=uniq(bars.reduce((a,b)=>a.concat(mahsForBarrier(b).map(m=>m.id)),[]));
    const das=bars.map(b=>dualAssurance(b,scope));
    const t3w=das.filter(d=>d.t3.key==='weakening').length;
    const t4w=das.filter(d=>d.t4.key==='weakening').length;
    const oras=list.filter(e=>e.kind==='ora').length;
    const dlrs=list.filter(e=>e.kind==='dlr').length;
    const defs=list.filter(e=>e.kind==='deferral').length;
    const sys =uniq(list.map(e=>e.system)).length;
    /* a group only counts as converging where more than one INDEPENDENT
       process is involved — otherwise it is one issue with several rows */
    const kinds=uniq(list.map(e=>e.kind)).length;
    const converging = list.length>=3 && kinds>=2 && bars.length>=2;
    return{zone:z,name:zoneName(z),list:list,n:list.length,bars:bars,mahs:mahs,das:das,
           t3w:t3w,t4w:t4w,oras:oras,dlrs:dlrs,defs:defs,sys:sys,kinds:kinds,
           converging:converging};
  }).filter(g=>g.converging)
    .sort((a,b)=>(b.t3w+b.t4w)-(a.t3w+a.t4w)||b.n-a.n);
  return groups;
}
function topConvergence(scope){const g=convergence(scope);return g.length?g[0]:null;}

/* The lines Clarity shows for a convergence group — each one a real count. */
function convergenceLines(g){
  const out=[];
  g.das.filter(d=>d.t3.key==='weakening').forEach(d=>
    out.push({tag:'TIER 3',t:d.bar.short+' — barrier weakening',k:'red'}));
  g.das.filter(d=>d.t4.key==='weakening').forEach(d=>
    out.push({tag:'TIER 4',t:d.bar.short+' — assurance behind plan',k:'amber'}));
  if(g.oras)out.push({tag:'ORA',t:g.oras+' active operational risk assessment'+(g.oras===1?'':'s'),k:'amber'});
  if(g.dlrs)out.push({tag:'DLR',t:g.dlrs+' temporary or defined-life repair'+(g.dlrs===1?'':'s')+' in place',k:'amber'});
  if(g.defs)out.push({tag:'SECE',t:g.defs+' maintenance deferral'+(g.defs===1?'':'s')+' open',k:'amber'});
  return out;
}
</script>

  {id:"PS-IC",n:"Internal Communications",b:"Emergency Response & Recovery",dep:{"PS-EP":"H","PS-FG":"M","PS-TR":"M"}},
  {id:"PS-IL",n:"Installation Location Systems",b:"Safeguarding Systems",dep:{"PS-EP":"H","PS-HD":"L","PS-RV":"H"}},
  {id:"PS-IP",n:"Ignition Prevention - Mechanical",b:"Ignition Control",dep:{"PS-AF":"H","PS-FG":"H","PS-HC":"H","PS-HV":"L","PS-PF":"M","PS-RE":"H","PS-SD":"H"}},

  {id:"PS-LE",n:"Crane & Lifting Equipment",b:"Structural & Marine Systems",dep:{"PS-AF":"L","PS-EC":"L","PS-HD":"L","PS-IC":"L","PS-SI":"M"}},
  {id:"PS-OD",n:"Open Hazardous Drains",b:"Process Containment",dep:{"PS-AF":"M","PS-FG":"M","PS-HA":"M","PS-HC":"M","PS-HD":"M","PS-IP":"M","PS-RE":"M"}},
  {id:"PS-PF",n:"Fire & Explosion Protection",b:"Structural & Marine Systems",dep:{"PS-AF":"H","PS-HC":"H","PS-OD":"H","PS-RE":"H","PS-WI":"H"}},
  {id:"PS-PR",n:"Pressure Relief Systems",b:"Process Containment",dep:{"PS-HA":"M","PS-HC":"L","PS-IP":"M","PS-SD":"H"}},
  {id:"PS-PS",n:"Pipeline Systems",b:"Process Containment",dep:{"PS-AF":"M","PS-EC":"M","PS-FG":"M","PS-HA":"H","PS-HC":"M","PS-LE":"M","PS-PF":"M","PS-PR":"H","PS-SD":"H","PS-SI":"M"}},
  {id:"PS-RE",n:"Hydrocarbon Containment (Rotating)",b:"Process Containment",dep:{"PS-AF":"M","PS-FG":"M","PS-HA":"H","PS-HC":"H","PS-IP":"H","PS-LE":"M","PS-OD":"L","PS-PF":"M","PS-PR":"H","PS-SD":"H","PS-SI":"M"}},
  {id:"PS-RV",n:"Emergency Response & Rescue Vessel (ERRV)",b:"Emergency Response & Recovery",dep:{"PS-EC":"H","PS-IL":"H"}},
  {id:"PS-SD",n:"Shutdown Systems",b:"Safeguarding Systems",dep:{"PS-EC":"H","PS-EP":"H","PS-FG":"H","PS-HC":"H","PS-HD":"L","PS-IC":"L","PS-PS":"H","PS-RE":"H"}},
  {id:"PS-SI",n:"Structural Integrity",b:"Structural & Marine Systems",dep:{"PS-AF":"M","PS-DL":"M","PS-HD":"L","PS-LE":"M","PS-PF":"M"}},
  {id:"PS-TR",n:"Temporary Refuge",b:"Emergency Response & Recovery",dep:{"PS-AF":"H","PS-EC":"H","PS-EM":"H","PS-EP":"H","PS-ER":"M","PS-ES":"M","PS-ET":"M","PS-FG":"H","PS-HD":"M","PS-HV":"H","PS-IC":"H","PS-LB":"M","PS-PF":"H","PS-SD":"H","PS-SI":"H"}},
  {id:"PS-WI",n:"Well Integrity",b:"Process Containment",dep:{"PS-AF":"M","PS-FG":"M","PS-HA":"H","PS-IP":"H","PS-LE":"M","PS-PF":"M","PS-SD":"H","PS-SI":"M"}},
];
/* Definitions quoted from the workbook's Definitions sheet. */
const DEP_DEF={
 T:{w:'Total',  rank:4,c:'red',
    s:'Total dependency on another SECE such that the dependent SECE will not operate when required if the other is impaired or fails during normal or emergency conditions.'},
 H:{w:'High',   rank:3,c:'red',
    s:'High dependency — SECE operation may be impaired to the extent that there is a significant reduction in functionality and/or availability/survivability, or cannot be relied upon to operate on demand.'},
 M:{w:'Medium', rank:2,c:'amber',
    s:'Medium dependency — SECE operation may be impaired to the extent that there is a small but noticeable reduction in functionality and/or availability/survivability.'},
 L:{w:'Low',    rank:1,c:'watch',
    s:'Low dependency — SECE operation may be slightly degraded but can still function. The impact may be localised or of a short duration.'},
 N:{w:'None',   rank:0,c:'green',
    s:'No dependency — the SECE operates independently from other SECEs, meeting all requirements of FARS.'}
};
/* Also in the workbook, and explicitly marked "not currently used" there.
   Modelled so the attribute exists; never used to compute anything. */
const SECE_IMPORTANCE_SCALE={
  E:'Essential — failure of this SECE alone would substantially increase the risk of the major accident.',
  H:'High — major role in managing the hazard; other SECEs can only partially fulfil the function.',
  M:'Medium — significant role; other SECEs can largely fulfil the function.',
  L:'Low — minor role, or other SECEs can effectively fulfil the function.'
};
const SECE_IMPORTANCE_HELD=false;   /* not populated in the supplied workbook */

const seceById=id=>SECE_DEP.find(s=>s.id===id)||null;
const seceName=id=>{const s=seceById(id);return s?s.n:id;};

/* What this SECE relies on (read across its own row). */
function supportsOf(id){
  const s=seceById(id); if(!s)return[];
  return Object.keys(s.dep).map(k=>({id:k,n:seceName(k),d:s.dep[k]}))
    .sort((a,b)=>DEP_DEF[b.d].rank-DEP_DEF[a.d].rank);
}
/* What relies on this SECE (read down its column) — the operationally
   interesting direction when something degrades. */
function dependentsOf(id){
  return SECE_DEP.filter(s=>s.dep[id]).map(s=>({id:s.id,n:s.n,b:s.b,d:s.dep[id]}))
    .sort((a,b)=>DEP_DEF[b.d].rank-DEP_DEF[a.d].rank);
}

/* ---------------------------------------------------------------------------
   The bridge between the operator's SECE register and the hub's ten working
   barriers. This mapping is CLARITY'S, not the operator's, and is labelled as such
   wherever a dependency is shown. The dependency values themselves are
   the operator's; only the grouping into these ten barriers is ours.
   ------------------------------------------------------------------------- */
const BARRIER_SECE={
  relief :['PS-PR'],
  vessels:['PS-HC'],
  contain:['PS-HC','PS-RE','PS-PS','PS-OD'],
  struct :['PS-SI','PS-PF'],
  lifting:['PS-LE','PS-DL'],
  instr  :['PS-PP','PS-IL'],
  detect :['PS-FG'],
  ignite :['PS-IP','PS-HA','PS-HV'],
  eer    :['PS-TR','PS-ER','PS-ES','PS-AF','PS-EM','PS-LB'],
  power  :['PS-EP','PS-IC','PS-EC']
};
const seceOfBarrier=b=>(BARRIER_SECE[b]||[]).filter(seceById);
const barrierOfSece=id=>Object.keys(BARRIER_SECE).find(b=>BARRIER_SECE[b].indexOf(id)>-1)||null;

/* =================================================== DEPENDENCY IMPACT
   §6 and §8. Not "Emergency Power has four dependencies" but "what is
   happening to the things that depend on it?" A dependent only becomes
   interesting when it is ALSO carrying a weakness of its own. */
function dependencyImpact(barId,scope){
  const own=seceOfBarrier(barId);
  const seen={};
  own.forEach(sid=>dependentsOf(sid).forEach(d=>{
    if(own.indexOf(d.id)>-1)return;                       /* same barrier */
    const prev=seen[d.id];
    if(!prev||DEP_DEF[d.d].rank>DEP_DEF[prev.d].rank)seen[d.id]=Object.assign({via:sid},d);
  }));
  const out=Object.keys(seen).map(k=>{
    const d=seen[k], bar=barrierOfSece(k), da=bar?dualAssurance(bar,scope):null;
    return Object.assign({},d,{bar:bar,da:da,
      alreadyWeak: !!(da&&(da.t3.key==='weakening'||da.t4.key==='weakening'))});
  });
  return out.sort((a,b)=>(b.alreadyWeak-a.alreadyWeak)||(DEP_DEF[b.d].rank-DEP_DEF[a.d].rank));
}
/* The sentence §8 asks for — only produced when a real compounding exists. */
function dependencyConcern(barId,scope){
  const imp=dependencyImpact(barId,scope).filter(x=>x.alreadyWeak&&DEP_DEF[x.d].rank>=2);
  if(!imp.length)return null;
  const me=barrierById(barId), t=imp[0];
  const bits=[];
  if(t.da.t3.key==='weakening')bits.push('an active impairment');
  if(t.da.t4.key==='weakening')bits.push(t.da.t4.act+' overdue assurance activit'+(t.da.t4.act===1?'y':'ies'));
  return{sece:t, text:me.name+' degradation may affect '+t.n+' availability. '+
    t.n+' already has '+(bits.join(' and ')||'a recorded weakness')+'.',
    n:imp.length, list:imp};
}

<script>
"use strict";
/* ============================================================================
   CONNECTED OPERATIONAL CONSEQUENCES

   The change Mike asked for. Clarity no longer holds separate safety,
   production and environmental pictures. It holds ONE underlying condition
   and records what that condition means in each domain it reaches.

       condition  ->  consequence (Safety)
                  ->  consequence (Production & Reliability)
                  ->  consequence (Environment / ESG)

   The issue is represented once. A role does not get its own copy — it gets
   its own angle on the same record. That is what makes the tram-lines
   honest: they are not drawn between three dashboards, they are drawn out of
   one object.

   All content here is illustrative demonstration data.

const DOMAINS=[

   consequences — escalation, possibly shutdown. Borrowing those colours to
   mean "someone should look at this" is misleading, whatever the caption

const ATT_STATE={
 act  :{w:'Action required', c:'act',   rank:5, hex:'#e0a33c'},
 assur:{w:'Assurance issue', c:'assur', rank:4, hex:'#a58ce0'},
 att  :{w:'Attention',       c:'att',   rank:3, hex:'#35c8f3'},

const STATUS_CAPTION='Operational status — not formal risk classification.';

/* ---------------------------------------------------------------- CONDITIONS
   Each is one physical/operational condition. `ev` are the underlying source

const CONDITIONS=[
 {id:'C1',n:'Produced-water pump seal degradation',zone:'process',
  root:'Progressive seal wear on a produced-water injection pump, found on routine inspection and now tracked as an integrity anomaly.',
  ev:['AN-8902','WO-443774','ORA-1191'],

    bar:'contain'},

    loss:'Illustrative: sustained reduced duty on the affected train'},

 {id:'C2',n:'Essential generator B extended outage',zone:'power',

   {d:'safety',s:'act',  t:'Emergency power margin reduced',

    bar:'power'},
   {d:'prod',  s:'att',  t:'No redundancy for essential loads',

 {id:'C3',n:'Flare tip inspection deferred',zone:'firegas',

  ev:['ORA-1188'],
  cons:[
   {d:'safety',s:'watch',t:'Disposal route condition unverified',
    s2:'Blowdown relies on the flare. Its condition is assumed rather than confirmed.',
    bar:'relief'},
   {d:'prod',  s:'ok',   t:'No current production consequence',

   {d:'esg',   s:'att',  t:'Combustion efficiency unverified',
    s2:'Unverified tip condition means reported combustion efficiency, and the emissions figure derived from it, cannot be evidenced.',
    bar:null}
  ]}
 ,
 {id:'C4',n:'Firewater pump B reliability degradation',zone:'firewater',
  root:'Firewater pump B has failed to start on test three times in ninety days. '+
       'Condition is deteriorating rather than failed — the pump still starts, but not reliably.',
  ev:['WO-444320','ORA-1152','WO-442117'],
  headline:'A safety condition whose operational response becomes a production decision.',
  cons:[
   {d:'safety',s:'act',  t:'Firewater availability degraded',
    s2:'Firewater is a critical mitigation barrier. Reduced reliability on one of two pumps weakens '+
       'emergency response capability — the barrier is not lost, but it can no longer be relied on to '+
       'operate on demand.',
    bar:'eer'},
   {d:'prod',  s:'att',  t:'Production curtailment may be required',
    s2:'If firewater availability falls below the minimum operating condition, the asset has to curtail '+
       'or stop production until it is restored. The safety condition does not stay a safety condition — '+
       'the response to it is a production decision.',
    loss:'Illustrative: curtailment exposure while single-pump availability persists'},
   {d:'esg',   s:'watch',t:'Shutdown and restart emissions exposure',
    s2:'If curtailment becomes a shutdown, the shutdown and subsequent restart carry flaring and altered '+
       'operating conditions. Shown as an illustrative consequence of the operational response, not as an '+
       'asserted environmental impact.',
    bar:null}
  ]}

const condById=id=>CONDITIONS.find(c=>c.id===id)||null;
const condsInDomain=d=>CONDITIONS.filter(c=>c.cons.some(x=>x.d===d&&x.s!=='ok'));
const consOf=(c,d)=>c.cons.find(x=>x.d===d)||null;
/* every condition that reaches more than one domain — the tram-lines */
const crossDomain=()=>CONDITIONS.filter(c=>c.cons.filter(x=>x.s!=='ok').length>1);

function domainState(d){
  const cs=condsInDomain(d);
  const worst=cs.reduce((a,c)=>Math.max(a,ATT_STATE[consOf(c,d).s].rank),0);
  const key=Object.keys(ATT_STATE).find(k=>ATT_STATE[k].rank===worst)||'ok';
  return Object.assign({n:cs.length,conds:cs,key:key},ATT_STATE[key]);
}
function domainsOf(c){return c.cons.filter(x=>x.s!=='ok').map(x=>domainById(x.d));}

/* ============================================ COMPANY / BU RULES & ASSURANCE
   Three things kept deliberately separate, because Mike was explicit that
   they are not the same question:
     rule      — what the company expects of every asset
     asset     — how THIS asset is performing against it
     systemic  — whether the rule or the process behind it is itself weak
   A systemic finding is not the asset's failure and must not be read as one. */
const COMPANY_RULES=[
 {id:'CR1',n:'Management of Change',
  rule:'Every temporary modification carries a defined expiry and a named owner, and is reviewed before expiry.',
  asset:{s:'watch',v:'2 of 3 temporary modifications carry an expiry',

  systemic:{s:'act',v:'MOC procedure does not require an expiry field',
            n:'Affects every asset in the business unit',
            note:'The gap is in the procedure, not in this asset’s compliance with it. Raised as a business-unit finding.'}},
 {id:'CR2',n:'Competence assurance for safety-critical roles',
  rule:'Personnel holding safety-critical positions hold current, verified competence for those positions.',
  asset:{s:'ok',v:'96% current',note:'Within the company expectation of 95%.'},
  systemic:{s:'watch',v:'Verification backlog at business-unit level',
            n:'Affects several assets',
            note:'Central verification is running behind, so currency is self-declared in the interim.'}},
 {id:'CR3',n:'Safety-critical maintenance deferral',
  rule:'Deferral of safety-critical maintenance requires documented technical justification and a recovery date.',
  asset:{s:'act',v:'3 deferrals without a recovery date',
         note:'Justification is recorded; the recovery date field is empty.'},

 {id:'CR4',n:'Emergency response readiness',

  asset:{s:'ok',v:'Fully manned',note:'No shortfall recorded on this asset.'},

const ruleById=id=>COMPANY_RULES.find(r=>r.id===id)||null;

/* Cross-asset Tier 4 — weaknesses that sit above this asset. The asset can be
   locally healthy and still be carrying these. Mike's point exactly. */
const BU_TIER4=COMPANY_RULES.filter(r=>r.systemic.s!=='ok')
  .map(r=>({id:r.id,n:r.systemic.v,scope:r.systemic.n,s:r.systemic.s,rule:r.n}));

/* ---------------------------------------------------- TIER 4, BROADENED
   Not completion percentages. Tier 4 is the health of the operating
   discipline that keeps barriers effective. */
const T4_DIMENSIONS=[
 {id:'insp', n:'Inspection & testing',   v:89, unit:'%', target:95, s:'watch'},
 {id:'comp', n:'Competence',             v:96, unit:'%', target:95, s:'ok'},
 {id:'moc',  n:'MOC quality',            v:'1 without expiry', s:'watch'},
 {id:'proc', n:'Procedures current',     v:92, unit:'%', target:95, s:'watch'},
 {id:'audit',n:'Audit actions closed',   v:'2 overdue', s:'act'},
 {id:'res',  n:'Resourcing',             v:'ER shortfall at BU level', s:'watch'},
 {id:'er',   n:'Emergency response drills',v:100,unit:'%',target:100,s:'ok'}

<script>
"use strict";
/* ============================================================================
   HARBOUR PROCESS-SAFETY CLASSIFICATION

   Taken from Harbour's own Process Safety Event Reporting Procedure, as
   supplied. Until now the Tier logic here was our reading of IOGP 456 and
   API RP 754; this replaces that with Harbour's own structure for the
   non-LOPC Tier 3 types, and adds their plant / process / people barrier
   distinction.

   Deliberately NOT on the front page. Classification belongs in drill-downs,
   evidence panels and event records — an operations manager should not have
   to know the taxonomy to read the operating picture.

   IMPORTANT: not every Clarity attention item is a Tier 3 process safety
   event. Classification is applied where the evidence supports it and is
   left blank where it does not. `t3Type()` returns null rather than
   guessing.
   ========================================================================== */

const HARBOUR_T3={
 B:{code:'B',n:'Challenge to Safety System',
    d:'A protective system called upon in anger — activation of a safety instrumented '+
      'system, mechanical shutdown, pressure relief device, blowdown or fixed fire protection.',
    eg:['SIS / ESD activation','Mechanical shutdown activation','PRD activation',
        'Blowdown activation','Fixed fire protection activation']},
 C:{code:'C',n:'Individual Plant Barrier Weakness',
    d:'A hardware barrier that is failed, impaired, outside inspection or test limits, '+
      'bypassed or inhibited, or physically degraded against its performance standard.',
    eg:['Failed or impaired plant barrier','Equipment outside inspection or test limits',
        'Barrier component fails on demand or during test','Incorrectly bypassed or inhibited safety system',
        'Physical degradation affecting a performance standard']},
 D:{code:'D',n:'Individual Process Barrier Weakness',
    d:'A weakness in the way a safety-critical process is defined or carried out — procedure, '+
      'management of change, inspection or testing process, or operating discipline.',
    eg:['Procedural weakness','Ineffective MOC execution','Inadequate inspection or testing process',
        'Work process not implemented as intended','Competence or operating-discipline weakness']}
};

/* Harbour's barrier taxonomy. A barrier is plant, process or people — and a
   plant barrier is usually SUPPORTED by one of the other two. */
const BARRIER_TYPE={
 plant  :{n:'Plant',  d:'Hardware and SECE-related controls.'},
 process:{n:'Process',d:'Standards, procedures, practices, instructions and safety-critical processes.'},
 people :{n:'People', d:'Training, knowledge, competence, communication and operating discipline.'}
};

/* Harbour's own PSPI categories, used as evidence feeds — NOT reproduced as a
   report. Clarity sits above these: they are what the conclusions are built
   from, not the user experience. */
const PSPI_CATEGORIES=[
 {id:'ora',   n:'Operational Risk Assessments',      sys:'synergi', asset:true},
 {id:'moc',   n:'Management of Change',              sys:'maximo',  asset:true},
 {id:'tmoc',  n:'Temporary MOCs',                    sys:'maximo',  asset:true},
 {id:'mocod', n:'Overdue MOC actions',               sys:'maximo',  asset:true},
 {id:'comp',  n:'Competency',                        sys:'bespoke', asset:true},
 {id:'psic',  n:'Safety overrides / PSICs',          sys:'maximo',  asset:true},
 {id:'secebl',n:'SECE maintenance backlog',          sys:'maximo',  asset:true},
 {id:'dlr',   n:'Defined Life Repairs',              sys:'anomaly', asset:true},
 {id:'anom',  n:'Anomaly management',                sys:'anomaly', asset:true},
 {id:'weeps', n:'Weeps & Seeps',                     sys:'anomaly', asset:true},
 {id:'sol',   n:'Safe Operating Limits',             sys:'pi',      asset:true},
 {id:'sif',   n:'Demand on Safety Instrumented Functions',sys:'pi', asset:true},
 {id:'t12',   n:'Tier 1 / Tier 2 process safety events',sys:'synergi',asset:true},
 {id:'t3',    n:'Tier 3 process safety events',      sys:'synergi', asset:true},
 {id:'verif', n:'SECE independent verification',     sys:'anomaly', asset:true},
 {id:'auda',  n:'Asset-specific audit findings',     sys:'synergi', asset:true},
 {id:'audx',  n:'Cross-asset audit findings',        sys:'synergi', asset:false},
 {id:'synod', n:'Overdue Synergi actions',           sys:'synergi', asset:true}
];
const pspiById=id=>PSPI_CATEGORIES.find(p=>p.id===id)||null;

/* -------------------------------------------------------- classification
   Applied from what the record actually says. Where nothing in the evidence
   supports a Tier 3 classification, this returns null and the panel says so
   rather than inventing one. */
function t3Type(e){
  if(!e)return null;
  const s=((e.title||'')+' '+(e.status||'')+' '+(e.note||'')).toLowerCase();
  /* B first — a system called upon is a challenge, even if it also sits on a
     degraded barrier. Harbour's procedure treats the demand as the event. */
  if(/activat|called (up)?on|in anger|demand on|\btrip\b|tripped|blowdown|relief valve lift|closed on demand|instrumented function/.test(s))return 'B';
  /* C — hardware failed, impaired, bypassed, degraded, or outside the
     inspection/test regime its performance standard requires. An overdue
     statutory test on a safety-critical item is outside test limits. */
  if(/bypass|inhibit|impair|manual start|fail(ed|ure)? to start|failed on test|fails on demand|outside .*limit|degrad|wall loss|corros|wrap|clamp|coating|past planned finish|overdue|deferred/.test(s))return 'C';
  /* D — the weakness is in how a safety-critical process is defined or run. */
  if(/procedur|process weakness|moc\b|management of change|competen|discipline|not implemented|inspection regime|testing process|documentation|free text|no structured|not identified|no expiry/.test(s))return 'D';
  return null;
}
/* Plant / process / people. A record can name a supporting barrier as well. */
function barrierTypeOf(e){
  const t=t3Type(e);
  if(t==='D')return{main:'process',support:'people'};
  if(t==='C')return{main:'plant',  support:'process'};
  if(t==='B')return{main:'plant',  support:null};
  return{main:'plant',support:null};
}
/* Which PSPI feed a record would arrive on. */
function pspiOf(e){
  if(!e)return null;
  const s=((e.title||'')+' '+(e.status||'')).toLowerCase();
  if(e.kind==='ora')return pspiById('ora');
  if(e.kind==='dlr')return pspiById('dlr');
  if(/deferr|past planned finish/.test(s)&&/sece|safety.critical|firewater|relief|detect/.test(s))return pspiById('secebl');
  if(/wall loss|corros|coating|anomaly/.test(s))return pspiById('anom');
  if(/bypass|inhibit|override/.test(s))return pspiById('psic');
  if(e.kind==='deferral')return pspiById('secebl');
  return pspiById('synod');
}

/* ------------------------------------------------ the drill-down panel (§9)
   Compact, drill-down only, never on the main screen. */
function harbourPanel(e,opts){
  opts=opts||{};
  const t=t3Type(e), bt=barrierTypeOf(e), p=pspiOf(e);
  const bar=typeof barrierFor==='function'?barrierFor(e):null;
  const conds=(typeof CONDITIONS!=='undefined')
    ? CONDITIONS.filter(c=>c.ev.indexOf(e.id)>-1) : [];
  const reach=conds.length?conds[0].cons.filter(x=>x.s!=='ok'):[];
  return `<div class="hbp">
    <div class="hbp-h">${icon('shield',12)} Harbour classification</div>
    <div class="hbp-g">
      <div class="hbp-r">
        <span class="hbp-k">Tier 3 type</span>
        <span class="hbp-v">${t?`<b>Type ${t}</b> — ${esc(HARBOUR_T3[t].n)}`

<script>
"use strict";
/* ============================================================================
   THE ASSET STAGE

   A demonstration asset, shown as a single image with a small number of
   interactive areas over it. There is no 3D model, no geometry and no
   engineering data behind the picture, and none is implied.

   The hotspot coordinates are positions on the IMAGE. They do not identify
   the real location of equipment, SECEs or barriers on the installation
   shown, and nothing in this build should ever say that they do.

   Same public interface as the renderer it replaces — mount, unmount, paint,
   home, flash, flyToZone, focusAttn, ok — so nothing else in the app changed.
   ========================================================================== */
const STAGE=(function(){
  let host=null, mounted=null, img=null, ready=false;

  const el=document.createElement('div');
  el.className='astage';
  el.innerHTML=
    '<div class="astage-wrap">'+
      '<img class="astage-img" alt="Illustrative industrial installation used as a demonstration asset">'+
      '<div class="astage-hots"></div>'+
      '<svg class="astage-svg" preserveAspectRatio="none"></svg>'+
    '</div>'+
    '<div class="astage-foot">'+
      '<span class="astage-tag">'+
        '<span class="astage-dot"></span>Illustrative demonstration data'+
        '<button class="astage-i" aria-label="About this demonstration">i</button>'+
      '</span>'+
    '</div>';
  const wrap  = el.querySelector('.astage-wrap');
  const imgEl = el.querySelector('.astage-img');
  const hots  = el.querySelector('.astage-hots');
  const svg   = el.querySelector('.astage-svg');
  el.querySelector('.astage-i').onclick=function(ev){ev.stopPropagation();openDemoNote();};

  const data=document.getElementById('assetImage');
  if(data&&data.textContent.length>2000){
    imgEl.src='data:image/webp;base64,'+data.textContent.replace(/\s+/g,'');
    data.textContent='';
    imgEl.onload=function(){ready=true;paint();};
  }

  /* An area's position is a fraction of the rendered image, so it stays put
     at any size without any projection maths. */
  function pos(z){
    const r=imgEl.getBoundingClientRect(), w=wrap.getBoundingClientRect();
    if(!r.width)return null;
    return{x:(r.left-w.left)+z.nx*r.width, y:(r.top-w.top)+z.ny*r.height, s:r.width/1400};
  }

  function paint(){
    if(!ready||!mounted)return;
    const D=(typeof derive==='function')?derive():null;
    const ranked=(D&&D.ranked)?D.ranked:(typeof rankedAttention==='function'?rankedAttention():[]);
    const inScope=(typeof scopeZones==='function')?scopeZones():ZONES.map(z=>z.id);
    const byZone={};
    ranked.forEach(a=>{ if(!byZone[a.zone])byZone[a.zone]=a; });

    hots.innerHTML=ZONES.map(function(z){
      if(inScope.indexOf(z.id)<0)return'';
      const p=pos(z); if(!p)return'';
      const a=byZone[z.id];
      const open=(typeof eventsIn==='function')?eventsIn(z.id).length:0;
      /* colour comes from the ranking, never authored on the picture */
      const rag=a?a.rag:(open?'amber':'green');
      const live=!!a&&a.rag!=='green';
      const sel=(typeof STATE!=='undefined'&&STATE.openAttn&&a&&STATE.openAttn===a.id);
      return '<button class="ahot '+rag+(live?' live':'')+(sel?' sel':'')+'" '+
             'style="left:'+p.x.toFixed(1)+'px;top:'+p.y.toFixed(1)+'px" '+
             'data-zone="'+z.id+'" title="'+esc(z.name)+'">'+
               '<span class="ah-ring"></span><span class="ah-core"></span>'+
               '<span class="ah-lab">'+esc(z.name)+(open?'<b>'+open+'</b>':'')+'</span>'+
             '</button>';
    }).join('');

    Array.prototype.forEach.call(hots.querySelectorAll('.ahot'),function(b){
      b.onclick=function(){
        const zid=b.getAttribute('data-zone');
        const a=byZone[zid];
        if(a&&typeof openAttention==='function')openAttention(a.id);
        else if(typeof openZonePanel==='function')openZonePanel(zid);
      };
    });

    /* the convergence link, and dependency lines when asked for */
    const r=wrap.getBoundingClientRect();
    svg.setAttribute('viewBox','0 0 '+r.width+' '+r.height);
    let g='';
    if(typeof CUM_PAIR!=='undefined'&&STATE.prefs&&STATE.prefs.monitor.indexOf('cum')>-1){
      const za=byZone[(attnById(CUM_PAIR[0])||{}).zone], zb=byZone[(attnById(CUM_PAIR[1])||{}).zone];
      const pa=za?pos(zoneById(za.zone)):null, pb=zb?pos(zoneById(zb.zone)):null;
      if(pa&&pb){
        const mx=(pa.x+pb.x)/2,my=Math.min(pa.y,pb.y)-46;
        g+='<path class="hl" d="M'+pa.x+' '+pa.y+' Q'+mx+' '+my+' '+pb.x+' '+pb.y+'"/>'+
           '<rect x="'+(mx-68)+'" y="'+(my-16)+'" width="136" height="19" rx="9" '+
           'fill="rgba(6,14,22,.86)" stroke="rgba(240,170,50,.5)"/>'+
           '<text class="hlt" x="'+mx+'" y="'+(my-3)+'" text-anchor="middle">Evidence convergence</text>';
      }
    }
    if(STATE.depShow&&typeof dependencyImpact==='function'){
      const mine=ZONES.find(function(z){return z.id===(attnById(STATE.openAttn)||{}).zone;});
      const from=mine?pos(mine):null;
      if(from){
        const seen={};
        dependencyImpact(STATE.depShow).filter(function(x){return x.bar;}).slice(0,6).forEach(function(x){
          const tz=ZONES.find(function(z){return eventsIn(z.id).some(function(e){
            return (barrierFor(e)||{}).id===x.bar;});});
          if(!tz||seen[tz.id]||tz===mine)return; seen[tz.id]=1;
          const to=pos(tz); if(!to)return;
          const w={T:3.2,H:2.6,M:1.9,L:1.3}[x.d]||1.4, o={T:1,H:.92,M:.74,L:.5}[x.d]||.6;
          const col=x.alreadyWeak?'#ff6b66':'#7fd8f5';
          const mx=(from.x+to.x)/2,my=(from.y+to.y)/2-Math.abs(from.x-to.x)*0.2-16;
          const d='M'+from.x+' '+from.y+' Q'+mx+' '+my+' '+to.x+' '+to.y;
          g+='<path d="'+d+'" fill="none" stroke="rgba(4,12,20,.75)" stroke-width="'+(w+2.6)+'" stroke-linecap="round"/>'+
             '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" opacity="'+o+
             '" stroke-linecap="round"'+(x.d==='L'?' stroke-dasharray="4 5"':'')+'/>'+
             '<text x="'+to.x+'" y="'+(to.y-16)+'" text-anchor="middle" class="dlt" fill="'+col+'">'+
             DEP_DEF[x.d].w.toUpperCase()+'</text>';
        });
      }
    }
    svg.innerHTML=g;
  }

  let ro=null;
  function mount(sel){
    const t=document.querySelector(sel); if(!t)return;
    if(mounted===t){paint();return;}
    t.appendChild(el); mounted=t;
    if(!ro&&window.ResizeObserver){ro=new ResizeObserver(function(){paint();});ro.observe(el);}
    requestAnimationFrame(paint); setTimeout(paint,120);
  }
  function unmount(){ if(el.parentNode)el.parentNode.removeChild(el); mounted=null; }
  function flash(zid){
    const b=hots.querySelector('.ahot[data-zone="'+zid+'"]');
    if(!b)return; b.classList.add('flash'); setTimeout(function(){b.classList.remove('flash');},1400);
  }
  return{mount:mount,unmount:unmount,paint:paint,home:paint,flash:flash,
         flyToZone:function(z){paint();flash(z);},
         focusAttn:function(a){paint();if(a&&a.zone)flash(a.zone);},
         get ok(){return ready;}};
})();

function openDemoNote(){
  openModal(mhead('About this demonstration','Illustrative data and an illustrative asset')+
    `<div class="mbody" style="line-height:1.62;white-space:pre-line;margin-bottom:18px">${esc(DEMO_NOTE.long)}</div>`+
    msec('What is real in this build',
      `<div class="mbody">The process-safety architecture, the dependency relationships and the
        evidence model are structured around real material. The asset picture, the seven areas
        marked on it and every operational condition shown are fictional demonstration content.</div>`));
}
