     '\n\nAttention owner: '+(a.owner?person(a.owner).name:'Unassigned')+
     '\nResponse required: '+(a.due?dueLabel(a.due):'no date set')+
     '\nRecommended next step: '+a.next)}</div>`)+
   msec('','<div class="own-note">This is what Clarity would put in the message. Nothing is sent from this demonstration.</div>')+
   `<div class="rowbtns"><button class="btn btn-primary sm" onclick="closeModal();toast('Demonstration summary copied to the clipboard')">${icon('share',13)}Copy summary</button>
    <button class="btn sm" onclick="closeModal()">Close</button></div>`,'wide');
}
</script>
<script>
"use strict";
/* ============================================================================
   PERSONALISE MY DAILY VIEW
   A working preference engine. Every control filters the same register, and the
   live preview recomputes from the draft before anything is applied.
   ========================================================================== */
function draft(){
  if(!STATE.prefDraft)STATE.prefDraft=JSON.parse(JSON.stringify(STATE.prefs));
  return STATE.prefDraft;
}
function tgl(list,id){const i=list.indexOf(id);if(i>-1)list.splice(i,1);else list.push(id);}
function prefSet(kind,id){
  const d=draft();
  if(kind==='scope')tgl(d.scope,id);
  else if(kind==='monitor')tgl(d.monitor,id);
  else if(kind==='rules')tgl(d.rules,id);
  else if(kind==='systems')tgl(d.systems,id);
  else if(kind==='components'){const c=COMPONENTS.find(x=>x.id===id);if(c&&c.lock)return;tgl(d.components,id);}
  renderPrefBody();
}
function prefThr(k,v){draft().thresholds[k]=(k==='minSev')?v:+v;renderPrefBody();}
function prefWindow(w){draft().window=+w;renderPrefBody();}
function moveComp(id,dir){
  const d=draft(),i=d.components.indexOf(id);
  if(i<0)return;
  const j=i+dir;if(j<0||j>=d.components.length)return;
  d.components.splice(j,0,d.components.splice(i,1)[0]);
  renderPrefBody();
}
function togglePref(){STATE.prefOpen=!STATE.prefOpen;if(STATE.prefOpen)STATE.prefDraft=JSON.parse(JSON.stringify(STATE.prefs));render();}
function applyPrefs(){
  STATE.prefs=JSON.parse(JSON.stringify(draft()));
  STATE.prefDraft=null;STATE.prefOpen=false;persist();
  if(STAGE.ok)STAGE.paint();
  render();
  toast('Daily view updated — '+matching().length+' records in scope');
}
function saveDefault(){
  STATE.prefs=JSON.parse(JSON.stringify(draft()));
  const v=STATE.savedViews.find(x=>x.id===STATE.activeView);
  if(v){v.p=JSON.parse(JSON.stringify(STATE.prefs));v.p.role=STATE.role;}
  STATE.defaultView=STATE.activeView;
  STATE.savedViews.forEach(x=>{x.def=(x.id===STATE.activeView);});
  STATE.prefDraft=null;STATE.prefOpen=false;persist();render();
  toast('Saved as your default opening view');
}
function resetPrefs(){STATE.prefDraft=JSON.parse(JSON.stringify(DEFAULT_PREFS));renderPrefBody();toast('Reset to your Clarity default');}
function cancelPrefs(){STATE.prefDraft=null;STATE.prefOpen=false;render();}
function removeChip(kind,id){
  STATE.prefDraft=JSON.parse(JSON.stringify(STATE.prefs));
  prefSet(kind,id);
  STATE.prefs=JSON.parse(JSON.stringify(STATE.prefDraft));
  STATE.prefDraft=null;persist();
  if(STAGE.ok)STAGE.paint();
  render();
}
function loadSavedView(id){
  const v=STATE.savedViews.find(x=>x.id===id);if(!v)return;
  const base=JSON.parse(JSON.stringify(DEFAULT_PREFS));
  const p=v.p||{};
  Object.keys(p).forEach(k=>{if(k==='role')return;base[k]=JSON.parse(JSON.stringify(p[k]));});
  if(p.ownerFilter)STATE.ownerFilter=p.ownerFilter;
  if(p.role)STATE.role=p.role;
  STATE.prefs=base;STATE.activeView=id;STATE.prefDraft=null;persist();
  if(STAGE.ok)STAGE.paint();
  render();
  toast('“'+v.n+'” loaded — '+matching().length+' records in scope');
}
function saveAsNewView(){
  const n=prompt('Name this view','My view '+(STATE.savedViews.filter(v=>v.custom).length+1));
  if(!n)return;
  const id='v'+Date.now();
  STATE.savedViews.push({id:id,n:n,custom:true,p:JSON.parse(JSON.stringify(draft()))});
  STATE.prefs=JSON.parse(JSON.stringify(draft()));STATE.activeView=id;STATE.prefDraft=null;
  persist();render();toast('Saved as “'+n+'”');
}
function updateCurrentView(){
  const v=STATE.savedViews.find(x=>x.id===STATE.activeView);
  if(!v){saveAsNewView();return;}
  v.p=JSON.parse(JSON.stringify(draft()));v.p.role=STATE.role;
  STATE.prefs=JSON.parse(JSON.stringify(draft()));STATE.prefDraft=null;
  persist();render();toast('“'+v.n+'” updated');
}
function duplicateView(){
  const v=STATE.savedViews.find(x=>x.id===STATE.activeView);
  const n=prompt('Name the copy',(v?v.n:'View')+' (copy)');
  if(!n)return;
  const id='v'+Date.now();
  STATE.savedViews.push({id:id,n:n,custom:true,p:JSON.parse(JSON.stringify(draft()))});
  STATE.activeView=id;persist();render();toast('Duplicated as “'+n+'”');
}
function resetRoleDefault(){
  const seed=STATE.role==='safety'?'psr':STATE.role==='exec'?'weekly':'morning';
  loadSavedView(seed);
  toast('Reset to the '+ROLES[STATE.role].short+' default view');
}
function clearMonitors(){
  STATE.prefs.monitor=STATE.prefs.monitor.filter(m=>['ora','defer','dlr','integ','scwo','pi','act','dq'].indexOf(m)<0);
  persist();render();
}
function restoreSystems(){
  STATE.prefs.systems=uniq(STATE.prefs.systems.concat(Object.keys(SYSTEMS).filter(s=>SYSTEMS[s].s==='feeding')));
  persist();render();
}
/* matching() against an arbitrary draft, without touching live state */
function matchingWith(d){
  const save=STATE.prefs;STATE.prefs=d;
  let r;try{r=matching(d);}finally{STATE.prefs=save;}
  return r;
}
</script>
<script>
"use strict";
/* ============================================================================
   THE COMMAND VIEW — the one and only home page.
   Three bounded areas: what needs attention (left), where it is (centre),
   what action is required (right), with three supporting reads underneath and
   the personalisation section below the finished canvas.
   ========================================================================== */

/* ---------------------------------------------------------------------------
   THE SECE REGISTER
   The extract Clarity was given is a findings extract: it names only the SECEs
   with something open against them. Treating those ten as the whole register
   would say Mittelplate has no healthy barriers, which is not what the data means.
   The register size is therefore one stated assumption, shown wherever the
   figure is read and correctable with a single number from the operator.
   ------------------------------------------------------------------------ */
const SECE_REGISTER=24;
const SECE_NAMED=BARRIERS.length;
const SECE_IMPLIED=Math.max(0,SECE_REGISTER-SECE_NAMED);
function registerHealth(scope){
  const s=BARRIERS.map(b=>({b:b,st:barrierState(b.id,scope)}));
  const outOfService=s.filter(x=>x.st.n&&x.st.events.every(e=>/out of service|unavailable|withdrawn/i.test(e.status))).length;
  const impaired=s.filter(x=>x.st.key==='impaired').length;
  const degraded=s.filter(x=>x.st.key==='degraded').length;
  const healthy=s.filter(x=>x.st.key==='intact'||x.st.key==='watch').length+SECE_IMPLIED;
  const n=SECE_REGISTER,sum=healthy*100+degraded*60+impaired*20;
  return{healthy,degraded,impaired,outOfService,n,sum,index:Math.round(sum/n),
         named:SECE_NAMED,implied:SECE_IMPLIED,states:s};
}
PROV.register={k:'Assumption',t:'The SECE register',
  what:'How many safety-critical elements Mittelplate carries. The extract names only the ten with something open against them, so the size of the register is an assumption rather than a count.',
  rule:'Register assumed at '+SECE_REGISTER+' elements. '+SECE_NAMED+' are named in the extract and carry a computed condition; the remaining '+SECE_IMPLIED+' have no open record and are counted healthy. Healthy 100 · Degraded 60 · Impaired 20 · Not in service 0, averaged',
  f:['sece','sev','compens'],
  caveat:'One number from the operator — the length of the Mittelplate SECE register — replaces this assumption and makes every figure on the status tile a count.'};

/* ------------------------------------------------------- selection + focus */
function selectedAttn(){
  const r=rankedAttention().filter(attnScopeOk);
  return r.length?(r.find(a=>a.id===STATE.openAttn)||r[0]):null;
}
function openAttention(id){
  const a=attnById(id);if(!a)return;
  STATE.openAttn=id;STATE.selZone=a.zone;markViewed(a);
  STATE.ownMode=null;STATE.ownPick=null;STATE.ownQuery='';
  if(STAGE.ok)STAGE.focusAttn(id);
  const v=parseHash().view;
  if(v!=='home'&&v!=='asset')go('home');else render();
}
function clearAttn(){STATE.depShow=null;STATE.openAttn=null;STATE.ownMode=null;if(STAGE.ok)STAGE.home();render();}

/* ================================================================== V.home */
V.home=function(){
  const ranked=rankedAttention().filter(attnScopeOk);
  const sel=selectedAttn();
  if(sel&&STATE.openAttn!==sel.id)STATE.openAttn=sel.id;
  const comps=STATE.prefs.components;
  const strip=comps.filter(c=>STRIP[c]);
  const need=ATTENTION.filter(a=>!a.done).length;
  return `
  <div class="command-view">
    <div class="command-layout">

      <div class="cl-left">
        <div class="cl-greet" id="tour-greet">
          <h1>${esc(greeting())}, ${esc(PEOPLE[ME].name)}</h1>
          <p><b>${need}</b> change${need===1?'':'s'} require${need===1?'s':''} attention on ${esc(assetLabel())} today</p>
        </div>
        <div class="cl-attn" id="tour-attention">
          <div class="sec-label">Requires your attention
            <button class="why" onclick="openWhy()">Why these ${numw(ranked.length)}?</button></div>
          <div class="acards">${ranked.length?ranked.map(acard).join(''):
            '<div class="spanel" style="cursor:default">Nothing falls inside your current scope.</div>'}</div>
        </div>
      </div>

      <div class="cl-kpis" id="tour-kpis">${comps.indexOf('exec')>-1?kpiRow():''}</div>

      <div class="asset-stage" id="assetStage">
        <div class="stage-cap">Topsides / Process Area</div>
        ${depToggle()}
      </div>

      <div class="selected-issue-panel" id="tour-issue">${sel?issuePanel(sel):issueEmpty()}</div>

      <div class="cl-strip" id="tour-strip" style="grid-template-columns:repeat(${Math.max(1,strip.length)},minmax(0,1fr))">
        ${strip.map(c=>STRIP[c]()).join('')||
          '<div class="spanel" style="cursor:default"><div class="sh">No panels selected</div></div>'}
      </div>

    </div>
    ${buStrip()}
    <div class="statuscap" style="justify-content:flex-end;border:0;margin:6px 0 0;padding:0">
      ${icon('info',11)} ${esc(STATUS_CAPTION)}</div>
    <div class="cmd-foot">
      <button class="stdline" onclick="openStandards()">${icon('shield',11)}${esc(STANDARDS_NOTE)}${icon('chevR',10)}</button>
    </div>
  </div>
  ${prefPanel()}`;
};

/* ------------------------------------------------------- three status tiles */
function ringGauge(pct,col){
  const r=11.5,c=2*Math.PI*r,on=c*clamp(pct,0,100)/100;
  return `<svg width="28" height="28" viewBox="0 0 28 28">
    <circle cx="14" cy="14" r="${r}" fill="none" stroke="var(--track)" stroke-width="3.2"/>
    <circle cx="14" cy="14" r="${r}" fill="none" stroke="${col}" stroke-width="3.2" stroke-linecap="round"
      stroke-dasharray="${on.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 14 14)"/>
    <path d="M8.6 14h2.1l1.3-3.2 2.3 6 1.2-2.8h2.5" fill="none" stroke="${col}" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function kpiRow(){
  /* The top of the operating picture is now cross-domain. Safety, production
     and environment are three readings of the same underlying conditions —
     not three dashboards. Barrier health and the rest live inside Safety. */
  return DOMAINS.map(d=>{
    const st=domainState(d.id);
    const cross=st.conds.filter(c=>c.cons.filter(x=>x.s!=='ok').length>1).length;
    return `<button class="kpi dom-${st.c}" onclick="openDomain('${d.id}')"
      title="${esc(d.q)}">
      <span class="kl">${esc(d.n)}</span>
      <span class="kr">
        <span class="ki">${icon(d.icon,22)}</span>
        <span class="kval">${st.n}</span>
        <span class="kstate tone-${st.c}">${esc(st.w)}</span>
      </span>
      ${cross?`<span class="kcross">${icon('link',10)} ${cross} also affect${cross===1?'s':''} another domain</span>`:''}
    </button>`;}).join('');
}
function openDomain(did){
  const d=domainById(did), st=domainState(did);
  openModal(mhead(d.n,d.q)+
    (st.conds.length?msec(numw(st.conds.length)+' condition'+(st.conds.length===1?'':'s')+' with a consequence here',
      `<div class="da-rel">${st.conds.map(c=>{const x=consOf(c,did);const other=c.cons.filter(y=>y.d!==did&&y.s!=='ok');
        return `<button class="da-row" onclick="closeModal();go('operating','${c.id}')">
          <span class="kb kb-${x.s==='act'?'dlr':'ora'}">${esc(ASW(x.s))}</span>
          <span class="da-rt"><b>${esc(x.t)}</b><i>${esc(c.n)}${other.length?' · also affects '+other.map(y=>esc(domainById(y.d).short)).join(', '):''}</i></span>
        </button>`;}).join('')}</div>`)
     :`<div class="mbody">No condition currently carries a consequence in this domain.</div>`)+
    (did==='safety'?msec('Underneath this',
      `<div class="obtns">
        <button class="obtn cy" onclick="closeModal();go('barriers')">${icon('shield',12)}<span>Barrier health</span></button>
        <button class="obtn" onclick="closeModal();go('assurance')">${icon('check',12)}<span>Barrier assurance</span></button>
        <button class="obtn" onclick="closeModal();go('cumulative')">${icon('layers',12)}<span>Converging evidence</span></button>
      </div>`):'')+
    `<div class="notrisk" style="margin-top:12px">${icon('info',11)} Illustrative demonstration data.
      Colour shows what needs attention, not a risk level.</div>`);
}

/* ------------------------------------------------------- attention cards */
function acard(a){
  return `<button class="acard ${a.rag} ${STATE.openAttn===a.id?'sel':''}" onclick="openAttention('${a.id}')">
    <span class="edge"></span>
    <span class="body">
      <span class="dot"></span><span class="num">${a._rank}</span>
      <span class="txt">
        <span class="t">${esc(a.short||a.title)}</span>
        <span class="d">${esc(a.shortDesc||a.desc)}</span>
        <span class="o ${a.owner?'':'un'}">${a.owner?avatar(a.owner,'sm')+' '+esc(person(a.owner).name)
          :icon('user',12)+' Unassigned'}</span>
        ${a.cta?`<span class="acta" onclick="event.stopPropagation();${a.cta.go}">${esc(a.cta.t)} ${icon('chevR',10)}</span>`:''}
      </span>
    </span>
    <span class="chev">${icon('chevR',15)}</span></button>`;
}

/* §7 — one toggle, off by default. Only offered when the selected item's
   barrier actually has dependents recorded in the supplied matrix. */
function depToggle(){
  const a=selectedAttn(); if(!a)return '';
  const bars=uniq(attnEvents(a).map(e=>(barrierFor(e)||{}).id).filter(Boolean));
  const bar=bars.find(b=>dependencyImpact(b).length); if(!bar)return '';
  const n=dependencyImpact(bar).length, on=STATE.depShow===bar;
  return `<button class="dep-toggle ${on?'on':''}" onclick="toggleDep('${bar}')"
    title="${esc(barrierById(bar).name)} — ${n} dependent SECEs in the supplied matrix">
    ${icon('link',12)}<span>${on?'Hide':'Show'} dependencies</span>
    <em>${n}</em></button>`;
}
function toggleDep(bar){
  STATE.depShow=STATE.depShow===bar?null:bar;
  if(STAGE.ok)STAGE.paint();
  render();
}

/* ================================================ SELECTED ISSUE PANEL */
const SRC_BADGE={
  maximo :{c:'Mx', n:'Maximo',        s:'Work order status'},
  synergi:{c:'ORA',n:'Risk register', s:'DNV Synergi Life'},
  anomaly:{c:'In', n:'Integrity',     s:'Inspection records'},
  sap    :{c:'SAP',n:'Equipment tags',s:'Functional locations'},
  pi     :{c:'PI', n:'Live process',  s:'Not connected'}
};
function issueEmpty(){
  return `<div class="sip-empty">${icon('compass',24)}
    <div>Select a priority on the left to see its barriers, its source records and its ownership.</div></div>`;
}
function issuePanel(a){
  const ev=attnEvents(a);
  const bars=uniq(ev.map(e=>(barrierFor(e)||{}).id).filter(Boolean))
    .map(id=>({b:barrierById(id),s:barrierState(id)})).sort((x,y)=>y.s.rank-x.s.rank);
  const sys=uniq(ev.map(e=>e.system));
  const shown=sys.concat(sys.indexOf('pi')<0?['pi']:[]).slice(0,4);
  const dueVal=a.due?new Date(a.due.getTime()-a.due.getTimezoneOffset()*60000).toISOString().slice(0,16):'';
  const status=a.done?'Completed and closed'
    :!a.owner?'No owner assigned · notification pending'
    :a.ack?'Acknowledged by '+person(a.owner).name+(a.ackAt?' · '+stamp(a.ackAt):'')
    :'Assigned to '+person(a.owner).name+' · awaiting acknowledgement'+(a.notified?' · demonstration notification '+a.notified:'');
  const assigning=STATE.ownMode==='assign'&&STATE.openAttn===a.id;
  return `
    <div class="sip-head">
      <span class="rag rag-${a.rag}" style="margin-top:4px"></span>
      <span style="flex:1;min-width:0">
        <span class="t">${esc(a.short||a.title)}</span>
        <div class="s">${esc(a.headline||a.shortDesc||a.desc)}</div></span>
      <button class="x" onclick="clearAttn()" aria-label="Clear selection">${icon('x',14)}</button>
    </div>
    <div class="sip-body">
      ${zoneLocator(a)}

      <button class="whybtn whybtn-full" onclick="openItemWhy('${a.id}')">${icon('info',12)} Why am I seeing this?</button>

      <div class="sip-sec">Affected barriers</div>
      ${bars.slice(0,3).map(x=>`<div class="brow" onclick="handleLink('barrier','${x.b.id}')">
        <span class="rag rag-${x.s.c==='watch'?'green':x.s.c}"></span>
        <span class="n">${esc(x.b.name)}</span>
        <span class="s tone-${x.s.c==='watch'?'green':x.s.c}">${esc(x.s.w)}</span></div>`).join('')}
      ${bars.length>3?`<div class="tiny" style="margin-top:4px">+ ${bars.length-3} more — open the barrier view</div>`:''}

      <div class="sip-sec">Source systems</div>
      ${shown.map(s=>{const b=SRC_BADGE[s]||{c:'?',n:SYSTEMS[s].n,s:''},off=SYSTEMS[s].s==='available';
        return `<div class="srow ${off?'off':''}" title="${esc(SYSTEMS[s].n+(off?' — not connected in this demonstration':''))}">
          <span class="c">${esc(b.c)}</span>
          <span style="min-width:0"><span class="n">${esc(b.n)}</span><span class="s">${esc(b.s)}</span></span></div>`;}).join('')}

      <div class="sip-sec">Ownership &amp; action ${provI('attention')}</div>
      <div class="orow"><span class="l">Owner</span>
        <span class="ofield">${icon('user',13)}
          <select onchange="queueSetOwner('${a.id}',this.value)" aria-label="Attention owner">
            <option value="">Unassigned</option>
            <option value="${ME}" ${a.owner===ME?'selected':''}>${esc(PEOPLE[ME].name)} (me)</option>
            ${ASSIGNABLE.map(p=>`<option value="${p}" ${a.owner===p?'selected':''}>${esc(person(p).name)}</option>`).join('')}
          </select></span></div>
      <div class="orow"><span class="l">Due</span>
        <span class="ofield">${icon('calendar',13)}
          <input type="datetime-local" value="${dueVal}" onchange="setDue('${a.id}',this.value)" aria-label="Response required by"></span></div>

      <div class="obtns">
        <button class="obtn ${a.owner===ME?'cy':''}" onclick="takeOwnership('${a.id}')">${icon('user',12)}<span>Take ownership</span></button>
        <button class="obtn ${assigning?'cy':''}" onclick="startAssign('${a.id}')">${icon('users',12)}<span>Assign colleague</span></button>
      </div>
      ${assigning?assignPicker(a):''}

      <input class="oinput" placeholder="Add instruction for owner" value="${esc(a.instruction||'')}"
        onchange="addInstruction('${a.id}',this.value)">
      <div class="ostat">${icon('info',12)}<span>${esc(status)}</span></div>

      <div class="obtns" style="margin-top:8px">
        <button class="obtn cy" onclick="handleLink('zone','${a.zone}')">${icon('pin',12)}<span>Show on asset</span></button>
        <button class="obtn" onclick="handleLink('barrier','${bars.length?bars[0].b.id:'contain'}')">${icon('shield',12)}<span>Show barrier</span></button>
      </div>
      <div class="obtns" style="margin-top:6px">
        <button class="obtn" ${a.owner&&!a.ack?'':'disabled'} onclick="markAck('${a.id}')">${icon('check',12)}<span>Acknowledge</span></button>
        <button class="obtn" onclick="openDrill('${a.id}')">${icon('eye',12)}<span>Full action</span></button>
      </div>
      <div class="tiny" style="margin:9px 0 2px;line-height:1.4">Attention owner co-ordinates the response;
        ${uniq(ev.map(e=>e.owner).filter(Boolean)).length} source owner${uniq(ev.map(e=>e.owner).filter(Boolean)).length===1?'':'s'} keep their own records.</div>
    </div>
    <div class="sip-foot">
      <button class="askbtn" onclick="askAbout('${a.id}')">${icon('zap',14)} Ask Clarity</button>
    </div>`;
}

/* The colleague picker opens inside this panel — never as a modal, a drawer or
   a card floating over the asset. */
function assignPicker(a){
  const q=(STATE.ownQuery||'').toLowerCase();
  const ids=ASSIGNABLE.filter(id=>!q||(person(id).name+' '+person(id).role).toLowerCase().indexOf(q)>-1);
  const pick=STATE.ownPick;
  const dueVal=a.due?new Date(a.due.getTime()-a.due.getTimezoneOffset()*60000).toISOString().slice(0,16)
                    :new Date(atToday(16,0).getTime()-NOW.getTimezoneOffset()*60000).toISOString().slice(0,16);
  return `<div class="picker">
    <div class="pl">Assign colleague</div>
    <input class="oinput" style="margin-top:0" id="pplSearch" placeholder="Search name or role…"
      value="${esc(STATE.ownQuery||'')}" oninput="filterPeople(this.value)">
    <div class="list" id="pplList">${ids.length?ids.map(id=>`
      <div class="prow ${pick===id?'on':''}" onclick="pickPerson('${id}')">${avatar(id,'sm')}
        <span class="n">${esc(person(id).name)}</span><span class="r">${esc(person(id).role.split(' · ')[0])}</span>
        ${pick===id?icon('check',13):''}</div>`).join('')
      :`<div class="tiny" style="padding:9px">No colleague matches “${esc(STATE.ownQuery||'')}”.</div>`}</div>
    <div class="orow" style="margin:8px 0 0"><span class="l">Due</span>
      <span class="ofield">${icon('calendar',13)}<input type="datetime-local" id="asgDue" value="${dueVal}"></span></div>
    <input class="oinput" id="asgInstr" placeholder="Short instruction for the owner" value="${esc(a.instruction||'')}">
    ${pick?`<div class="confirm">${icon('info',11)} <strong>${esc(a.short||a.title)}</strong> will be assigned to
      <strong>${esc(person(pick).name)}</strong>. Clarity records it, adds an audit entry, updates the queue and prepares a
      notification. No message is sent from this demonstration.</div>`:''}
    <div class="obtns" style="margin-top:8px">
      <button class="obtn cy" ${pick?'':'disabled'} onclick="confirmAssign('${a.id}')">${icon('check',12)}<span>Confirm</span></button>
      <button class="obtn" onclick="cancelAssign()">${icon('x',12)}<span>Cancel</span></button>
    </div>
  </div>`;
}
function startAssign(id){
  STATE.openAttn=id;
  STATE.ownMode=STATE.ownMode==='assign'?null:'assign';
  STATE.ownPick=null;STATE.ownQuery='';
  render();
  setTimeout(()=>{const el=$("#pplSearch");if(el)el.focus();},60);
}
function cancelAssign(){STATE.ownMode=null;STATE.ownPick=null;STATE.ownQuery='';render();}
function pickPerson(id){
  STATE.ownPick=id;
  const due=$("#asgDue")?$("#asgDue").value:null,ins=$("#asgInstr")?$("#asgInstr").value:null;
  render();
  if(due&&$("#asgDue"))$("#asgDue").value=due;
  if(ins!=null&&$("#asgInstr"))$("#asgInstr").value=ins;
}
function confirmAssign(id){
  if(!STATE.ownPick)return;
  const a=attnById(id);
  const due=$("#asgDue")?$("#asgDue").value:null;
  const ins=$("#asgInstr")?$("#asgInstr").value:'';

}
function zoneLocator(a){
  /* A thumbnail of Mittelplate with the area marked. It shows
     WHERE ON THE PICTURE, not where on any real installation. */
  const z=zoneById(a.zone);
  const col=a.rag==='red'?'var(--red)':a.rag==='amber'?'var(--amber)':'var(--green)';
  if(!z)return `<div class="locator locator-none">${icon('pin',13)} No area recorded for this item</div>`;
  return `<div class="locator">
    <div class="loc-img">
      <img src="${ASSET_THUMB}" alt="Demonstration asset">
      <span class="loc-pin" style="left:${(z.nx*100).toFixed(1)}%;top:${(z.ny*100).toFixed(1)}%;--pc:${col}"></span>
    </div>
    <div class="cap">${esc(z.name)}</div></div>`;
}

/* §8 — every Clarity-generated attention item can show its own working:
   what I noticed, why it matters, what evidence supports it. */
function openItemWhy(id){
  const a=attnById(id); if(!a)return;
  const ev=attnEvents(a);
  const bars=uniq(ev.map(e=>(barrierFor(e)||{}).id).filter(Boolean));
  const das=bars.map(x=>dualAssurance(x));
  const g=convergence().find(x=>x.zone===a.zone);
  const sys=uniq(ev.map(e=>e.system));
  const steps=[];
  das.filter(d=>d.t3.key!=='healthy').slice(0,2).forEach(d=>
    steps.push('<strong>'+esc(d.bar.name)+'</strong> is a critical barrier for '+
      mahsForBarrier(d.bar.id).map(m=>esc(m.short)).join(' and ')+'.'));
  das.filter(d=>d.t3.key==='weakening').slice(0,2).forEach(d=>
    steps.push('Tier 3 barrier performance for '+esc(d.bar.short)+' has deteriorated — '+esc(d.t3.lines[0])+'.'));
  das.filter(d=>d.t4.key==='weakening').slice(0,2).forEach(d=>
    steps.push('Tier 4 assurance performance for '+esc(d.bar.short)+' is below target — '+d.t4.plan+'% against '+d.t4.target+'%.'));
  const oras=ev.filter(e=>e.kind==='ora').length, defs=ev.filter(e=>e.kind==='deferral').length,
        dlrs=ev.filter(e=>e.kind==='dlr').length;
  if(oras)steps.push(cap(numw(oras))+' active operational risk assessment'+(oras===1?'':'s')+' affect'+(oras===1?'s':'')+' the same operating area.');
  if(defs)steps.push(cap(numw(defs))+' overdue or deferred maintenance activit'+(defs===1?'y':'ies')+' affect'+(defs===1?'s':'')+' associated equipment.');
  if(dlrs)steps.push(cap(numw(dlrs))+' temporary or defined-life repair'+(dlrs===1?'':'s')+' remain'+(dlrs===1?'s':'')+' open.');
  if(g)steps.push('These conditions are currently landing on the same area — '+esc(g.name)+'.');
  const oldest=ev.length?Math.max.apply(null,ev.map(e=>e.raised)):0;
  if(oldest)steps.push('They have persisted concurrently for '+numw(Math.max(1,Math.round(oldest/24)))+' days.');
  if(!a.owner)steps.push('No owner has been assigned, so nobody is currently co-ordinating the response.');
  openModal(mhead('Why Clarity highlighted this',a.short||a.title)+
    msec('What I noticed',`<ol class="whyol">${steps.map(x=>`<li>${x}</li>`).join('')}</ol>`)+
    msec('Why it matters',`<div class="mbody">${esc(a.why)}</div>`)+
    msec('What evidence supports it',
      `<div class="mbody"><strong>${ev.length}</strong> evidence record${ev.length===1?'':'s'} across
        <strong>${sys.length}</strong> source system${sys.length===1?'':'s'} — ${sys.map(x=>esc(SYSTEMS[x].n)).join(', ')}.</div>
       <div class="da-rel" style="margin-top:10px">${ev.map(e=>`
         <button class="da-row" onclick="closeModal();openEventModal('${e.id}')">
           <span class="kb kb-${e.kind}">${KINDS[e.kind].label}</span>
           <span class="da-rt"><b>${esc(e.title)}</b><i>${esc(e.status)}</i></span>
           <span class="sevdot sev-${e.sev}"></span>
         </button>`).join('')}</div>`)+
    (das.length?`<div class="obtns" style="margin-top:12px">
       <button class="obtn cy" onclick="closeModal();go('dual','${das[0].bar.id}')">${icon('shield',12)}<span>Open dual assurance</span></button>
       ${g?`<button class="obtn" onclick="closeModal();go('cumulative')">${icon('layers',12)}<span>See the convergence</span></button>`:''}
     </div>`:''));
}

/* ============================================================ SUPPORTING STRIP */
const STRIP={};
function feedLine(e){
  if(e.closedAt!=null)return e.title.replace(/ — .*$/,'')+' returned to service';
  if(e.kind==='deferral'&&/past planned finish/i.test(e.status))return e.title+' — overrun';
  return e.title;
}
STRIP.changed=function(){
  /* §9 — do not make the reader interpret raw indicators. Say what
     materially changed, classified against the assurance model. */
  const list=materialChanges().slice(0,3);
  return `<div class="spanel" onclick="go('asset')">
    <div class="sh">What changed<span class="t">${esc(windowLabel(STATE.prefs.window))}</span></div>
    ${list.length?list.map(m=>`<div class="wc wc-2" onclick="event.stopPropagation();${m.go}">
      <span class="rag rag-${m.rag}"></span>
      <span class="n"><b>${esc(m.head)}</b><i>${esc(m.sub)}</i></span>
      <span class="c">${icon('chevR',13)}</span></div>`).join('')
    :'<div class="tiny" style="padding:8px 0">Nothing has changed inside this window within your current scope.</div>'}
  </div>`;
};
/* Material change = a statement, not a row. Each one is computed. */
function materialChanges(){
  const out=[], w=STATE.prefs.window;
  dualAll().forEach(d=>{
    const t3w=d.t3.key==='weakening', t4w=d.t4.key==='weakening';
    if(t3w&&t4w)out.push({rag:'red',head:d.bar.short+' assurance deteriorated',
      sub:'Tier 3: '+d.t3.lines[0].toLowerCase()+' · Tier 4: '+d.t4.plan+'% of plan against '+d.t4.target+'%',
      go:"go('dual','"+d.bar.id+"')",rank:4});
    else if(t3w)out.push({rag:'amber',head:d.bar.short+' barrier weakening',
      sub:'Tier 3 deteriorating while Tier 4 assurance remains within target',
      go:"go('dual','"+d.bar.id+"')",rank:3});
    else if(t4w)out.push({rag:'amber',head:d.bar.short+' assurance behind plan',
      sub:'Tier 4 at '+d.t4.plan+'% against a '+d.t4.target+'% target · barrier performance holding',
      go:"go('dual','"+d.bar.id+"')",rank:2});
  });
  convergence().forEach(g=>out.push({rag:'amber',head:g.name+' convergence increased',
    sub:g.n+' conditions from '+numw(g.kinds)+' registers now affect '+numw(g.bars.length)+' critical barriers',
    go:"go('cumulative')",rank:3.5}));
  const closed=changed().filter(e=>e.closedAt!=null);
  if(closed.length)out.push({rag:'green',head:'Barrier recovery recorded',
    sub:cap(numw(closed.length))+' record'+(closed.length===1?'':'s')+' closed — '+closed[0].title.replace(/ — .*$/,''),
    go:"openEventModal('"+closed[0].id+"')",rank:1});
  return out.sort((a,b)=>b.rank-a.rank);
}
STRIP.barrier=function(){
  const rh=registerHealth();
  /* Barrier condition on the operating picture uses the operational status
     scale, not RAG. "Impaired" is a barrier condition, not a risk rating, and
     borrowing formal red for it is exactly what Mike warned against. */
  const seg=[['Healthy',rh.healthy,'var(--green)'],['Degraded',rh.degraded,'var(--st-watch)'],
             ['Impaired',rh.impaired,'var(--st-act)'],['Not in service',rh.outOfService,'var(--st-norm)']];
  return `<div class="spanel" onclick="go('barriers')">
    <div class="sh">Barrier health<span class="t">${rh.n} SECEs</span></div>
    <div class="bh-bar">${seg.filter(s=>s[1]).map(s=>`<i style="width:${(s[1]/rh.n*100).toFixed(1)}%;background:${s[2]}"></i>`).join('')}</div>
    ${seg.map(s=>`<div class="bh-row"><span class="rag" style="background:${s[2]}"></span>${s[0]}<span class="v">${s[1]}</span></div>`).join('')}
  </div>`;
};
/* exposure replayed from the records that existed at each step */
function cumAt(hoursAgo){
  const live=EVENTS.filter(e=>e.raised>=hoursAgo&&(e.closedAt==null||e.closedAt<hoursAgo));
  const ind=CUM_PAIR.map(id=>{
    const ex=attnById(id).events.map(x=>live.find(e=>e.id===x)).filter(Boolean).map(e=>SEV_EXPO[e.sev]);
    return ex.length?Math.sqrt(ex.reduce((s,v)=>s+v*v,0)/ex.length)*(1+Math.min(0.35,(ex.length-1)*0.09)):0;
  });
  if(!ind[0]||!ind[1])return clamp(Math.max(ind[0],ind[1]),0,100);
  const on=STRANDS.filter(s=>STATE.strandsOff.indexOf(s.id)<0&&s.ev.every(x=>live.some(e=>e.id===x)));
  const w=on.reduce((s,x)=>s+x.w,0);
  return clamp(Math.sqrt((ind[0]*ind[0]+ind[1]*ind[1])/2)*(1+(w/100)*0.32),0,100);
}
STRIP.cum=function(){
  /* Cumulative Risk AWARENESS. Clarity does not calculate cumulative risk and
     no score is shown. This panel reports where independently managed
     conditions are converging — counts only, each one traceable. */
  const g=topConvergence(), all=convergence();
  if(!g)return `<div class="spanel" onclick="go('cumulative')">
    <div class="sh">Cumulative risk awareness<span class="t">clear</span></div>
    <div class="cra-none">${icon('check',15)} No area is currently showing more than one
      independently managed condition against the same barriers.</div></div>`;
  const lines=convergenceLines(g).slice(0,4);
  return `<div class="spanel cra" onclick="go('cumulative')">
    <div class="sh">Cumulative risk awareness<span class="t">${all.length} area${all.length===1?'':'s'}</span></div>
    <div class="cra-n"><b>${g.n}</b> conditions converging</div>
    <div class="cra-z">${esc(g.name)}</div>
    <div class="cra-l">${lines.map(l=>`<div class="cra-i"><span class="cra-tag cra-${l.k}">${l.tag}</span>${esc(l.t)}</div>`).join('')}</div>
    <div class="cra-go">View why Clarity highlighted this ${icon('chevR',11)}</div>
  </div>`;
};
STRIP.queue=function(){

    ${list.map(a=>`<div class="wc" onclick="event.stopPropagation();openAttention('${a.id}')">
      <span class="rag rag-${a.rag}"></span><span class="n">${esc(a.short||a.title)}</span>
      <span class="s">${a.owner?esc(person(a.owner).name):'unassigned'}</span>
      <span class="c">${icon('chevR',13)}</span></div>`).join('')||'<div class="tiny">Nothing matches this filter.</div>'}
  </div>`;
};
STRIP.confid=function(){

    <div class="bh-row">${icon('db',12)} Held for the operator<span class="v">${held}/${EVENTS.length}</span></div>
    <div class="bh-row">${icon('pin',12)} No location on the row<span class="v">${EVENTS.filter(e=>!e.zone).length}</span></div>
    <div class="bh-row">${icon('clock',12)} No end date anywhere<span class="v">${noHorizonEvents().length}</span></div>
    <div class="bh-row">${icon('user',12)} Source owner held<span class="v tone-red">0</span></div>
  </div>`;
};
STRIP.trends=function(){
  const wk=[0,1,2,3,4,5].map(w=>EVENTS.filter(e=>e.raised>=w*168&&e.raised<(w+1)*168).length).reverse();
  const mx=Math.max.apply(null,wk)||1;
  return `<div class="spanel" onclick="go('trends')">
    <div class="sh">Leading trends<span class="t">records raised</span></div>
    <div style="display:flex;align-items:flex-end;gap:5px;flex:1;min-height:0;margin-top:2px">
      ${wk.map((v,i)=>`<div style="flex:1;background:${i===wk.length-1?'var(--accent)':'var(--track)'};height:${Math.max(6,v/mx*100)}%;border-radius:3px 3px 0 0" title="${v} records"></div>`).join('')}</div>
    <div class="cr-ax"><span>6 weeks ago</span><span>this week</span></div>
  </div>`;
};

/* ====================================================== STATUS-TILE DRILL */
function openIndicator(k){
  const rh=registerHealth();
  if(k==='health'){
    openModal(mhead('Status tile','Barrier health')+
      `<div class="gapnote" style="margin-bottom:14px"><div class="gh">${icon('alert',12)}One stated assumption</div>
        The extract is a findings extract: it names only the <strong>${rh.named}</strong> safety-critical elements with something
        open against them. Mittelplate's register is assumed at <strong>${rh.n}</strong>, so the remaining <strong>${rh.implied}</strong>
        carry no open record and are counted healthy. One number from the operator replaces the assumption.</div>`+
      msec('The arithmetic',`<div class="mathbox">${
        [['Healthy',rh.healthy,100],['Degraded',rh.degraded,60],['Impaired',rh.impaired,20],['Not in service',rh.outOfService,0]]
        .map(r=>pre(r[0].padEnd(16,' ')+String(r[1]).padStart(3,' ')+' × '+String(r[2]).padStart(3,' ')+' = ')+`<b>${r[1]*r[2]}</b>`).join('<br>')}
        <br>${'─'.repeat(38)}<br>sum = <b>${rh.sum}</b> &nbsp; ÷ ${rh.n} elements = <b>${rh.index}%</b></div>`)+
      msec('The '+rh.named+' with a computed condition',rh.states.map(x=>`<div class="brow" onclick="closeModal();handleLink('barrier','${x.b.id}')">
        <span class="rag rag-${x.st.c==='watch'?'green':x.st.c}"></span><span class="n">${esc(x.b.name)}</span>
        <span class="s tone-${x.st.c==='watch'?'green':x.st.c}">${esc(x.st.w)}</span></div>`).join(''))+
      `<div class="rowbtns" style="margin-top:14px">
        <button class="btn sm" onclick="closeModal();go('barriers')">${icon('shield',12)}Open barrier health</button>
        <button class="btn sm" onclick="closeModal();openProv('register')">${icon('info',12)}Provenance</button>
        <button class="btn sm ghost" onclick="closeModal()">Close</button></div>`,'wide');
    return;
  }
  const sets={
    impaired:{t:'Impaired barriers',rows:BARRIERS.filter(b=>barrierState(b.id).key==='impaired'),kind:'barrier',
      note:'An open high-severity record with no compensating measure recorded in its status text.'},
    degraded:{t:'Degraded barriers',rows:BARRIERS.filter(b=>barrierState(b.id).key==='degraded'),kind:'barrier',
      note:'A high-severity record with a compensating measure recorded, or any open medium-severity record.'},
    overdue:{t:'Overdue exposure',rows:overdueEvents(),kind:'event',
      note:'Day counts are parsed out of the status free text. No register holds a structured end date, so a wording change at source drops a record out of this count.'},
    hotspots:{t:'Emerging hotspots',rows:hotspots(),kind:'hotspot',
      note:'A zone carrying '+STATE.prefs.thresholds.hotspot+' or more changed records inside '+windowLabel(STATE.prefs.window).toLowerCase()+'.'},
    actions:{t:'Open attention items',rows:ATTENTION.filter(a=>!a.done),kind:'attn',
      note:'Clarity attention items, not source-system actions. Each consolidates records from more than one register.'}
  };
  const S=sets[k];if(!S)return;
  let body='';
  if(S.kind==='barrier')body=S.rows.map(b=>{const st=barrierState(b.id);
    return `<div class="rel-item" onclick="closeModal();handleLink('barrier','${b.id}')">
      <span class="rag rag-${st.c==='watch'?'green':st.c}"></span><span class="rel-name">${esc(b.name)}</span>
      <span class="tiny">${st.n} record${st.n===1?'':'s'} · ${esc(st.events.map(e=>e.id).join(' '))}</span>
      <span class="rel-go">${icon('chevR',14)}</span></div>`;}).join('');
  if(S.kind==='event')body=S.rows.map(e=>{const h=horizon(e);
    return `<div class="evrow" style="cursor:pointer" onclick="closeModal();openEventModal('${e.id}')">
      <span class="evrow-ref" style="color:${KINDS[e.kind].color}">${esc(e.id)}</span>
      <span class="evrow-main"><span class="evrow-title">${esc(e.title)}</span>
        <span class="evrow-meta">${esc(SYSTEMS[e.system].n)} · ${esc(e.zone?zoneName(e.zone):'unallocated')} · ${esc(e.status)}</span></span>
      <span class="evrow-tail">${pill(Math.abs(h.d)+' days past','red')}</span></div>`;}).join('');
  if(S.kind==='hotspot')body=S.rows.length?S.rows.map(h=>`<div class="rel-item" onclick="closeModal();handleLink('zone','${h.zone}')">
      <span class="rag rag-amber"></span><span class="rel-name">${esc(zoneName(h.zone))}</span>
      <span class="tiny">${h.events.length} records · ${uniq(h.events.map(e=>e.system)).length} systems</span>
      <span class="rel-go">${icon('chevR',14)}</span></div>`).join('')
    :`<div class="empty-note">No zone reaches ${STATE.prefs.thresholds.hotspot} changed records inside this window.</div>`;
  if(S.kind==='attn')body=S.rows.map(a=>`<div class="rel-item" onclick="closeModal();openAttention('${a.id}')">
      <span class="rag rag-${a.rag}"></span><span class="rel-name">${esc(a.short||a.title)}</span>
      <span class="tiny">${a.owner?esc(person(a.owner).name)+(a.ack?' · acknowledged':' · awaiting'):'unassigned'}</span>
      <span class="rel-go">${icon('chevR',14)}</span></div>`).join('');
  openModal(mhead('Status tile',S.t)+
    msec('How it is counted',`<div class="mbody">${esc(S.note)}</div>`)+
    msec(S.rows.length+' item'+(S.rows.length===1?'':'s'),body||'<div class="empty-note">Nothing matches.</div>')+
    `<button class="btn sm ghost" onclick="closeModal()">Close</button>`,'wide');
}

/* Ask Clarity opens with the selected issue already in context */
function askAbout(id){
  const a=attnById(id);if(!a)return;
  closeModal();
  STATE.thread.push({me:false,a:{conc:'What do you want to know about the '+(a.short||a.title).toLowerCase()+' issue?',
    body:'<p>'+esc(a.why)+'</p><p style="margin-top:8px;color:var(--ink-3)">'+
      attnEvents(a).length+' records across '+uniq(attnEvents(a).map(e=>e.system)).length+' systems · '+
      esc(a.area)+' · attention owner '+(a.owner?esc(person(a.owner).name):'unassigned')+'</p>',
    links:[['Who owns the response?',"ask('Who owns the response to the "+(a.short||a.title).toLowerCase()+"?')"],
           ['What is increasing loss-of-containment exposure?',"ask('What is increasing loss-of-containment exposure?')"],
           ['What data is missing from this assessment?',"ask('What data is missing from this assessment?')"]]}});
  go('ask');
}

<script>
"use strict";
/* ============================================================================
   PERSONALISE MY DAILY VIEW — the only renderer for the preference engine.
   Four columns, a collapsed band of secondary controls, one action bar. Every
   control drives the same engine the rest of the app reads.
   ========================================================================== */
STATE.monMore=false;STATE.ruleMore=false;STATE.moreOpen=false;
const MON_PRIMARY=['bar','sece','ora','defer','integ','pi','act','hot'];
const RULE_PRIMARY=['new','repeat','redamber','multi','overdue','cumcon'];

function prefPanel(){

    <div class="pers-head">
      <div>
        <h2>Personalise my daily view</h2>
        <p>Choose the scope, conditions and information Clarity should prioritise when you sign in.</p>
      </div>
      <div class="pers-chips">

        ${prefChips()}
        <span style="width:1px;height:18px;background:var(--line);margin:0 3px"></span>
        <button class="btn sm ghost" onclick="loadSavedView(STATE.defaultView)">${icon('refresh',13)}Reset to my default</button>
        <button class="btn sm ghost" onclick="STATE.prefOpen=!STATE.prefOpen;render()">
          ${icon(STATE.prefOpen?'arrowUp':'chevD',13)}${STATE.prefOpen?'Collapse':'Expand'}</button>
      </div>
    </div>
    ${STATE.prefOpen?prefBody():''}
  </div>`;
}
/* the live preview recounts without touching the canvas above it */
function renderPrefBody(){
  const el=document.querySelector('.pers');
  if(!el){render();return;}
  el.outerHTML=prefPanel();
}
function prefBody(){
  const d=draft();
  return `<div class="pers-cols">${pScope(d)}${pMonitor(d)}${pRules(d)}${pPreview(d)}</div>
    <div class="pers-more ${STATE.moreOpen?'open':''}">
      <button class="more-link" onclick="STATE.moreOpen=!STATE.moreOpen;renderPrefBody()">${icon('chevR',12)}
        ${STATE.moreOpen?'Hide':'Show'} dashboard content, thresholds and source systems</button>
      <div class="pers-more-b">${pComponents(d)}${pThresholds(d)}${pSystems(d)}</div>
    </div>
    ${pBar(d)}`;
}
const pSel=(label,ic,opts,onchange)=>`<div class="selrow">
  <span class="i">${icon(ic,14)}</span><span class="l">${esc(label)}</span>
  <span class="selbox"><select onchange="${onchange}">${opts}</select><span class="cv">${icon('chevD',13)}</span></span></div>`;
const pCk=(on,label,onclick,dim,extra,full)=>`<div class="ck ${on?'on':''} ${dim?'dim':''}" onclick="${onclick}" title="${esc(full||label)}">
  <span class="bx">${icon('check',9)}</span>${extra||''}<span class="n">${esc(label)}</span></div>`;

function pScope(d){
  const cap=HIERARCHY.kids[0];
  const zoneSel=d.scope.filter(s=>ZONES.some(z=>z.id===s));
  const plats=cap.kids.filter(x=>d.scope.indexOf(x.id)>-1).map(x=>x.id).join('+');
  const structOpts=[['topsides+support+shared','All areas'],['topsides+support','Topsides + Process Area'],['topsides','Topsides only'],['support','Process Area only'],['shared','Bridge & jacket']]

function prefChips(){
  const p=STATE.prefs,out=[];
  const chip=(t,rm)=>`<span class="chip${rm?'':' locked'}"><b>${esc(t)}</b>${rm?`<button class="x" title="Remove" onclick="${rm}">×</button>`:''}</span>`;
  out.push(chip(assetLabel().replace(/ —.*$/,'').replace('Mittelplate','Mittelplate')));
  const kids=HIERARCHY.kids[0].kids.filter(x=>p.scope.indexOf(x.id)>-1);
  const pl=kids.map(x=>x.n.replace('Bridge & jacket','Bridge'));
  if(pl.length&&pl.length<3)out.push(chip(pl.join(' + '),"removeChip('scope','"+kids[0].id+"')"));
  else if(pl.length)out.push(chip('Topsides + Process Area + Bridge'));
  const sev=p.thresholds.minSev;
  out.push(chip(sev==='high'?'Red only':sev==='med'?'Red + Amber':'All severities'));
  out.push(chip(windowLabel(p.window)));
  const mn={ora:'ORA',defer:'Deferrals',dlr:'DLR',integ:'Integrity',scwo:'SC WOs',pi:'PI',act:'Actions'};
  const mon=p.monitor.filter(m=>mn[m]).map(m=>mn[m]);
  if(mon.length)out.push(chip(mon.slice(0,4).join(' + ')+(mon.length>4?' +'+(mon.length-4):''),'clearMonitors()'));
  if(p.monitor.indexOf('cum')>-1)out.push(chip('Cumulative exposure on',"removeChip('monitor','cum')"));
  const off=Object.keys(SYSTEMS).filter(s=>SYSTEMS[s].s!=='available'&&p.systems.indexOf(s)<0);
  if(off.length)out.push(`<span class="chip" style="color:var(--amber)"><b>${off.length} source${off.length===1?'':'s'} excluded</b><button class="x" onclick="restoreSystems()">×</button></span>`);
  return out.join('');
}

<script>
"use strict";
/* ============================================================================
   SHARED RENDERERS — the change feed, the consolidated queue and the Ask

/* ------------------------------------------------------- what changed */
function feedRow(e){
  const b=barrierFor(e), st=b?barrierState(b.id):null, before=b?barrierStateBefore(b.id):null;
  const a=attnForEvent(e.id);
  const closed=e.closedAt!=null;
  const eff=closed
    ? 'Closing this record improved <b>'+esc(b?b.name:'the barrier')+'</b> from <b>'+esc(before?before.w:'—')+'</b> to <b>'+esc(st?st.w:'—')+'</b>.'
    : (b? 'Acts against <b>'+esc(b.name)+'</b>, now <b>'+esc(st.w)+'</b>'+(before&&before.key!==st.key?' — was <b>'+esc(before.w)+'</b> before this window':'')+'.' : 'No SECE on the row, so it joins no barrier.');
  const cum=STRANDS.filter(s=>STATE.strandsOff.indexOf(s.id)<0&&s.ev.indexOf(e.id)>-1);
  return `<div class="fr ${STATE.seen[e.id]?'seen':''}" onclick="openEventModal('${e.id}')">
    <span class="fr-k" style="background:${closed?'var(--green)':KINDS[e.kind].color};${closed?'color:#fff':''}">${closed?'✓':KINDS[e.kind].glyph}</span>
    <span class="fr-m">
      <span class="fr-l1"><span class="fr-ref">${esc(e.id)}</span>·<span>${esc(SYSTEMS[e.system].n)}</span>·
        <span>${esc(stamp(e.changedAt))}</span>·<span>${esc(ago(e.changedHrs))}</span>
        ${e.owner?`<span>· source owner ${esc(person(e.owner).name)}</span>`:''}</span>
      <span class="fr-t">${esc(e.title)}</span>
      <span class="fr-e">${closed?'':'<b>'+esc(e.zone?zoneName(e.zone):'No location on the row')+'</b> · '}${esc(e.status)}<br>${eff}
        ${cum.length?'<br>Contributes to cumulative exposure through <b>'+cum.map(s=>esc(s.n.toLowerCase())).join('</b> and <b>')+'</b>.':''}
        ${a?'<br>Part of attention item <b>'+esc(a.title)+'</b> — '+(a.owner?'owner '+esc(person(a.owner).name):'<span style="color:var(--amber)">no attention owner</span>')+'.':''}</span>
    </span>
    <span class="fr-tail">
      ${!STATE.seen[e.id]?'<span class="newflag">NEW</span>':''}
      <span class="heldflag ${e.held?'held':'shape'}">${e.held?'held':'shape only'}</span>
      ${pill(SEV_WORD[e.sev],e.sev==='high'?'red':e.sev==='med'?'amber':'green')}
    </span></div>`;
}
function setWindow(w){STATE.prefs.window=+w;persist();if(STAGE.ok)STAGE.paint();render();}

/* ------------------------------------------------------------ ask card */
const ASK_SUGGEST=[
 'What should I be concerned about today?',
 'Which critical barriers have deteriorated this week?',
 'Where do Tier 3 weakness and Tier 4 assurance gaps coincide?',
 'Which degraded SECEs affect other dependent SECEs?',
 'Are any dependent SECEs already impaired?',

 'Which barriers are deteriorating despite assurance being on target?'
];

/* ============================================================================

   ========================================================================== */
function queueTable(list,compact){
  if(!list.length)return`<div class="panel"><div class="empty-note">Nothing matches this filter.</div></div>`;
  return `<div class="aq-wrap ${compact?'':'full'}"><table class="aq"><thead><tr>
    <th>Attention item</th><th>RAG</th><th>Why it matters</th><th>Attention owner</th>
    ${compact?'':'<th>Source owners</th><th>Assigned</th>'}<th>Due</th><th>Ack</th>
    ${compact?'':'<th>Impact</th><th>Systems</th><th>Confidence</th>'}<th>Recommended next step</th><th></th></tr></thead><tbody>
    ${list.map(a=>{
      const ev=attnEvents(a), sys=uniq(ev.map(e=>e.system)), src=uniq(ev.map(e=>e.owner).filter(Boolean));
      const bars=uniq(ev.map(e=>(barrierFor(e)||{}).id).filter(Boolean));
      const conf=Math.round(a._f?a._f.confid:0);
      return `<tr>
        <td><div class="t-main">${esc(a.title)}</div><div class="t-sub">${esc(a.area)} · ${ev.length} record${ev.length===1?'':'s'}</div></td>
        <td><span class="rag rag-${a.rag}"></span></td>
        <td style="max-width:280px"><div class="t-sub" style="margin:0">${esc(a.why)}</div></td>
        <td><select class="ownsel" onchange="queueSetOwner('${a.id}',this.value)">
            <option value="">— Unassigned —</option>
            <option value="${ME}" ${a.owner===ME?'selected':''}>${esc(PEOPLE[ME].name)} (me)</option>
            ${ASSIGNABLE.map(p=>`<option value="${p}" ${a.owner===p?'selected':''}>${esc(person(p).name)}</option>`).join('')}
          </select></td>
        ${compact?'':`<td>${src.map(o=>avatar(o,'sm')).join(' ')}<div class="t-sub">${src.map(o=>esc(person(o).name)).join(', ')||'—'}</div></td>
        <td class="t-sub">${a.assignedAt?esc(stamp(a.assignedAt)):'—'}</td>`}
        <td class="t-sub">${a.due?esc(dueLabel(a.due)):'—'}</td>
        <td>${a.ack?pill('Yes','green'):a.owner?pill('Awaiting','amber'):pill('—','grey')}</td>
        ${compact?'':`<td class="t-sub" style="min-width:180px">${bars.map(b=>esc(barrierById(b).name)).join(' · ')||'—'}<br><span class="tiny">${esc(zoneName(a.zone))}</span></td>
        <td class="t-sub" style="min-width:130px">${sys.map(s=>esc(SYSTEMS[s].n)).join(' · ')}</td>
        <td class="num"><span class="mono">${conf}%</span></td>`}
        <td style="max-width:250px"><div class="t-sub" style="margin:0">${esc(a.next)}</div></td>
        <td><button class="btn sm ghost" onclick="openAttention('${a.id}')">${icon('chevR',13)}</button></td>
      </tr>`;}).join('')}
  </tbody></table></div>`;
}
function queueSetOwner(id,v){
  if(!v){removeOwner(id);return;}
  if(v===ME){takeOwnership(id);return;}
  const a=attnById(id);
  assignColleague(id,v,a.instruction,a.due?a.due.toISOString():null);
}

function allocate(id,z){
  if(!z)return;

  e.zone=z;e.confirmed=false;e.tier=4;

function bowtieSVG(){
  const pre=BARRIERS.filter(b=>b.side==='prevent'),mit=BARRIERS.filter(b=>b.side==='mitigate');
  const W=1180,rowH=62,H=Math.max(THREATS.length,CONSEQUENCES.length,pre.length,mit.length)*rowH+140;
  const cy=H/2, colT=20,colP=250,colTop=W/2-70,colM=W-460,colC=W-210;
  const colour=k=>k==='impaired'?'var(--red)':k==='degraded'?'var(--amber)':k==='watch'?'#2f8f66':'var(--green)';
  let s='';
  function node(b,x,y,w){
    const st=barrierState(b.id);
    return `<g class="bt-node" data-b="${b.id}" onclick="openBarrier('${b.id}')">
      <rect x="${x}" y="${y-20}" width="${w}" height="40" rx="8" fill="${colour(st.key)}" opacity="${st.key==='intact'?0.75:0.95}"></rect>
      <text class="bt-lab" x="${x+w/2}" y="${y-3}" text-anchor="middle" fill="#fff" style="font-weight:700;font-size:11.5px">${esc(b.short||b.name)}</text>
      <text class="bt-lab" x="${x+w/2}" y="${y+12}" text-anchor="middle" fill="#fff" opacity=".9" style="font-size:10px">${esc(st.w)} · ${st.n} record${st.n===1?'':'s'}</text>
    </g>`;
  }
  const rowY=(n,i)=>cy+(i-(n-1)/2)*rowH;
  THREATS.forEach((t,i)=>{
    const y=rowY(THREATS.length,i);
    s+=`<path class="bt-conn" d="M${colT+200} ${y} C${colP-40} ${y} ${colP-40} ${y} ${colP} ${y}"/>`;
    s+=`<path class="bt-conn" d="M${colP+170} ${y} C${colTop-40} ${y} ${colTop-40} ${cy} ${colTop} ${cy}"/>`;
    s+=`<rect x="${colT}" y="${y-17}" width="200" height="34" rx="7" fill="var(--card-2)" stroke="var(--line)"/>
        <text class="bt-lab" x="${colT+100}" y="${y+4}" text-anchor="middle">${esc(t.label.length>30?t.label.slice(0,29)+'…':t.label)}</text>`;
  });
  pre.forEach((b,i)=>{s+=node(b,colP,rowY(pre.length,i),170);});
  mit.forEach((b,i)=>{s+=node(b,colM,rowY(mit.length,i),170);});
  CONSEQUENCES.forEach((c,i)=>{
    const y=rowY(CONSEQUENCES.length,i);
    s+=`<path class="bt-conn" d="M${colTop+140} ${cy} C${colM-40} ${cy} ${colM-40} ${y} ${colM} ${y}"/>`;
    s+=`<path class="bt-conn" d="M${colM+170} ${y} C${colC-30} ${y} ${colC-30} ${y} ${colC} ${y}"/>`;
    s+=`<rect x="${colC}" y="${y-17}" width="195" height="34" rx="7" fill="var(--card-2)" stroke="var(--line)"/>
        <text class="bt-lab" x="${colC+97}" y="${y+4}" text-anchor="middle">${esc(c.label.length>30?c.label.slice(0,29)+'…':c.label)}</text>`;
  });
  s+=`<rect x="${colTop}" y="${cy-42}" width="140" height="84" rx="12" fill="var(--accent)"/>
      <text x="${colTop+70}" y="${cy-10}" text-anchor="middle" fill="#fff" style="font-size:10px;font-weight:800;letter-spacing:.08em">TOP EVENT</text>
      <text x="${colTop+70}" y="${cy+8}" text-anchor="middle" fill="#fff" style="font-size:11px;font-weight:700">Loss of</text>
      <text x="${colTop+70}" y="${cy+23}" text-anchor="middle" fill="#fff" style="font-size:11px;font-weight:700">containment</text>`;
  s+=`<text class="bt-side-title" x="${colT}" y="34">Threats</text>
      <text class="bt-side-title" x="${colP}" y="34">Prevention barriers</text>
      <text class="bt-side-title" x="${colM}" y="34">Mitigation barriers</text>
      <text class="bt-side-title" x="${colC}" y="34">Consequences</text>`;
  return `<svg class="bowtie-svg" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
function barrierMatrix(){
  const cols=[{id:'topsides',n:'Topsides'},{id:'support',n:'Process deck'},{id:'shared',n:'Bridge & jacket'},
              {id:'none',n:'Unallocated'},{id:'all',n:'Mittelplate — all'}];

    :c==='none'?openEvents().filter(e=>!e.zone)

function runway(){
  const rows=openEvents().map(e=>({e:e,h:horizon(e)})).sort((a,b)=>{
    if(!a.h&&!b.h)return 0;if(!a.h)return 1;if(!b.h)return -1;return a.h.d-b.h.d;});
  const lo=-40,hi=100,W=1080,left=250,right=54,rh=26,top=44;
  const H=top+rows.length*rh+34;
  const X=d=>left+((clamp(d,lo,hi)-lo)/(hi-lo))*(W-left-right);
  let s=`<line class="rw-grid" x1="${left}" y1="${top-10}" x2="${W-right}" y2="${top-10}"/>`;
  [-30,0,30,60,90].forEach(d=>{
    s+=`<line class="rw-grid" x1="${X(d)}" y1="${top-10}" x2="${X(d)}" y2="${H-26}"/>
        <text class="rw-ref" x="${X(d)}" y="${top-16}" text-anchor="middle">${d>0?'+'+d:d} d</text>`;});
  s+=`<line class="rw-now" x1="${X(0)}" y1="${top-10}" x2="${X(0)}" y2="${H-26}"/>
      <text class="rw-ref" x="${X(0)}" y="${H-12}" text-anchor="middle" fill="var(--accent-2)">today</text>`;
  rows.forEach((r,i)=>{
    const y=top+i*rh+10,e=r.e;
    s+=`<text class="rw-ref" x="0" y="${y+4}">${esc(e.id)}</text>
        <text class="rw-lab" x="86" y="${y+4}">${esc(e.title.length>26?e.title.slice(0,25)+'…':e.title)}</text>`;
    if(r.h){
      const x0=Math.min(X(0),X(r.h.d)),x1=Math.max(X(0),X(r.h.d));
      s+=`<rect x="${x0}" y="${y-6}" width="${Math.max(3,x1-x0)}" height="12" rx="6" fill="${r.h.d<0?'var(--red)':r.h.d<=14?'var(--amber)':'var(--green)'}" opacity=".9"/>
          <text class="rw-ref" x="${x1+6}" y="${y+4}">${r.h.d<0?Math.abs(r.h.d)+' d past':r.h.d+' d'}</text>`;
    }else{
      s+=`<rect x="${left}" y="${y-6}" width="${W-left-right}" height="12" rx="6" fill="var(--track)" opacity=".7"/>
          <text class="rw-ref" x="${left+10}" y="${y+4}" fill="var(--ink-3)">no end date held anywhere — which is itself the finding</text>`;
    }
  });
  return `<svg class="runway" viewBox="0 0 ${W} ${H}" style="min-width:860px">${s}</svg>`;
}

  hSec('Barrier-health matrix','Assets across, barriers down. Click a cell to open the barrier.')+
  `<div class="panel" style="overflow-x:auto">${barrierMatrix()}</div>`+
  hSec('The barrier model','One top event. Click any barrier for its records, its SECEs and its owner.')+
  `<div class="bowtie-wrap">
     <div class="bt-legend-row"><span class="lg"><span class="rag rag-red"></span>Impaired</span>
       <span class="lg"><span class="rag rag-amber"></span>Degraded</span>
       <span class="lg"><span class="rag rag-green"></span>Watch / intact</span>
       <span style="margin-left:auto">Top event — ${esc(TOP_EVENT)}</span></div>
     ${bowtieSVG()}
     <div class="bt-hint">Threats and consequences are a standard hydrocarbon-release model, not the operator’s own. They need confirming against the safety case.</div>
   </div>`+
  hSec('SECE condition','The ten safety-critical elements the three registers name between them.')+
  `<div class="panel"><div class="crit-list">
    ${BARRIERS.map(b=>{const st=barrierState(b.id),a=ATTENTION.find(x=>attnEvents(x).some(e=>b.sece.indexOf(e.sece)>-1));
      return `<div class="crit-row">
        <div class="crit-name"><span class="rag rag-${st.c==='watch'?'green':st.c}"></span>${esc(b.sece[0])}</div>
        <div class="crit-evidence">${st.n?esc(st.events.map(e=>e.id).join(' · ')):'No open records'}
          ${a?'<br><span class="tiny">attention owner — '+(a.owner?esc(person(a.owner).name):'<span style="color:var(--amber)">unassigned</span>')+'</span>':''}</div>
        <div class="crit-status ${st.c==='watch'?'green':st.c}">${esc(st.w)}</div>
        <button class="btn sm ghost" onclick="openBarrier('${b.id}')">${icon('chevR',13)}</button></div>`;}).join('')}
  </div></div>`+
  hSec('Performance standards')+
  `<div class="gapnote"><div class="gh">${icon('alert',12)}No source</div>
    No performance-standard register was supplied with the material supplied, so performance-standard exceptions cannot be computed.
    Clarity models them where they exist — an extract of the performance standards and their last verification result would populate this
    section and would also sharpen the barrier condition rule above, which is currently doing the work of both.</div>`+
  hSec('Expiry runway','When each open record stops being acceptable. A flat grey bar means no end date is recorded anywhere.')+
  `<div class="panel" style="overflow-x:auto">${runway()}</div>`+
  viewFoot();
};
function openBarrier(id){
  const b=barrierById(id),st=barrierState(id),before=barrierStateBefore(id);
  const threats=THREATS.filter(t=>t.bars.indexOf(id)>-1),cons=CONSEQUENCES.filter(c=>c.bars.indexOf(id)>-1);
  const attn=ATTENTION.filter(a=>attnEvents(a).some(e=>b.sece.indexOf(e.sece)>-1));
  openModal(mhead((b.side==='prevent'?'Prevention barrier':'Mitigation barrier'),b.name)+
    `<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
      <span class="crit-status ${st.c==='watch'?'green':st.c}" style="font-size:12px;padding:6px 14px">${esc(st.w)}</span>
      ${before.key!==st.key?`<span class="tiny">was <strong>${esc(before.w)}</strong> before this window opened</span>`:''}
      ${b.added?pill('Clarity-added barrier','amber'):''}</div>`+
    (b.added?`<div class="gapnote" style="margin-bottom:14px"><div class="gh">${icon('alert',12)}Not in the supplied register</div>
      Emergency and essential power is a barrier Clarity has added so the power-generation records have somewhere to act. It is not in the
      ten-row Mittelplate extract. If the operator’s SECE list carries an equivalent, it should replace this; if it does not, that is itself a finding.</div>`:'')+
    msec('How this condition was reached',
      `<div class="mbody">SECE <strong>${esc(b.sece.join(', '))}</strong> · ${st.n} open record${st.n===1?'':'s'}.<br>
       ${st.key==='impaired'?'An open high-severity record carries no compensating measure in its status text.'
        :st.key==='degraded'?'Either a high-severity record with a compensating measure recorded, or an open medium-severity record.'
        :st.key==='watch'?'Only low-severity records are open.':'Nothing is open against this SECE.'}
       ${provI('condition')}</div>`)+
    msec('Open records',st.n?st.events.map(e=>`<div class="evrow" style="cursor:pointer" onclick="closeModal();openEventModal('${e.id}')">
        <span class="evrow-ref" style="color:${KINDS[e.kind].color}">${esc(e.id)}</span>
        <span class="evrow-main"><span class="evrow-title">${esc(e.title)}</span>
          <span class="evrow-meta">${esc(SYSTEMS[e.system].n)} · ${esc(e.zone?zoneName(e.zone):'unallocated')} · ${esc(e.status)}
            ${e.compensated?'· compensating measure recorded':'· <span class="tone-red">no compensating measure</span>'}</span></span>
        <span class="evrow-tail">${pill(SEV_WORD[e.sev],e.sev==='high'?'red':e.sev==='med'?'amber':'green')}</span></div>`).join('')
      :'<div class="empty-note">Nothing open.</div>')+
    msec('On the bowtie',`<div class="mbody">
      ${threats.length?'Sits against threat'+(threats.length>1?'s':'')+': <strong>'+threats.map(t=>esc(t.label)).join('</strong>, <strong>')+'</strong>.':''}
      ${cons.length?(threats.length?'<br>':'')+'Sits against consequence'+(cons.length>1?'s':'')+': <strong>'+cons.map(c=>esc(c.label)).join('</strong>, <strong>')+'</strong>.':''}</div>`)+
    (attn.length?msec('Attention items touching this barrier',attn.map(a=>`<div class="rel-item" onclick="closeModal();openAttention('${a.id}')">
        <span class="rag rag-${a.rag}"></span><span class="rel-name">${esc(a.title)}</span>
        <span class="tiny">${a.owner?esc(person(a.owner).name):'unassigned'}</span><span class="rel-go">${icon('chevR',14)}</span></div>`).join('')):'')+
    `<div class="rowbtns" style="margin-top:14px">
      ${st.events[0]&&st.events[0].zone?`<button class="btn sm" onclick="closeModal();handleLink('zone','${st.events[0].zone}')">${icon('pin',12)}Show on asset</button>`:''}
      <button class="btn sm ghost" onclick="closeModal()">Close</button></div>`,'wide');
}

<script>
"use strict";
/* ========================================================= CUMULATIVE RISK */
V.cumulative=function(){
  /* CUMULATIVE RISK AWARENESS.
     Clarity does not calculate cumulative risk and shows no score. This view
     answers one question: where are individually managed weaknesses beginning
     to converge? Everything below is a count, and every count opens its
     records. */
  const groups=convergence();
  return secHead('Cumulative risk awareness','Where are individually managed weaknesses beginning to converge?',
    'Not a score. Clarity reports where independently managed conditions are landing on the same place, the same barrier and the same hazard at the same time.'+provI('convergence'))+
  `<div class="gapnote ok" style="margin-bottom:14px"><div class="gh">${icon('info',12)}What this is, and what it is not</div>
    <strong>Clarity is not calculating cumulative risk. It is bringing together the evidence that may
    indicate cumulative risk is building.</strong> The competent person makes the risk judgement.
    Each of these conditions is already being managed through its own process. What Clarity adds is the observation that
    they are currently converging — and the evidence behind that observation.</div>`+
  (groups.length?groups.map((g,gi)=>{
    const lines=convergenceLines(g);
    const mahs=uniq(g.mahs).map(mahById).filter(Boolean);
    return `<div class="cv-g">
      <div class="cv-h">
        <div class="cv-hz">
          <div class="cv-zn">${esc(g.name.toUpperCase())}</div>
          <div class="cv-zs"><b>${g.n}</b> related conditions currently active ·
            ${numw(g.kinds)} different register${g.kinds===1?'':'s'} ·
            ${numw(g.bars.length)} critical barrier${g.bars.length===1?'':'s'}</div>
        </div>
        <button class="obtn cy" onclick="handleLink('zone','${g.zone}')">${icon('pin',12)}<span>Show on the asset</span></button>
      </div>
      <div class="cv-lines">${lines.map(l=>
        `<div class="cv-l"><span class="cra-tag cra-${l.k}">${l.tag}</span><span>${esc(l.t)}</span></div>`).join('')}</div>
      <div class="cv-read">
        <div class="cv-rl">Evidence convergence detected</div>
        <div class="cv-rs">Individually these conditions are being managed through their respective processes.
          Clarity has identified that they are currently converging around the same operating area and the
          associated major-hazard barriers${mahs.length?' — '+mahs.map(m=>esc(m.short)).join(' and '):''}.</div>
        <div class="cv-act">
          <span class="cv-rec">${icon('alert',12)} Management attention recommended</span>
          <button class="whybtn" onclick="openConvWhy('${g.zone}')">${icon('info',12)} Why am I seeing this?</button>
        </div>
      </div>
      <div class="cv-bars">${g.das.map(d=>
        `<button class="cv-b" onclick="go('dual','${d.bar.id}')">
           <span class="cv-bn">${esc(d.bar.short)}</span>
           <span class="cv-bt">T3 <b class="tone-${KEYC[d.t3.key]}">${KEYW[d.t3.key]}</b> ·
                               T4 <b class="tone-${KEYC[d.t4.key]}">${KEYW[d.t4.key]}</b></span>
           <span class="asr-p asr-${d.c}">${esc(d.w)}</span>
         </button>`).join('')}</div>
    </div>`;}).join('')
   :`<div class="spanel" style="cursor:default">No area currently shows three or more open conditions
      from different registers acting against two or more critical barriers.</div>`)+
  stdFoot();
};

function openConvWhy(zone){
  const g=convergence().find(x=>x.zone===zone);
  if(!g)return;
  const steps=[];
  g.das.filter(d=>d.t3.key==='weakening').forEach(d=>
    steps.push('<strong>'+esc(d.bar.name)+'</strong> is a critical barrier, and its Tier 3 barrier performance has deteriorated.'));
  g.das.filter(d=>d.t4.key==='weakening').forEach(d=>
    steps.push('Tier 4 assurance performance for <strong>'+esc(d.bar.name)+'</strong> is below target — '+d.t4.plan+'% against '+d.t4.target+'%.'));
  if(g.oras)steps.push(numw(g.oras)+' active operational risk assessment'+(g.oras===1?'':'s')+' affect'+(g.oras===1?'s':'')+' the same operating area.');
  if(g.defs)steps.push(numw(g.defs)+' overdue or deferred maintenance activit'+(g.defs===1?'y':'ies')+' affect'+(g.defs===1?'s':'')+' associated equipment.');
  if(g.dlrs)steps.push(numw(g.dlrs)+' temporary or defined-life repair'+(g.dlrs===1?'':'s')+' remain'+(g.dlrs===1?'s':'')+' open.');
  const oldest=Math.max.apply(null,g.list.map(e=>e.raised));
  steps.push('These conditions have persisted concurrently for '+numw(Math.max(1,Math.round(oldest/24)))+' days.');
  const sys=uniq(g.list.map(e=>e.system));
  openModal(mhead('Why Clarity highlighted this',g.name)+
    msec('What I noticed',`<ol class="whyol">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>`)+
    msec('Why it matters',`<div class="mbody">Each of these is being managed through its own process, and none of them
      individually asks for a decision. They are shown together because they are currently landing on the same
      operating area and the same major-hazard barriers at the same time. Clarity is not asserting that the combination
      is quantifiably worse — it is surfacing the evidence so that judgement can be made by someone who can make it.</div>`)+
    msec('What evidence supports it',
      `<div class="mbody"><strong>${g.n}</strong> evidence records across <strong>${sys.length}</strong> source
        system${sys.length===1?'':'s'} — ${sys.map(x=>esc(SYSTEMS[x].n)).join(', ')}.</div>
       <div class="da-rel" style="margin-top:10px">${g.list.map(e=>`
         <button class="da-row" onclick="closeModal();openEventModal('${e.id}')">
           <span class="kb kb-${e.kind}">${KINDS[e.kind].label}</span>
           <span class="da-rt"><b>${esc(e.title)}</b><i>${esc(e.status)}</i></span>
           <span class="sevdot sev-${e.sev}"></span>
         </button>`).join('')}</div>`));
}

}
function openStrand(id){

      With every strand on, the combined figure is lifted 32% above the quadratic mean of the two individual positions;
      this strand is worth ${(s.w*0.32).toFixed(1)} percentage points of that lift.</div>`)+
    msec('Records that evidence it',s.ev.map(eid=>{const e=eventById(eid);
      return `<div class="evrow" style="cursor:pointer" onclick="closeModal();openEventModal('${eid}')">
        <span class="evrow-ref" style="color:${KINDS[e.kind].color}">${esc(e.id)}</span>
        <span class="evrow-main"><span class="evrow-title">${esc(e.title)}</span>
          <span class="evrow-meta">${esc(SYSTEMS[e.system].n)} · ${esc(e.zone?zoneName(e.zone):'unallocated')} · ${esc(e.status)}</span></span></div>`;}).join(''))+
    `<div class="rowbtns"><button class="btn sm" onclick="closeModal();toggleStrand('${id}')">${STATE.strandsOff.indexOf(id)<0?'Switch this strand off':'Switch this strand on'}</button>
      <button class="btn sm ghost" onclick="closeModal()">Close</button></div>`,'wide');
}

/* ====================================================== ACTIONS & DECISIONS */

    <div class="panel-head"><h3><span class="rag rag-${a.rag}"></span> ${esc(a.title)}</h3>
