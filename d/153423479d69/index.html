<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarity — Operational Intelligence Hub · Mittelplate</title>
<!-- ============================================================================
     CLARITY OPERATIONAL INTELLIGENCE HUB — DEMONSTRATION ASSET

     An intelligent front door over the Clarity platform. It does not replace
     Clarity: the barrier model, SECEs, performance standards, KPIs, actions,
     ORAs and source data remain underneath and are reachable by drill-down
     from anything on screen.

     Process safety assurance structured around the principles of IOGP 456 and
     API RP 754. Clarity is not certified, approved or formally compliant with
     either standard and no part of either is reproduced here.

     THE ASSET VISUAL IS ILLUSTRATIVE. The central image is an anonymous
     demonstration asset. The seven areas marked on it are positions on the
     picture only — they do not identify the location of any equipment, SECE
     or barrier on the installation shown, and nothing in this build claims
     that they do. There is no 3D model and no engineering data behind it.

     All operational data — conditions, dates, owners, quantities and the
     dependency conditions layered over the areas — is fictional demonstration
     content.

     Illustrative demonstration data — not Harbour operational data.
     ========================================================================= -->
<style>
/* ============================================================================
   CLARITY OPERATIONS HUB — DESIGN SYSTEM
   Current Major Accident Hazard & Process Safety Position.
   Clarity operational risk information layer. Dark-industrial by default.
   Sales demonstration — illustrative COMAH data only.
   ========================================================================== */
:root{
  /* ---- DARK (default) ---- */
  --accent:#3f6fe0; --accent-soft:#5a86ee; --accent-2:#82a7ff;
  --brand:#5a86ee;
  --red:#e35b47; --amber:#e0a63a; --green:#33b07c; --grey:#8b97a2;
  --ink:#eef2f6; --ink-2:#b9c4ce; --ink-3:#8593a0;
  --line:#243039; --line-2:#19222b; --canvas:#080d12; --card:#111922; --card-2:#0d141b; --track:#1c2530;
  --rail-bg:#0a1723; --rail-bg-2:#060e17; --rail-txt:#c4d2dd; --rail-txt-2:#6f8496; --rail-line:#16303f;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 2px 12px rgba(0,0,0,.42);
  --shadow-lg:0 12px 38px rgba(0,0,0,.55);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --accent:#2a52c9; --accent-soft:#3a67df; --accent-2:#5a86ee;
  --brand:#2a52c9;
  --red:#d24b3a; --amber:#c98a1e; --green:#2f9e6b; --grey:#8b97a2;
  --ink:#0f1720; --ink-2:#3a464f; --ink-3:#6b7883;
  --line:#e4e9ee; --line-2:#eef1f4; --canvas:#eef2f6; --card:#fff; --card-2:#f7f9fb; --track:#eceff2;
  --rail-bg:#0c2033; --rail-bg-2:#081827; --rail-txt:#c4d2dd; --rail-txt-2:#708698; --rail-line:#173248;
  --shadow-sm:0 1px 2px rgba(16,22,28,.05),0 1px 3px rgba(16,22,28,.04);
  --shadow-md:0 2px 8px rgba(16,22,28,.06),0 8px 24px rgba(16,22,28,.05);
  --shadow-lg:0 8px 30px rgba(16,22,28,.12);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.012em;}
button{font-family:inherit;cursor:pointer;}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent);}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-columns:62px 1fr;height:100vh;overflow:hidden;}

/* ---------- icon rail ---------- */
.iconrail{background:linear-gradient(180deg,var(--rail-bg),var(--rail-bg-2));border-right:1px solid var(--rail-line);display:flex;flex-direction:column;align-items:center;padding:12px 0 14px;gap:2px;height:100vh;overflow-y:auto;}
.iconrail::-webkit-scrollbar{width:0;}
.rail-brand{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--accent));color:#fff;margin-bottom:12px;flex:none;box-shadow:0 2px 12px rgba(0,0,0,.5);}
.rail-nav{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;width:100%;}
.rail-foot{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:8px;padding-top:10px;border-top:1px solid var(--rail-line);width:42px;}
.rail-btn{position:relative;width:42px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--rail-txt-2);background:transparent;border:none;transition:background .15s,color .15s;}
.rail-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
.rail-btn.active{background:rgba(255,255,255,.12);color:#fff;}
.rail-btn.active::before{content:"";position:absolute;left:-11px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-2);}
.rail-tip{position:absolute;left:52px;top:50%;transform:translateY(-50%) translateX(-4px);background:var(--rail-bg);color:var(--rail-txt);border:1px solid var(--rail-line);padding:4px 10px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .13s,transform .13s;z-index:80;box-shadow:var(--shadow-md);}
.rail-btn:hover .rail-tip{opacity:1;transform:translateY(-50%) translateX(0);}
.ic{display:block;}

/* ---------- main column ---------- */
.main{display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden;}
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 22px;background:var(--card);border-bottom:1px solid var(--line);}
.tb-left{display:flex;align-items:center;gap:11px;min-width:0;}
.tb-mark{display:inline-flex;align-items:center;gap:10px;}
.tb-logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#20337e);display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm);position:relative;color:#fff;}
.tb-logo svg{display:block;}
.tb-titles{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.tb-t1{font-size:14.5px;font-weight:760;letter-spacing:.01em;white-space:nowrap;}
.tb-t2{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.02em;white-space:nowrap;}
.tb-right{display:flex;align-items:center;gap:13px;}
.tb-import{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);}
.tb-import-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 20%,transparent);}
.tb-import strong{color:var(--ink-2);font-weight:680;}
.tb-divider{width:1px;height:20px;background:var(--line);}
.role-select{display:inline-flex;align-items:center;gap:8px;background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:5px 8px 5px 11px;cursor:pointer;transition:border-color .14s;position:relative;}
.role-select:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
.role-select .rs-lab{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}
.role-select .rs-val{font-size:13px;font-weight:680;color:var(--ink);}
.role-select select{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;}
.role-wrap{position:relative;display:inline-flex;}
.theme-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card-2);color:var(--ink-3);display:grid;place-items:center;transition:border-color .14s,color .14s;}
.theme-btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--ink);}

.disclaimer-bar{flex:none;background:color-mix(in srgb,var(--amber) 14%,var(--card));color:color-mix(in srgb,var(--amber) 70%,var(--ink));font-size:11px;font-weight:600;letter-spacing:.02em;padding:4px 22px;border-bottom:1px solid var(--line);text-align:center;}

.outlet{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:24px 30px 70px;}
.wrap{max-width:1220px;margin:0 auto;}

.powered-by{position:fixed;right:14px;bottom:11px;z-index:60;font-size:11px;font-weight:500;color:var(--ink-3);background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 12px;pointer-events:none;backdrop-filter:blur(4px);}
.powered-by strong{color:var(--accent-2);font-weight:700;}

/* ---------- generic bits ---------- */
.rag{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;vertical-align:middle;}
.rag-red{background:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 18%,transparent);}
.rag-amber{background:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 18%,transparent);}
.rag-green{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent);}
.rag-grey{background:var(--grey);box-shadow:0 0 0 3px color-mix(in srgb,var(--grey) 18%,transparent);}
.tone-red{color:var(--red);}.tone-amber{color:color-mix(in srgb,var(--amber) 82%,var(--ink));}.tone-green{color:var(--green);}.tone-grey{color:var(--ink-3);}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:680;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card-2);white-space:nowrap;}
.pill-red{color:var(--red);border-color:color-mix(in srgb,var(--red) 34%,var(--line));background:color-mix(in srgb,var(--red) 12%,var(--card));}
.pill-amber{color:color-mix(in srgb,var(--amber) 82%,var(--ink));border-color:color-mix(in srgb,var(--amber) 32%,var(--line));background:color-mix(in srgb,var(--amber) 13%,var(--card));}
.pill-green{color:var(--green);border-color:color-mix(in srgb,var(--green) 32%,var(--line));background:color-mix(in srgb,var(--green) 11%,var(--card));}
.pill-grey{color:var(--ink-3);border-color:var(--line);background:var(--card-2);}
.pill-accent{color:var(--accent-2);border-color:color-mix(in srgb,var(--accent) 34%,var(--line));background:color-mix(in srgb,var(--accent) 12%,var(--card));}
.mono{font-family:var(--mono);}

.sec-head{margin:0 0 18px;}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-2);font-weight:750;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.sec-head h1{font-size:26px;letter-spacing:-.02em;}
.sec-head h2{font-size:20px;}
.sec-sub{color:var(--ink-3);font-size:13.5px;margin:6px 0 0;max-width:78ch;line-height:1.55;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm);}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.panel-head h3{font-size:15px;}
.panel-tag{font-size:11px;color:var(--ink-3);font-weight:640;background:var(--card-2);border:1px solid var(--line);padding:3px 10px;border-radius:999px;}

.backbar{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:640;color:var(--ink-3);padding:7px 14px 7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);margin-bottom:18px;transition:color .15s,border-color .15s;cursor:pointer;}
.backbar:hover{color:var(--accent-2);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}

.btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:680;border-radius:10px;padding:9px 15px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);transition:border-color .14s,box-shadow .14s,transform .1s;}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow-sm);color:var(--ink);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-soft);border-color:var(--accent-soft);color:#fff;}

.linkline{display:inline-flex;align-items:center;gap:6px;color:var(--accent-2);font-size:13px;font-weight:680;cursor:pointer;}
.linkline:hover{text-decoration:underline;}

/* traceability ribbon */
.trace{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:9px 8px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-sm);width:fit-content;max-width:100%;margin-bottom:20px;}
.trace-step{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:640;color:var(--ink-2);padding:4px 11px;border-radius:999px;transition:background .14s,color .14s;cursor:pointer;}
.trace-step:hover{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-2);}
.trace-step.here{background:var(--accent);color:#fff;}
.trace-step.here:hover{color:#fff;}
.trace-num{width:17px;height:17px;border-radius:50%;background:color-mix(in srgb,var(--accent) 20%,var(--card));color:var(--accent-2);display:grid;place-items:center;font-size:10px;font-weight:800;}
.trace-step.here .trace-num{background:rgba(255,255,255,.25);color:#fff;}
.trace-arrow{color:var(--ink-3);display:inline-flex;}

/* view transition */
.view-enter{animation:viewIn .3s cubic-bezier(.22,.61,.36,1);}
@keyframes viewIn{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}

/* provenance tag */
.src-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:640;color:var(--ink-3);background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;}
.src-tag .ic{color:var(--accent-2);}

/* =========================================================================
   HOME / OPERATING PICTURE
   ========================================================================= */
.home-hero{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:1000px){.home-hero{grid-template-columns:1fr;}}
.greet-card{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--card)),var(--card));border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.greet-card::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);pointer-events:none;}
.greet-eyebrow{font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);}
.greet-hello{font-size:29px;font-weight:720;letter-spacing:-.02em;margin:6px 0 3px;}
.greet-role{font-size:13.5px;color:var(--ink-3);margin-bottom:18px;position:relative;}
.greet-role strong{color:var(--ink-2);font-weight:680;}
.greet-status{display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative;}
.status-orb{display:flex;align-items:center;gap:13px;padding:12px 18px 12px 14px;border-radius:14px;border:1px solid;position:relative;cursor:pointer;}
.status-orb.amber{background:color-mix(in srgb,var(--amber) 13%,var(--card));border-color:color-mix(in srgb,var(--amber) 36%,var(--line));}
.status-orb.red{background:color-mix(in srgb,var(--red) 13%,var(--card));border-color:color-mix(in srgb,var(--red) 36%,var(--line));}
.status-orb.green{background:color-mix(in srgb,var(--green) 13%,var(--card));border-color:color-mix(in srgb,var(--green) 36%,var(--line));}
.orb-ring{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;}
.orb-ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid;}
.status-orb.amber .orb-ring::before{border-color:var(--amber);animation:pulse 2.6s ease-in-out infinite;}
.status-orb.red .orb-ring::before{border-color:var(--red);animation:pulse 2s ease-in-out infinite;}
.status-orb.green .orb-ring::before{border-color:var(--green);}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--amber) 45%,transparent);}50%{box-shadow:0 0 0 7px transparent;}}
.orb-letter{font-size:20px;font-weight:820;}
.status-orb.amber .orb-letter{color:var(--amber);}
.status-orb.red .orb-letter{color:var(--red);}
.status-orb.green .orb-letter{color:var(--green);}
.orb-text .ot-lab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);}
.orb-text .ot-val{font-size:20px;font-weight:780;letter-spacing:-.01em;line-height:1.1;}
.status-orb.amber .ot-val{color:color-mix(in srgb,var(--amber) 80%,var(--ink));}
.status-orb.red .ot-val{color:color-mix(in srgb,var(--red) 82%,var(--ink));}
.status-orb.green .ot-val{color:var(--green);}
.greet-attention{display:flex;flex-direction:column;gap:2px;}
.ga-line{font-size:14px;color:var(--ink-2);}
.ga-line strong{color:var(--ink);font-weight:740;}
.greet-updated{position:absolute;top:18px;right:20px;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;z-index:2;}

/* ask card */
.ask-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;}
.ask-cap{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.ask-cap .ac-lab{font-size:10.5px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.ask-cap .ac-hint{margin-left:auto;font-size:11px;color:var(--ink-3);}
.ask-box{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;background:var(--card-2);padding:4px 4px 4px 14px;transition:border-color .15s,box-shadow .15s;}
.ask-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);}
.ask-input{flex:1;min-width:0;border:none;background:transparent;font-size:14px;color:var(--ink);padding:8px 0;outline:none;}
.ask-btn{width:36px;height:36px;border-radius:9px;border:none;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;}
.ask-btn:hover{background:var(--accent-soft);}
.ask-suggest{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.ask-chip{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;transition:border-color .14s,color .14s;}
.ask-chip:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent-2);}

/* today's stats row */
.today-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
@media(max-width:1080px){.today-stats{grid-template-columns:repeat(3,1fr);}}
@media(max-width:680px){.today-stats{grid-template-columns:repeat(2,1fr);}}
.stat-tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:15px 16px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden;}
.stat-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--accent) 32%,var(--line));}
.stat-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
.stat-tile.amber::before{background:var(--amber);}.stat-tile.red::before{background:var(--red);}.stat-tile.green::before{background:var(--green);}
.stat-num{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1;}
.stat-tile.amber .stat-num{color:color-mix(in srgb,var(--amber) 84%,var(--ink));}
.stat-tile.red .stat-num{color:var(--red);}
.stat-tile.green .stat-num{color:var(--green);}
.stat-lab{font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.35;font-weight:600;}
.stat-go{position:absolute;right:12px;top:14px;color:var(--ink-3);opacity:0;transition:opacity .14s;}
.stat-tile:hover .stat-go{opacity:1;}

/* section grid */
.home-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start;}
@media(max-width:1000px){.home-grid{grid-template-columns:1fr;}}

/* what changed */
.changed-panel .panel-head{margin-bottom:6px;}
.change-list{display:flex;flex-direction:column;}
.change-row{display:flex;align-items:flex-start;gap:13px;padding:15px 6px;border-top:1px solid var(--line-2);cursor:pointer;transition:background .12s;border-radius:8px;}
.change-row:first-child{border-top:none;}
.change-row:hover{background:color-mix(in srgb,var(--accent) 7%,transparent);}
.change-dir{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;}
.cd-up{background:var(--red);}.cd-new{background:var(--accent);}.cd-down{background:var(--green);}.cd-amber{background:var(--amber);}
.change-main{flex:1;min-width:0;}
.change-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.change-cat{font-size:10.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}
.change-badge{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-2);background:color-mix(in srgb,var(--accent) 15%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));padding:1px 6px;border-radius:4px;}
.change-badge.up{color:var(--red);background:color-mix(in srgb,var(--red) 13%,var(--card));border-color:color-mix(in srgb,var(--red) 30%,var(--line));}
.change-badge.down{color:var(--green);background:color-mix(in srgb,var(--green) 13%,var(--card));border-color:color-mix(in srgb,var(--green) 30%,var(--line));}
.change-title{font-size:15px;font-weight:700;margin:3px 0 2px;}
.change-detail{font-size:12.5px;color:var(--ink-3);line-height:1.45;}
.change-detail strong{color:var(--ink-2);font-weight:680;}
.change-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none;}
.change-open{color:var(--ink-3);display:inline-flex;opacity:0;transition:opacity .14s;}
.change-row:hover .change-open{opacity:1;}

/* right column stack */
.rc-stack{display:flex;flex-direction:column;gap:16px;}
.mini-list{display:flex;flex-direction:column;}
.mini-row{display:flex;align-items:center;gap:11px;padding:11px 4px;border-top:1px solid var(--line-2);cursor:pointer;font-size:13px;}
.mini-row:first-child{border-top:none;}
.mini-row:hover .mini-name{color:var(--accent-2);}
.mini-name{font-weight:660;}
.mini-fill{flex:1;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-tail{font-weight:740;font-size:13px;}
.mini-go{color:var(--ink-3);opacity:0;transition:opacity .12s;}
.mini-row:hover .mini-go{opacity:1;}

/* priorities compact */
.prio-row{display:flex;align-items:flex-start;gap:11px;padding:11px 4px;border-top:1px solid var(--line-2);cursor:pointer;}
.prio-row:first-child{border-top:none;}
.prio-flag{width:8px;height:34px;border-radius:4px;flex:none;margin-top:1px;}
.pf-high{background:var(--red);}.pf-med{background:var(--amber);}.pf-info{background:var(--grey);}
.prio-body{flex:1;min-width:0;}
.prio-title{font-size:13px;font-weight:660;line-height:1.3;}
.prio-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
.prio-due{font-size:11px;font-weight:740;color:var(--accent-2);flex:none;background:color-mix(in srgb,var(--accent) 13%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:999px;padding:2px 9px;}

/* =========================================================================
   MAH grid
   ========================================================================= */
.mah-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;}
.mah-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:0;box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .16s,box-shadow .16s,border-color .16s;position:relative;}
.mah-card.click{cursor:pointer;}
.mah-card.click:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--accent) 32%,var(--line));}
.mah-top{height:5px;}
.mah-top.red{background:var(--red);}.mah-top.amber{background:var(--amber);}.mah-top.green{background:var(--green);}.mah-top.grey{background:var(--grey);}
.mah-inner{padding:16px 17px 15px;}
.mah-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.mah-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 15%,var(--card));color:var(--accent-2);flex:none;}
.mah-name{font-size:16px;font-weight:720;letter-spacing:-.01em;line-height:1.2;}
.mah-code{font-size:11px;color:var(--ink-3);font-family:var(--mono);margin-top:3px;}
.mah-status-word{font-size:11px;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:999px;flex:none;}
.mah-status-word.red{color:var(--red);background:color-mix(in srgb,var(--red) 15%,var(--card));}
.mah-status-word.amber{color:color-mix(in srgb,var(--amber) 82%,var(--ink));background:color-mix(in srgb,var(--amber) 17%,var(--card));}
.mah-status-word.green{color:var(--green);background:color-mix(in srgb,var(--green) 15%,var(--card));}
.mah-status-word.grey{color:var(--ink-3);background:var(--card-2);}
.mah-envelope{font-size:12px;color:var(--ink-3);margin:11px 0 12px;line-height:1.4;min-height:34px;}
.mah-bars{display:flex;align-items:center;gap:4px;margin-bottom:11px;}
.mah-bar-seg{height:6px;border-radius:3px;flex:1;}
.mah-metrics{display:flex;gap:14px;margin-bottom:11px;}
.mah-metric{display:flex;flex-direction:column;}
.mah-metric .mm-n{font-size:17px;font-weight:780;line-height:1;}
.mah-metric .mm-l{font-size:10px;color:var(--ink-3);margin-top:3px;font-weight:600;}
.mah-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:11px;border-top:1px solid var(--line-2);}
.mah-foot-lab{font-size:11.5px;color:var(--ink-3);}
.mah-foot-lab strong{color:var(--ink-2);font-weight:700;}
.mah-trend{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;}
.mah-cta{font-size:12px;font-weight:720;color:var(--accent-2);display:inline-flex;align-items:center;gap:4px;opacity:0;transition:opacity .15s;}
.mah-card.click:hover .mah-cta{opacity:1;}

/* =========================================================================
   CUMULATIVE RISK
   ========================================================================= */
.cum-hero{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:stretch;}
@media(max-width:820px){.cum-hero{grid-template-columns:1fr;}}
.cum-dial{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:24px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.cum-dial .cd-cap{font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;}
.cum-gauge{position:relative;width:180px;height:100px;margin:8px 0 4px;}
.cum-score{font-size:38px;font-weight:820;letter-spacing:-.01em;}
.cum-dial.amber .cum-score{color:color-mix(in srgb,var(--amber) 82%,var(--ink));}
.cum-dial.red .cum-score{color:var(--red);}
.cum-word{font-size:16px;font-weight:800;letter-spacing:.02em;margin-top:2px;}
.cum-dial.amber .cum-word{color:color-mix(in srgb,var(--amber) 82%,var(--ink));}
.cd-note{font-size:12px;color:var(--ink-3);line-height:1.45;margin-top:10px;}
.cd-trend{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-top:12px;padding:4px 11px;border-radius:999px;background:color-mix(in srgb,var(--amber) 14%,var(--card));color:color-mix(in srgb,var(--amber) 82%,var(--ink));border:1px solid color-mix(in srgb,var(--amber) 30%,var(--line));}
.cum-factors{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:18px;}
.cf-intro{font-size:13px;color:var(--ink-2);margin-bottom:14px;line-height:1.5;}
.cf-intro strong{font-weight:720;color:var(--ink);}
.cf-list{display:flex;flex-direction:column;gap:9px;}
.cf-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card-2);cursor:pointer;transition:border-color .14s,box-shadow .14s,transform .12s;}
.cf-item:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line));box-shadow:var(--shadow-sm);transform:translateX(2px);}
.cf-weight{width:44px;flex:none;text-align:center;}
.cf-weight-bar{height:34px;width:8px;border-radius:4px;margin:0 auto 3px;background:linear-gradient(180deg,var(--amber),color-mix(in srgb,var(--amber) 40%,transparent));}
.cf-weight-lab{font-size:9px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;}
.cf-main{flex:1;min-width:0;}
.cf-title{font-size:13.5px;font-weight:680;}
.cf-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
.cf-open{color:var(--ink-3);display:inline-flex;}
.cum-combine{margin-top:16px;padding:14px 16px;border-radius:var(--r-md);background:color-mix(in srgb,var(--amber) 9%,var(--card));border:1px solid color-mix(in srgb,var(--amber) 28%,var(--line));font-size:13px;color:var(--ink-2);line-height:1.55;}
.cum-combine strong{color:var(--ink);font-weight:720;}

/* =========================================================================
   BOWTIE
   ========================================================================= */
.bowtie-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:18px;overflow-x:auto;}
.bt-legend-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:6px;font-size:11.5px;color:var(--ink-3);}
.bt-legend-row .lg{display:inline-flex;align-items:center;gap:6px;}
.bowtie-svg{width:100%;min-width:920px;display:block;font-family:var(--sans);}
.bt-node{cursor:pointer;}
.bt-node rect{transition:filter .14s;}
.bt-node:hover rect{filter:brightness(1.12);}
.bt-conn{fill:none;stroke:var(--line);stroke-width:1.5;}
.bt-lab{font-size:11px;font-weight:640;fill:var(--ink-2);}
.bt-side-title{font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;fill:var(--ink-3);}
.bt-hint{font-size:12px;color:var(--ink-3);margin-top:10px;text-align:center;}

/* =========================================================================
   CONTROLS BOARD
   ========================================================================= */
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.filter-group{display:inline-flex;align-items:center;gap:6px;}
.filter-lab{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);}
.fchip{font-size:12px;font-weight:640;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;transition:all .13s;}
.fchip:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
.fchip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.ctrl-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:1080px){.ctrl-cols{grid-template-columns:repeat(2,1fr);}}
@media(max-width:620px){.ctrl-cols{grid-template-columns:1fr;}}
.ccol{display:flex;flex-direction:column;gap:10px;}
.ccol-head{display:flex;align-items:center;gap:8px;padding:2px 4px;}
.ccol-head .cch-count{font-size:20px;font-weight:780;}
.ccol-head .cch-lab{font-size:12px;font-weight:680;color:var(--ink-2);}
.ccard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--grey);border-radius:var(--r-md);padding:12px 13px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .14s,box-shadow .14s;}
.ccard:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.ccard.red{border-left-color:var(--red);}.ccard.amber{border-left-color:var(--amber);}.ccard.green{border-left-color:var(--green);}.ccard.grey{border-left-color:var(--grey);}
.ccard-name{font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.25;}
.ccard-code{font-size:10.5px;font-family:var(--mono);color:var(--ink-3);margin-top:3px;}
.ccard-status{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-top:8px;display:inline-block;padding:2px 8px;border-radius:5px;}
.ccard-status.red{color:var(--red);background:color-mix(in srgb,var(--red) 13%,var(--card));}
.ccard-status.amber{color:color-mix(in srgb,var(--amber) 82%,var(--ink));background:color-mix(in srgb,var(--amber) 15%,var(--card));}
.ccard-status.green{color:var(--green);background:color-mix(in srgb,var(--green) 13%,var(--card));}
.ccard-reason{font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.4;}
.ccard-foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-2);font-size:11px;color:var(--ink-3);}
.ccard-foot .ic{color:var(--accent-2);}

/* generic detail layout */
.detail-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start;margin-top:4px;}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr;}}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:18px;margin-bottom:16px;}
.dcard-head{font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.kv{display:flex;flex-direction:column;gap:2px;}
.kv-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line-2);font-size:13px;}
.kv-row:first-child{border-top:none;}
.kv-k{color:var(--ink-3);}
.kv-v{font-weight:660;text-align:right;}

/* control effectiveness criteria */
.crit-list{display:flex;flex-direction:column;gap:9px;}
.crit-row{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:12px 13px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card-2);}
@media(max-width:620px){.crit-row{grid-template-columns:1fr;gap:5px;}}
.crit-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px;}
.crit-evidence{font-size:12.5px;color:var(--ink-2);line-height:1.4;}
.crit-status{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:3px 10px;border-radius:999px;text-align:center;flex:none;}
.crit-status.red{color:var(--red);background:color-mix(in srgb,var(--red) 13%,var(--card));}
.crit-status.amber{color:color-mix(in srgb,var(--amber) 82%,var(--ink));background:color-mix(in srgb,var(--amber) 17%,var(--card));}
.crit-status.green{color:var(--green);background:color-mix(in srgb,var(--green) 13%,var(--card));}

.compensate{background:color-mix(in srgb,var(--accent) 8%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 26%,var(--line));border-radius:var(--r-md);padding:14px 16px;}
.compensate .comp-head{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-2);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.comp-item{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);padding:5px 0;}
.comp-item .ic{color:var(--accent-2);margin-top:1px;flex:none;}

.related-list{display:flex;flex-direction:column;gap:8px;}
.rel-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card-2);cursor:pointer;font-size:13px;transition:border-color .14s,transform .12s;}
.rel-item:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line));transform:translateX(2px);}
.rel-item .rel-name{font-weight:640;flex:1;}
.rel-item .rel-go{color:var(--ink-3);}

.evrow{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-top:1px solid var(--line-2);}
.evrow:first-child{border-top:none;}
.evrow-ref{font-family:var(--mono);font-size:11.5px;font-weight:660;color:var(--ink-2);flex:none;min-width:74px;}
.evrow-main{flex:1;min-width:0;}
.evrow-title{font-size:13px;font-weight:640;}
.evrow-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
.evrow-tail{flex:none;}

/* =========================================================================
   PLANT SCHEMATIC
   ========================================================================= */
.plant-wrap{background:linear-gradient(160deg,var(--card),var(--card-2));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:16px;overflow-x:auto;}
.plant-svg{width:100%;min-width:760px;display:block;}
.parea{cursor:pointer;}
.parea rect.pa-block{transition:filter .15s,stroke-width .15s;}
.parea:hover rect.pa-block{filter:brightness(1.14);stroke-width:2.4;}
.pa-pipe{stroke:var(--line);stroke-width:6;fill:none;opacity:.55;}
.pa-title{font-size:13px;font-weight:720;fill:var(--ink);}
.pa-sub{font-size:10px;fill:var(--ink-3);font-weight:600;}
.pa-badge{font-size:10px;font-weight:800;}
.plant-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-3);align-items:center;}
.plant-legend .lg{display:inline-flex;align-items:center;gap:6px;}

/* =========================================================================
   KPI VIEW
   ========================================================================= */
.perf-scorecard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:900px){.perf-scorecard{grid-template-columns:repeat(2,1fr);}}
.perf-tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:15px 16px;box-shadow:var(--shadow-sm);}
.perf-tile .pt-lab{font-size:10.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}
.perf-tile .pt-val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.01em;}
.perf-tile .pt-note{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.4;}
.perf-bar{height:7px;border-radius:4px;background:var(--track);margin-top:10px;overflow:hidden;}
.perf-bar span{display:block;height:100%;border-radius:4px;}

.kpi-section-title{font-size:13px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin:22px 0 12px;display:flex;align-items:center;gap:9px;}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.kpi-grid{grid-template-columns:1fr;}}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 15px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;position:relative;}
.kpi-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--accent) 32%,var(--line));}
.kpi-card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;}
.kpi-card.amber::before{background:var(--amber);}.kpi-card.red::before{background:var(--red);}.kpi-card.green::before{background:var(--green);}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.kpi-name{font-size:12.5px;font-weight:680;color:var(--ink-2);line-height:1.3;max-width:74%;}
.kpi-val{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1;margin:10px 0 2px;}
.kpi-card.amber .kpi-val{color:color-mix(in srgb,var(--amber) 84%,var(--ink));}
.kpi-card.red .kpi-val{color:var(--red);}
.kpi-card.green .kpi-val{color:var(--green);}
.kpi-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;}
.kpi-target{font-size:11px;color:var(--ink-3);}
.kpi-trend{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;}
.kpi-drill{font-size:10.5px;color:var(--accent-2);font-weight:700;margin-top:9px;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .14s;}
.kpi-card:hover .kpi-drill{opacity:1;}

/* KPI drill chain */
.drill-chain{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;}
.dc-node{display:flex;flex-direction:column;gap:4px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card-2);cursor:pointer;transition:border-color .14s,transform .12s;min-width:130px;flex:1;}
.dc-node:hover{border-color:color-mix(in srgb,var(--accent) 42%,var(--line));transform:translateY(-2px);}
.dc-node .dcn-lab{font-size:9.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);}
.dc-node .dcn-val{font-size:13px;font-weight:680;}
.dc-arrow{display:flex;align-items:center;color:var(--ink-3);}

/* =========================================================================
   MANAGEMENT ATTENTION / DECISION QUEUE
   ========================================================================= */
.dq-list{display:flex;flex-direction:column;gap:13px;}
.dq-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:0;overflow:hidden;display:flex;cursor:pointer;transition:transform .14s,box-shadow .14s;}
.dq-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.dq-flag{width:6px;flex:none;}
.dq-flag.high{background:var(--red);}.dq-flag.med{background:var(--amber);}.dq-flag.info{background:var(--grey);}
.dq-body{padding:16px 18px;flex:1;min-width:0;}
